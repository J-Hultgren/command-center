<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = 'https://irmtvjxlntozigbqxhvm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybXR2anhsbnRvemlnYnF4aHZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NTkzMTQsImV4cCI6MjA5MjQzNTMxNH0.nyIZx7Z0GnHEIlZpBlN6TzHHsf7tGuhdvWECdpcQ-a0';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const formatDateLocal = (date) => {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
};

const getWeekStart = (date) => {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d;
};

const MeetingModal = ({ meeting, onSave, onDelete, onClose, deleteInboxItem }) => {
  const [data, setData] = useState({
    id: meeting.id,
    title: meeting.title || '',
    start_time: meeting.start_time || '09:00',
    duration: meeting.duration || 60,
    job: meeting.job || 'green',
    date: meeting.date,
    _fromInbox: meeting._fromInbox
  });

  const handleSave = async () => {
    if (!data.title.trim()) return;
    await onSave(data);
    if (data._fromInbox) deleteInboxItem(data._fromInbox);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>{data.id ? 'Edit Meeting' : 'New Meeting'}</h2>
        <div className="form-group">
          <label>Title</label>
          <input type="text" value={data.title} onChange={(e) => setData({ ...data, title: e.target.value })} placeholder="Meeting title" autoFocus />
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Start Time</label>
            <input type="time" value={data.start_time} onChange={(e) => setData({ ...data, start_time: e.target.value })} />
          </div>
          <div className="form-group">
            <label>Duration (min)</label>
            <input type="number" value={data.duration} onChange={(e) => setData({ ...data, duration: parseInt(e.target.value) || 60 })} min="15" step="15" />
          </div>
        </div>
        <div className="form-group">
          <label>Color</label>
          <div className="color-picker">
            <div className={`color-option green ${data.job === 'green' ? 'selected' : ''}`} onClick={() => setData({ ...data, job: 'green' })}>🟢 Green</div>
            <div className={`color-option blue ${data.job === 'blue' ? 'selected' : ''}`} onClick={() => setData({ ...data, job: 'blue' })}>🔵 Blue</div>
          </div>
        </div>
        <div className="modal-actions spread">
          {data.id ? (<button className="btn btn-danger" onClick={() => onDelete(data.id)}>Delete</button>) : <div></div>}
          <div style={{ display: 'flex', gap: '0.75rem' }}>
            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={handleSave}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const TaskModal = ({ task, onSave, onDelete, onClose }) => {
  const [data, setData] = useState({
    id: task.id,
    title: task.title || '',
    context: task.context || 'general',
    completed: task.completed || false,
    date: task.date
  });

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>{data.id ? 'Edit Task' : 'New Task'}</h2>
        <div className="form-group">
          <label>Task</label>
          <input type="text" value={data.title} onChange={(e) => setData({ ...data, title: e.target.value })} autoFocus />
        </div>
        <div className="form-group">
          <label>Context</label>
          <select value={data.context} onChange={(e) => setData({ ...data, context: e.target.value })}>
            <option value="general">General</option>
            <option value="work-green">Work (Green)</option>
            <option value="work-blue">Work (Blue)</option>
            <option value="trading">Trading</option>
            <option value="health">Health/Gym</option>
            <option value="kids">Kids</option>
            <option value="learning">Learning (Korean)</option>
            <option value="home">Home/Meals</option>
          </select>
        </div>
        <div className="form-group">
          <label>Date</label>
          <input type="date" value={data.date} onChange={(e) => setData({ ...data, date: e.target.value })} />
        </div>
        <div className="modal-actions spread">
          {data.id ? (<button className="btn btn-danger" onClick={() => onDelete(data.id)}>Delete</button>) : <div></div>}
          <div style={{ display: 'flex', gap: '0.75rem' }}>
            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={() => onSave(data)}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const CommandCenter = () => {
  const [view, setView] = useState('day');
  const [currentDate, setCurrentDate] = useState(new Date());
  const [meetings, setMeetings] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [inboxItems, setInboxItems] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [mealPlan, setMealPlan] = useState({});
  const [privacyMode, setPrivacyMode] = useState(false);
  const [toast, setToast] = useState(null);
  const [meetingModal, setMeetingModal] = useState(null);
  const [taskModal, setTaskModal] = useState(null);
  const [brainDumpText, setBrainDumpText] = useState('');
  const [currentReview, setCurrentReview] = useState({ wins: '', improvements: '', focus: '' });

  useEffect(() => { loadAll(); }, [currentDate]);

  const loadAll = async () => {
    await Promise.all([loadMeetings(), loadTasks(), loadInbox(), loadReviews(), loadMealPlan()]);
  };

  const loadMeetings = async () => {
    const { data } = await supabase.from('command_meetings').select('*').order('start_time');
    setMeetings(data || []);
  };

  const loadTasks = async () => {
    const { data } = await supabase.from('command_tasks').select('*').order('created_at');
    setTasks(data || []);
  };

  const loadInbox = async () => {
    const { data } = await supabase.from('inbox_items').select('*').order('created_at', { ascending: false });
    setInboxItems(data || []);
  };

  const loadReviews = async () => {
    const { data } = await supabase.from('weekly_reviews').select('*').order('week_starting', { ascending: false });
    setReviews(data || []);
    const weekStart = formatDateLocal(getWeekStart(currentDate));
    const current = data?.find(r => r.week_starting === weekStart);
    if (current) {
      setCurrentReview({ wins: current.wins || '', improvements: current.improvements || '', focus: current.next_week_focus || '' });
    } else {
      setCurrentReview({ wins: '', improvements: '', focus: '' });
    }
  };

  const loadMealPlan = async () => {
    const { data } = await supabase.from('meal_plans').select('*');
    const map = {};
    data?.forEach(m => { map[m.date] = m.meals; });
    setMealPlan(map);
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2000);
  };

  const saveMeeting = async (meeting) => {
    const dateStr = formatDateLocal(currentDate);
    const [hours, minutes] = meeting.start_time.split(':');
    const startMinutes = parseInt(hours) * 60 + parseInt(minutes);
    const endMinutes = startMinutes + parseInt(meeting.duration);
    const data = {
      date: meeting.date || dateStr,
      title: meeting.title,
      start_time: meeting.start_time,
      duration: parseInt(meeting.duration),
      job: meeting.job,
      start_minutes: startMinutes,
      end_minutes: endMinutes
    };
    if (meeting.id) {
      await supabase.from('command_meetings').update(data).eq('id', meeting.id);
      showToast('Meeting updated');
    } else {
      await supabase.from('command_meetings').insert([data]);
      showToast('Meeting added');
    }
    setMeetingModal(null);
    loadMeetings();
  };

  const deleteMeeting = async (id) => {
    await supabase.from('command_meetings').delete().eq('id', id);
    setMeetingModal(null);
    showToast('Meeting deleted');
    loadMeetings();
  };

  const saveTask = async (task) => {
    const dateStr = formatDateLocal(currentDate);
    const data = {
      date: task.date || dateStr,
      title: task.title,
      context: task.context || 'general',
      completed: task.completed || false
    };
    if (task.id) {
      await supabase.from('command_tasks').update(data).eq('id', task.id);
      showToast('Task updated');
    } else {
      await supabase.from('command_tasks').insert([data]);
      showToast('Task added');
    }
    setTaskModal(null);
    loadTasks();
  };

  const toggleTask = async (task) => {
    await supabase.from('command_tasks').update({ completed: !task.completed }).eq('id', task.id);
    loadTasks();
  };

  const deleteTask = async (id) => {
    await supabase.from('command_tasks').delete().eq('id', id);
    setTaskModal(null);
    showToast('Task deleted');
    loadTasks();
  };

  const addInboxItem = async () => {
    if (!brainDumpText.trim()) return;
    const lines = brainDumpText.split('\n').filter(l => l.trim());
    const items = lines.map(text => ({ text: text.trim() }));
    await supabase.from('inbox_items').insert(items);
    setBrainDumpText('');
    showToast(`Added ${items.length} item${items.length > 1 ? 's' : ''} to inbox`);
    loadInbox();
  };

  const convertInboxToTask = async (item) => {
    const dateStr = formatDateLocal(currentDate);
    await supabase.from('command_tasks').insert([{ date: dateStr, title: item.text, context: 'general', completed: false }]);
    await supabase.from('inbox_items').delete().eq('id', item.id);
    showToast('Converted to task');
    loadAll();
  };

  const convertInboxToMeeting = (item) => {
    setMeetingModal({ title: item.text, start_time: '09:00', duration: 60, job: 'green', _fromInbox: item.id });
  };

  const deleteInboxItem = async (id) => {
    await supabase.from('inbox_items').delete().eq('id', id);
    showToast('Item removed');
    loadInbox();
  };

  const saveReview = async () => {
    const weekStart = formatDateLocal(getWeekStart(currentDate));
    const existing = reviews.find(r => r.week_starting === weekStart);
    const data = {
      week_starting: weekStart,
      wins: currentReview.wins,
      improvements: currentReview.improvements,
      next_week_focus: currentReview.focus
    };
    if (existing) {
      await supabase.from('weekly_reviews').update(data).eq('id', existing.id);
    } else {
      await supabase.from('weekly_reviews').insert([data]);
    }
    showToast('Review saved');
    loadReviews();
  };

  const saveMeal = async (date, mealType, value) => {
    const existing = mealPlan[date] || {};
    const updated = { ...existing, [mealType]: value };
    const { data } = await supabase.from('meal_plans').select('*').eq('date', date).maybeSingle();
    if (data) {
      await supabase.from('meal_plans').update({ meals: updated }).eq('id', data.id);
    } else {
      await supabase.from('meal_plans').insert([{ date, meals: updated }]);
    }
    setMealPlan({ ...mealPlan, [date]: updated });
  };

  const loadReview = (review) => {
    setCurrentDate(new Date(review.week_starting));
    setCurrentReview({ wins: review.wins || '', improvements: review.improvements || '', focus: review.next_week_focus || '' });
  };

  const generateTimeSlots = () => {
    const slots = [];
    for (let hour = 7; hour <= 22; hour++) {
      for (let min of [0, 30]) {
        slots.push(`${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`);
      }
    }
    return slots;
  };

  const timeSlots = generateTimeSlots();
  const todayMeetings = meetings.filter(m => m.date === formatDateLocal(currentDate));
  const todayTasks = tasks.filter(t => t.date === formatDateLocal(currentDate));

  const navigateDate = (direction) => {
    const d = new Date(currentDate);
    if (view === 'day') d.setDate(d.getDate() + direction);
    else if (view === 'week') d.setDate(d.getDate() + (direction * 7));
    else if (view === 'month') d.setMonth(d.getMonth() + direction);
    setCurrentDate(d);
  };

  return (
    <div className="app">
      <header className="header">
        <div className="header-content">
          <h1><span>⚡</span>Command Center</h1>
          <div className="date-nav">
            <button onClick={() => navigateDate(-1)}>←</button>
            <span className="current-date">
              {view === 'day' && currentDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
              {view === 'week' && `Week of ${getWeekStart(currentDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`}
              {view === 'month' && currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
              {view === 'inbox' && 'Brain Dump'}
              {view === 'review' && 'Weekly Review'}
            </span>
            <button onClick={() => navigateDate(1)}>→</button>
            <button onClick={() => setCurrentDate(new Date())}>Today</button>
          </div>
          <div className="header-actions">
            <button className={`privacy-toggle ${privacyMode ? 'active' : ''}`} onClick={() => setPrivacyMode(!privacyMode)}>
              {privacyMode ? '🔒 Private' : '👁️ Show'}
            </button>
          </div>
        </div>
      </header>

      <div className="tabs">
        <div className="tabs-content">
          <button className={`tab-btn ${view === 'day' ? 'active' : ''}`} onClick={() => setView('day')}>📅 Day</button>
          <button className={`tab-btn ${view === 'week' ? 'active' : ''}`} onClick={() => setView('week')}>📆 Week</button>
          <button className={`tab-btn ${view === 'month' ? 'active' : ''}`} onClick={() => setView('month')}>🗓️ Month</button>
          <button className={`tab-btn ${view === 'inbox' ? 'active' : ''}`} onClick={() => setView('inbox')}>
            📥 Inbox {inboxItems.length > 0 && <span className="inbox-badge">{inboxItems.length}</span>}
          </button>
          <button className={`tab-btn ${view === 'review' ? 'active' : ''}`} onClick={() => setView('review')}>📋 Review</button>
        </div>
      </div>

      <main className="main">
        {view === 'day' && (
          <>
            <div className="day-view">
              <div className="day-header-bar">
                <div className="day-title">
                  {currentDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}
                </div>
                <button className="add-meeting-btn" onClick={() => setMeetingModal({ start_time: '09:00', duration: 60, job: 'green' })}>+ Meeting</button>
              </div>
              <div className="time-column">
                {timeSlots.map(time => (<div key={time} className="time-slot">{time}</div>))}
              </div>
              <div className="events-container">
                <div className="events-grid">
                  {timeSlots.map((time) => {
                    const slotMinutes = parseInt(time.split(':')[0]) * 60 + parseInt(time.split(':')[1]);
                    const meetingStartingHere = todayMeetings.find(m => {
                      const [mh, mm] = m.start_time.split(':');
                      return parseInt(mh) * 60 + parseInt(mm) === slotMinutes;
                    });
                    return (
                      <div key={time} className="event-row">
                        {meetingStartingHere && (
                          <div
                            className={`meeting-block color-${meetingStartingHere.job} ${privacyMode ? 'privacy-blur' : ''}`}
                            style={{ height: `${(meetingStartingHere.duration / 30) * 60 - 4}px`, top: '2px' }}
                            onClick={() => setMeetingModal(meetingStartingHere)}
                          >
                            <div className="meeting-time">{meetingStartingHere.start_time} • {meetingStartingHere.duration}min</div>
                            <div className="meeting-title">{meetingStartingHere.title}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="tasks-panel">
              <h3>📋 Tasks</h3>
              <div className="task-input-wrapper">
                <input
                  type="text"
                  placeholder="Add a task for this day..."
                  onKeyPress={(e) => {
                    if (e.key === 'Enter' && e.target.value.trim()) {
                      saveTask({ title: e.target.value, date: formatDateLocal(currentDate) });
                      e.target.value = '';
                    }
                  }}
                />
              </div>
              {todayTasks.length === 0 ? (
                <p className="empty-state">No tasks for this day. Add one above or convert from inbox.</p>
              ) : (
                todayTasks.map(task => (
                  <div key={task.id} className={`task-item ${task.completed ? 'completed' : ''}`}>
                    <div className="checkbox-wrapper">
                      <input type="checkbox" checked={task.completed} onChange={() => toggleTask(task)} />
                      <span className="checkbox-display"></span>
                    </div>
                    <div className="task-content" onClick={() => setTaskModal(task)}>
                      <div className="task-title">{task.title}</div>
                      <div className="task-meta">
                        <span className="task-context-tag">{task.context}</span>
                      </div>
                    </div>
                    <div className="task-actions">
                      <button className="btn-ghost" onClick={() => setTaskModal(task)}>✏️</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </>
        )}

        {view === 'week' && (
          <div className="week-view">
            <h2 style={{ fontFamily: 'Syne', fontSize: '1.25rem', fontWeight: 700, marginBottom: '0.5rem' }}>
              Week of {getWeekStart(currentDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
            </h2>
            <div className="week-grid">
              {Array.from({ length: 7 }, (_, i) => {
                const d = new Date(getWeekStart(currentDate));
                d.setDate(d.getDate() + i);
                const dateStr = formatDateLocal(d);
                const dayMeetings = meetings.filter(m => m.date === dateStr);
                const dayTaskCount = tasks.filter(t => t.date === dateStr && !t.completed).length;
                const isToday = d.toDateString() === new Date().toDateString();
                return (
                  <div key={dateStr} className={`day-card ${isToday ? 'today' : ''}`} onClick={() => { setCurrentDate(d); setView('day'); }}>
                    <h3>{d.toLocaleDateString('en-US', { weekday: 'short' })}</h3>
                    <div className="day-num">{d.getDate()}</div>
                    {dayMeetings.length > 0 && (
                      <div className="events-list">
                        {dayMeetings.slice(0, 4).map((m, idx) => (
                          <div key={idx} className="event-mini">
                            <span className={`event-dot ${m.job}`}></span>
                            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                              {privacyMode ? '••••' : m.title}
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                    {dayTaskCount > 0 && (
                      <div style={{ marginTop: '0.5rem', fontSize: '0.7rem', color: '#FF6B35', fontWeight: 600 }}>
                        {dayTaskCount} task{dayTaskCount > 1 ? 's' : ''}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {view === 'month' && (
          <div className="month-view">
            <h2 style={{ fontFamily: 'Syne', fontSize: '1.25rem', fontWeight: 700 }}>
              {currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
            </h2>
            <div className="month-grid">
              {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (<div key={d} className="month-day-header">{d}</div>))}
              {(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const days = [];
                for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
                for (let i = 1; i <= lastDay.getDate(); i++) days.push(new Date(year, month, i));
                return days.map((day, idx) => {
                  if (!day) return <div key={`empty-${idx}`} className="month-day other-month"></div>;
                  const dateStr = formatDateLocal(day);
                  const dayMeetings = meetings.filter(m => m.date === dateStr);
                  const isToday = day.toDateString() === new Date().toDateString();
                  return (
                    <div key={dateStr} className={`month-day ${isToday ? 'today' : ''}`} onClick={() => { setCurrentDate(day); setView('day'); }}>
                      <div className="month-day-num">{day.getDate()}</div>
                      <div className="month-day-events">
                        {dayMeetings.slice(0, 3).map((m, i) => (<div key={i} className={`month-event-pill ${m.job}`}></div>))}
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          </div>
        )}

        {view === 'inbox' && (
          <div className="inbox-view">
            <div className="inbox-header">
              <div>
                <h2>📥 Inbox</h2>
                <p>Brain dump everything. Convert to tasks/meetings later.</p>
              </div>
            </div>
            <div className="brain-dump-area">
              <textarea
                value={brainDumpText}
                onChange={(e) => setBrainDumpText(e.target.value)}
                placeholder="Dump everything here. One thought per line. Don't filter, just capture..."
              />
              <div className="brain-dump-actions">
                <button className="btn btn-ghost" onClick={() => setBrainDumpText('')}>Clear</button>
                <button className="btn btn-primary" onClick={addInboxItem}>Add to Inbox</button>
              </div>
            </div>
            {inboxItems.length === 0 ? (
              <p className="empty-state">Inbox is empty. Capture thoughts above when they come.</p>
            ) : (
              <>
                <h3 style={{ fontFamily: 'Syne', fontSize: '1rem', fontWeight: 600, marginBottom: '1rem', color: '#0F172A' }}>
                  {inboxItems.length} item{inboxItems.length !== 1 ? 's' : ''} to process
                </h3>
                {inboxItems.map(item => (
                  <div key={item.id} className="inbox-item">
                    <div className="inbox-item-content">
                      <div className="inbox-item-text">{item.text}</div>
                      <div className="inbox-item-time">
                        {new Date(item.created_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}
                      </div>
                    </div>
                    <div className="inbox-item-actions">
                      <button className="inbox-action" onClick={() => convertInboxToTask(item)}>→ Task</button>
                      <button className="inbox-action" onClick={() => convertInboxToMeeting(item)}>→ Meeting</button>
                      <button className="inbox-action danger" onClick={() => deleteInboxItem(item.id)}>Delete</button>
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>
        )}

        {view === 'review' && (
          <div className="review-view">
            <div className="inbox-header">
              <div>
                <h2 style={{ fontFamily: 'Syne', fontSize: '1.5rem', fontWeight: 700, color: '#0F172A' }}>📋 Weekly Review</h2>
                <p style={{ fontSize: '0.875rem', color: '#6B7280', marginTop: '0.25rem' }}>
                  Week of {getWeekStart(currentDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
                </p>
              </div>
              <button className="btn btn-primary" onClick={saveReview}>Save Review</button>
            </div>
            <div className="review-section">
              <h3>✨ This Week's Wins</h3>
              <textarea value={currentReview.wins} onChange={(e) => setCurrentReview({ ...currentReview, wins: e.target.value })} placeholder="What went well this week?" />
            </div>
            <div className="review-section">
              <h3>🔧 Areas to Improve</h3>
              <textarea value={currentReview.improvements} onChange={(e) => setCurrentReview({ ...currentReview, improvements: e.target.value })} placeholder="What could have gone better?" />
            </div>
            <div className="review-section">
              <h3>🎯 Next Week's Focus</h3>
              <textarea value={currentReview.focus} onChange={(e) => setCurrentReview({ ...currentReview, focus: e.target.value })} placeholder="Top 3 priorities?" />
            </div>
            <div className="review-section">
              <h3>🍽️ Meal Plan - Next Week</h3>
              <div className="meal-plan-grid">
                {Array.from({ length: 7 }, (_, i) => {
                  const d = new Date(getWeekStart(currentDate));
                  d.setDate(d.getDate() + i + 7);
                  const dateStr = formatDateLocal(d);
                  const meals = mealPlan[dateStr] || {};
                  return (
                    <div key={dateStr} className="meal-day">
                      <h4>{d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}</h4>
                      <input type="text" className="meal-input" placeholder="Breakfast" value={meals.breakfast || ''} onChange={(e) => saveMeal(dateStr, 'breakfast', e.target.value)} />
                      <input type="text" className="meal-input" placeholder="Lunch" value={meals.lunch || ''} onChange={(e) => saveMeal(dateStr, 'lunch', e.target.value)} />
                      <input type="text" className="meal-input" placeholder="Dinner" value={meals.dinner || ''} onChange={(e) => saveMeal(dateStr, 'dinner', e.target.value)} />
                    </div>
                  );
                })}
              </div>
            </div>
            {reviews.length > 0 && (
              <div className="review-history">
                <h3 style={{ fontFamily: 'Syne', fontSize: '1.125rem', fontWeight: 700, marginBottom: '1rem', color: '#0F172A' }}>📚 Past Reviews</h3>
                {reviews.map(r => (
                  <div key={r.id} className="review-card" onClick={() => loadReview(r)}>
                    <div className="review-card-date">
                      Week of {new Date(r.week_starting + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                    </div>
                    <div className="review-card-preview">
                      {r.next_week_focus?.substring(0, 100) || r.wins?.substring(0, 100) || 'Click to view...'}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </main>

      {meetingModal && (<MeetingModal meeting={meetingModal} onSave={saveMeeting} onDelete={deleteMeeting} onClose={() => setMeetingModal(null)} deleteInboxItem={deleteInboxItem} />)}
      {taskModal && (<TaskModal task={taskModal} onSave={saveTask} onDelete={deleteTask} onClose={() => setTaskModal(null)} />)}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
};

ReactDOM.render(<CommandCenter />, document.getElementById('root'));
</script>
</body>
</html>
