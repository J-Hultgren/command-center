<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<title>Command Center</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#F5F1EA"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Command Center"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23F5F1EA' width='32' height='32' rx='8'/><circle cx='16' cy='16' r='6' fill='%23E8859A'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #F5F1EA;
  --bg-card: #FFFFFF;
  --bg-soft: #FAF7F2;
  --border: #E8E2D7;
  --border-soft: #F0EBE0;
  --text: #1F1B16;
  --text-soft: #5C544A;
  --text-muted: #9B9388;
  --accent: #FF7A59;
  --accent-soft: #FFE8E0;

  /* Structured-style vibrant category colors */
  --c-coral: #FF7A6B;
  --c-coral-bg: #FFE5E0;
  --c-mint: #5DCFA0;
  --c-mint-bg: #DCF4E8;
  --c-sky: #6BB7E8;
  --c-sky-bg: #DCEAF6;
  --c-lavender: #A892E8;
  --c-lavender-bg: #E8DEF7;
  --c-amber: #F5B544;
  --c-amber-bg: #FCEBC8;
  --c-rose: #E8859A;
  --c-rose-bg: #FAE0E5;
  --c-teal: #4FBDBA;
  --c-teal-bg: #D5EFEE;
  --c-slate: #8A8A8A;
  --c-slate-bg: #ECECEC;

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow-sm: 0 1px 2px rgba(31, 27, 22, 0.06);
  --shadow: 0 4px 16px rgba(31, 27, 22, 0.08);
  --shadow-lg: 0 12px 32px rgba(31, 27, 22, 0.12);
}

[data-theme="dark"] {
  --bg: #1A1815;
  --bg-card: #25221E;
  --bg-soft: #1F1D1A;
  --border: #3A3530;
  --border-soft: #2D2A26;
  --text: #F2EDE5;
  --text-soft: #C4BEB3;
  --text-muted: #807A70;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(155, 147, 136, 0.3); border-radius: 3px; }

input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }

.app { min-height: 100vh; padding-bottom: 100px; }

/* Top header */
.top-bar {
  padding: 1.25rem 1.25rem 0.75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.greeting { display: flex; align-items: center; gap: 0.6rem; }
.greeting-text {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--text);
  letter-spacing: -0.01em;
}

.greeting-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 1px;
}

.top-actions { display: flex; gap: 0.4rem; align-items: center; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: all 0.2s;
  color: var(--text-soft);
}

.icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }

/* Big page title */
.page-title-area { padding: 0.5rem 1.25rem 1rem; }
.page-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: 2.25rem;
  color: var(--text);
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.page-subtitle {
  color: var(--text-muted);
  font-size: 0.875rem;
  margin-top: 0.4rem;
  font-weight: 500;
}

/* Date pill nav */
.date-nav-pills {
  padding: 0 1.25rem 1rem;
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  scrollbar-width: none;
}

.date-nav-pills::-webkit-scrollbar { display: none; }

.date-pill {
  flex-shrink: 0;
  padding: 0.6rem 0.8rem;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border);
  cursor: pointer;
  text-align: center;
  min-width: 56px;
  transition: all 0.2s;
}

.date-pill .pill-dow {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.date-pill .pill-num {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
}

.date-pill.today { background: var(--text); color: white; border-color: var(--text); }
.date-pill.today .pill-dow,
.date-pill.today .pill-num { color: white; }

.date-pill.selected:not(.today) {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.date-pill.selected:not(.today) .pill-num { color: var(--accent); }
.date-pill.selected:not(.today) .pill-dow { color: var(--accent); }

/* Tabs */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: 0.5rem 1rem 1rem;
  display: flex;
  justify-content: space-around;
  z-index: 100;
  backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.95);
}

[data-theme="dark"] .tab-bar { background: rgba(37, 34, 30, 0.95); }

.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  padding: 0.6rem 0.4rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.65rem;
  font-weight: 600;
  transition: all 0.2s;
  position: relative;
  border-radius: 12px;
}

.tab-btn .tab-icon { font-size: 1.3rem; line-height: 1; }
.tab-btn:hover { color: var(--text-soft); }
.tab-btn.active { color: var(--accent); }
.tab-btn.active .tab-icon { transform: scale(1.1); }
.tab-btn.has-badge::after {
  content: attr(data-count);
  position: absolute;
  top: 4px;
  right: calc(50% - 18px);
  background: var(--c-coral);
  color: white;
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 10px;
  font-weight: 700;
  min-width: 16px;
  text-align: center;
}

/* Content container */
.content { padding: 0 1.25rem; max-width: 700px; margin: 0 auto; }

/* Visual timeline (Structured-inspired) */
.timeline {
  position: relative;
  padding: 0.5rem 0;
}

.timeline-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
  align-items: stretch;
  position: relative;
}

.timeline-time {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  padding-top: 1rem;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.timeline-time.now {
  color: var(--accent);
  font-weight: 700;
}

.timeline-empty-slot {
  background: transparent;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  opacity: 0;
}

.timeline-row:hover .timeline-empty-slot { opacity: 1; }
.timeline-empty-slot:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* Timeline event card */
.event-card {
  border-radius: var(--radius);
  padding: 0.85rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  min-height: 56px;
}

.event-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.event-card.privacy-blur { filter: blur(5px); }

.event-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.55);
}

.event-content { flex: 1; min-width: 0; }

.event-title {
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--text);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.event-meta {
  font-size: 0.72rem;
  color: var(--text-soft);
  font-weight: 500;
  display: flex;
  gap: 0.4rem;
  align-items: center;
}

.event-duration-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

/* Color variants */
.color-coral { background: var(--c-coral-bg); }
.color-coral .event-duration-bar { background: var(--c-coral); }
.color-coral .event-icon { background: var(--c-coral); color: white; }

.color-mint { background: var(--c-mint-bg); }
.color-mint .event-duration-bar { background: var(--c-mint); }
.color-mint .event-icon { background: var(--c-mint); color: white; }

.color-sky { background: var(--c-sky-bg); }
.color-sky .event-duration-bar { background: var(--c-sky); }
.color-sky .event-icon { background: var(--c-sky); color: white; }

.color-lavender { background: var(--c-lavender-bg); }
.color-lavender .event-duration-bar { background: var(--c-lavender); }
.color-lavender .event-icon { background: var(--c-lavender); color: white; }

.color-amber { background: var(--c-amber-bg); }
.color-amber .event-duration-bar { background: var(--c-amber); }
.color-amber .event-icon { background: var(--c-amber); color: white; }

.color-rose { background: var(--c-rose-bg); }
.color-rose .event-duration-bar { background: var(--c-rose); }
.color-rose .event-icon { background: var(--c-rose); color: white; }

.color-teal { background: var(--c-teal-bg); }
.color-teal .event-duration-bar { background: var(--c-teal); }
.color-teal .event-icon { background: var(--c-teal); color: white; }

.color-slate { background: var(--c-slate-bg); }
.color-slate .event-duration-bar { background: var(--c-slate); }
.color-slate .event-icon { background: var(--c-slate); color: white; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-muted);
}

.empty-state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-state-title { font-weight: 700; color: var(--text-soft); margin-bottom: 0.25rem; font-size: 1rem; }
.empty-state-text { font-size: 0.85rem; }

/* FAB */
.fab {
  position: fixed;
  bottom: 90px;
  right: 1.25rem;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--text);
  color: white;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-weight: 300;
}

.fab:hover { transform: scale(1.05); }

/* Stats cards */
.stats-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  cursor: pointer;
  transition: all 0.2s;
}

.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.stat-icon-wrap {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
}

.stat-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; color: var(--text); margin-top: 0.15rem; line-height: 1; }
.stat-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; }

/* Inbox - GTD style */
.brain-dump {
  background: linear-gradient(135deg, var(--c-amber-bg), #FFF5DC);
  border: 2px dashed var(--c-amber);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1.25rem;
}

.brain-dump-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  font-size: 0.85rem;
  color: #8B6F2A;
  margin-bottom: 0.5rem;
}

.brain-dump textarea {
  width: 100%;
  min-height: 100px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.95rem;
  resize: vertical;
  color: var(--text);
}

.brain-dump textarea:focus { outline: none; }
.brain-dump textarea::placeholder { color: #B58105; }

.brain-dump-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.75rem; }

.btn {
  padding: 0.65rem 1rem;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.btn-primary { background: var(--text); color: white; }
.btn-primary:hover { background: #000; transform: translateY(-1px); }

.btn-soft { background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }
.btn-soft:hover { background: var(--border-soft); }

.btn-ghost { background: transparent; color: var(--text-muted); border: none; padding: 0.4rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
.btn-ghost:hover { color: var(--text); }

.btn-danger { background: var(--c-coral); color: white; }
.btn-danger:hover { background: #E5685A; }

/* Inbox items */
.inbox-list { display: flex; flex-direction: column; gap: 0.5rem; }

.inbox-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.85rem 1rem;
  transition: all 0.2s;
  cursor: pointer;
}

.inbox-card:hover { border-color: var(--text-muted); }
.inbox-card.expanded { border-color: var(--accent); box-shadow: var(--shadow); }
.inbox-card.starred { background: linear-gradient(135deg, #FFFAF0, var(--bg-card)); border-color: var(--c-amber); }

.inbox-card-row {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
}

.inbox-circle {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 50%;
  flex-shrink: 0;
  cursor: pointer;
  margin-top: 1px;
  background: var(--bg-card);
  transition: all 0.2s;
}

.inbox-circle:hover { border-color: var(--c-mint); background: var(--c-mint-bg); }

.inbox-main { flex: 1; min-width: 0; }

.inbox-title {
  font-weight: 600;
  color: var(--text);
  font-size: 0.95rem;
  word-break: break-word;
  line-height: 1.35;
}

.inbox-pills { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; align-items: center; }

.inbox-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0.25rem 0.6rem;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
}

.inbox-pill.high { background: var(--c-coral-bg); color: #B83A2C; }
.inbox-pill.medium { background: var(--c-amber-bg); color: #8B6F2A; }
.inbox-pill.low { background: var(--c-mint-bg); color: #2D7A56; }
.inbox-pill.due-overdue { background: var(--c-coral-bg); color: #B83A2C; font-weight: 700; }
.inbox-pill.due-today { background: var(--c-amber-bg); color: #8B6F2A; font-weight: 700; }
.inbox-pill.due-future { background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }

.inbox-tag-empty { font-size: 0.7rem; color: var(--text-muted); font-style: italic; }

.star-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 1.15rem;
  padding: 0;
  line-height: 1;
  opacity: 0.35;
  transition: opacity 0.2s;
  color: var(--c-amber);
  flex-shrink: 0;
}

.star-btn.starred { opacity: 1; }
.star-btn:hover { opacity: 0.85; }

.inbox-expand {
  margin-top: 0.85rem;
  padding-top: 0.85rem;
  border-top: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.detail-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 0.5rem;
  align-items: center;
}

.detail-row label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

.detail-row input,
.detail-row select,
.detail-row textarea {
  padding: 0.5rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  background: var(--bg-soft);
  color: var(--text);
  width: 100%;
}

.detail-row textarea { min-height: 60px; resize: vertical; }

.detail-row input:focus,
.detail-row select:focus,
.detail-row textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-card);
}

.expand-actions {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-top: 0.25rem;
}

/* Filter chips */
.filter-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 1rem;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 0.25rem;
}

.filter-row::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 0.45rem 0.85rem;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--bg-card);
  border: 1px solid var(--border);
  cursor: pointer;
  color: var(--text-soft);
  white-space: nowrap;
  transition: all 0.2s;
}

.chip:hover { border-color: var(--text-muted); }
.chip.active { background: var(--text); color: white; border-color: var(--text); }

.sort-select {
  padding: 0.45rem 0.7rem;
  border-radius: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--text-soft);
  font-family: inherit;
  margin-left: auto;
  flex-shrink: 0;
}

/* Section heading */
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 1.25rem 0 0.75rem;
}

.section-heading h2 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--text);
  letter-spacing: -0.01em;
}

/* Categories sidebar / list */
.cat-list { display: flex; flex-direction: column; gap: 0.4rem; }

.cat-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.cat-row:hover { border-color: var(--text-muted); }

.cat-icon-wrap {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  color: white;
  flex-shrink: 0;
}

.cat-text { flex: 1; }
.cat-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
.cat-count { font-size: 0.7rem; color: var(--text-muted); }

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const SUPABASE_URL = 'https://irmtvjxlntozigbqxhvm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybXR2anhsbnRvemlnYnF4aHZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NTkzMTQsImV4cCI6MjA5MjQzNTMxNH0.nyIZx7Z0GnHEIlZpBlN6TzHHsf7tGuhdvWECdpcQ-a0';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = [
  { id: 'coral', label: 'Coral', icon: '🌸' },
  { id: 'mint', label: 'Mint', icon: '🌿' },
  { id: 'sky', label: 'Sky', icon: '☁️' },
  { id: 'lavender', label: 'Lavender', icon: '🪻' },
  { id: 'amber', label: 'Amber', icon: '🌟' },
  { id: 'rose', label: 'Rose', icon: '💗' },
  { id: 'teal', label: 'Teal', icon: '🌊' },
  { id: 'slate', label: 'Slate', icon: '⚫' }
];

const ICONS = ['💼', '📊', '🧪', '⚗️', '📞', '💻', '✏️', '📝', '🏃', '💪', '🧘', '🍽️', '🍳', '☕', '👨‍👩‍👧', '🎂', '🎁', '✈️', '🎵', '🎬', '📚', '🇰🇷', '📈', '💰', '🛒', '🏠', '🐕', '⛪', '💊', '🦷', '✂️', '💅', '⏰', '🎯', '🎨', '🌟', '❤️', '🔥', '⚡', '💡', '📌', '✅'];

const CATEGORIES = [
  { id: 'work-mint',     label: 'Work · Mint',          icon: '💼', color: 'mint' },
  { id: 'work-sky',      label: 'Work · Sky',           icon: '🧪', color: 'sky' },
  { id: 'trading',       label: 'Trading',              icon: '📈', color: 'amber' },
  { id: 'health',        label: 'Health & Gym',         icon: '💪', color: 'rose' },
  { id: 'kids',          label: 'Kids',                 icon: '👨‍👩‍👧', color: 'coral' },
  { id: 'learning',      label: 'Korean / Learning',    icon: '📚', color: 'lavender' },
  { id: 'home',          label: 'Home & Meals',         icon: '🏠', color: 'teal' },
  { id: 'general',       label: 'General',              icon: '📌', color: 'slate' }
];

const getCategoryById = (id) => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];

const formatDateLocal = (date) => {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
};

const getWeekStart = (date) => {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d;
};

const minutesFromTime = (t) => {
  const [h, m] = t.split(':');
  return parseInt(h) * 60 + parseInt(m);
};

// Compute meeting layouts (overlap support)
const computeMeetingLayouts = (meetings) => {
  if (!meetings.length) return [];
  const enriched = meetings.map(m => ({ ...m, _start: minutesFromTime(m.start_time), _end: minutesFromTime(m.start_time) + m.duration }));
  enriched.sort((a, b) => a._start - b._start);
  return enriched.map(meeting => {
    const overlapping = enriched.filter(m => m._start < meeting._end && m._end > meeting._start);
    overlapping.sort((a, b) => a._start - b._start);
    const colIdx = overlapping.findIndex(m => (m.id && m.id === meeting.id) || (m === meeting));
    return { ...meeting, _col: Math.max(colIdx, 0), _totalCols: overlapping.length || 1 };
  });
};

// Recurrence check
const meetingOccursOn = (meeting, dateStr) => {
  if (!meeting.recurrence || meeting.recurrence === 'none') return meeting.date === dateStr;
  const meetingDate = new Date(meeting.date + 'T00:00:00');
  const checkDate = new Date(dateStr + 'T00:00:00');
  if (checkDate < meetingDate) return false;
  if (meeting.recurrence_end) {
    const endDate = new Date(meeting.recurrence_end + 'T00:00:00');
    if (checkDate > endDate) return false;
  }
  const dayDiff = Math.floor((checkDate - meetingDate) / (1000 * 60 * 60 * 24));
  switch (meeting.recurrence) {
    case 'daily': return true;
    case 'weekdays': return checkDate.getDay() >= 1 && checkDate.getDay() <= 5;
    case 'weekly': return dayDiff % 7 === 0;
    case 'biweekly': return dayDiff % 14 === 0;
    case 'monthly': return checkDate.getDate() === meetingDate.getDate();
    default: return false;
  }
};

const App = () => {
  const [view, setView] = useState('inbox');
  const [currentDate, setCurrentDate] = useState(new Date());
  const [meetings, setMeetings] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [inboxItems, setInboxItems] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [mealPlan, setMealPlan] = useState({});
  const [privacyMode, setPrivacyMode] = useState(false);
  const [theme, setTheme] = useState(localStorage.getItem('cc-theme') || 'light');
  const [toast, setToast] = useState(null);
  const [meetingModal, setMeetingModal] = useState(null);
  const [taskModal, setTaskModal] = useState(null);
  const [brainDumpText, setBrainDumpText] = useState('');
  const [currentReview, setCurrentReview] = useState({ wins: '', improvements: '', focus: '' });
  const [inboxFilter, setInboxFilter] = useState('all');
  const [inboxSort, setInboxSort] = useState('newest');
  const [expandedInboxId, setExpandedInboxId] = useState(null);
  const [newTaskCategory, setNewTaskCategory] = useState('general');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('cc-theme', theme);
  }, [theme]);

  useEffect(() => { loadAll(); }, []);

  const loadAll = async () => {
    await Promise.all([loadMeetings(), loadTasks(), loadInbox(), loadReviews(), loadMealPlan()]);
  };

  const loadMeetings = async () => {
    const { data } = await supabase.from('command_meetings').select('*').order('start_time');
    setMeetings(data || []);
  };
  const loadTasks = async () => {
    const { data } = await supabase.from('command_tasks').select('*').order('created_at');
    setTasks(data || []);
  };
  const loadInbox = async () => {
    const { data } = await supabase.from('inbox_items').select('*').order('created_at', { ascending: false });
    setInboxItems(data || []);
  };
  const loadReviews = async () => {
    const { data } = await supabase.from('weekly_reviews').select('*').order('week_starting', { ascending: false });
    setReviews(data || []);
    const weekStart = formatDateLocal(getWeekStart(currentDate));
    const current = data?.find(r => r.week_starting === weekStart);
    if (current) setCurrentReview({ wins: current.wins || '', improvements: current.improvements || '', focus: current.next_week_focus || '' });
    else setCurrentReview({ wins: '', improvements: '', focus: '' });
  };
  const loadMealPlan = async () => {
    const { data } = await supabase.from('meal_plans').select('*');
    const map = {};
    data?.forEach(m => { map[m.date] = m.meals; });
    setMealPlan(map);
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2000);
  };

  const saveMeeting = async (m) => {
    const data = {
      date: m.date || formatDateLocal(currentDate),
      title: m.title,
      start_time: m.start_time,
      duration: parseInt(m.duration),
      job: m.job,
      icon: m.icon || '📅',
      start_minutes: minutesFromTime(m.start_time),
      end_minutes: minutesFromTime(m.start_time) + parseInt(m.duration),
      recurrence: m.recurrence || 'none',
      recurrence_end: m.recurrence_end || null
    };
    if (m.id) await supabase.from('command_meetings').update(data).eq('id', m.id);
    else await supabase.from('command_meetings').insert([data]);
    showToast(m.id ? 'Updated' : 'Added');
    setMeetingModal(null);
    loadMeetings();
    if (m._fromInbox) deleteInboxItem(m._fromInbox);
  };

  const deleteMeeting = async (id) => {
    await supabase.from('command_meetings').delete().eq('id', id);
    setMeetingModal(null);
    showToast('Deleted');
    loadMeetings();
  };

  const saveTask = async (t) => {
    const data = {
      date: t.date || formatDateLocal(currentDate),
      title: t.title,
      context: t.context || 'general',
      completed: t.completed || false
    };
    if (t.id) await supabase.from('command_tasks').update(data).eq('id', t.id);
    else await supabase.from('command_tasks').insert([data]);
    setTaskModal(null);
    loadTasks();
  };

  const toggleTask = async (t) => {
    await supabase.from('command_tasks').update({ completed: !t.completed }).eq('id', t.id);
    loadTasks();
  };

  const deleteTask = async (id) => {
    await supabase.from('command_tasks').delete().eq('id', id);
    setTaskModal(null);
    showToast('Deleted');
    loadTasks();
  };

  const addQuickTask = (title, ctx) => {
    if (!title.trim()) return;
    saveTask({ title, date: formatDateLocal(currentDate), context: ctx || newTaskCategory });
    showToast('Task added');
  };

  const addInboxItem = async () => {
    if (!brainDumpText.trim()) return;
    const lines = brainDumpText.split('\n').filter(l => l.trim());
    const items = lines.map(text => ({ text: text.trim() }));
    await supabase.from('inbox_items').insert(items);
    setBrainDumpText('');
    showToast(`Added ${items.length}`);
    loadInbox();
  };

  const updateInboxItem = async (id, updates) => {
    await supabase.from('inbox_items').update(updates).eq('id', id);
    loadInbox();
  };

  const convertInboxToTask = async (item) => {
    const dateStr = item.due_date || formatDateLocal(currentDate);
    await supabase.from('command_tasks').insert([{ date: dateStr, title: item.text, context: item.category || 'general', completed: false }]);
    await supabase.from('inbox_items').delete().eq('id', item.id);
    showToast('Made task');
    loadAll();
  };

  const convertInboxToMeeting = (item) => {
    const cat = item.category ? getCategoryById(item.category) : null;
    setMeetingModal({ title: item.text, start_time: '09:00', duration: 60, job: cat?.color || 'mint', icon: cat?.icon || '📅', _fromInbox: item.id });
  };

  const deleteInboxItem = async (id) => {
    await supabase.from('inbox_items').delete().eq('id', id);
    showToast('Removed');
    loadInbox();
  };

  const saveReview = async () => {
    const weekStart = formatDateLocal(getWeekStart(currentDate));
    const existing = reviews.find(r => r.week_starting === weekStart);
    const data = { week_starting: weekStart, wins: currentReview.wins, improvements: currentReview.improvements, next_week_focus: currentReview.focus };
    if (existing) await supabase.from('weekly_reviews').update(data).eq('id', existing.id);
    else await supabase.from('weekly_reviews').insert([data]);
    showToast('Review saved');
    loadReviews();
  };

  const saveMeal = async (date, mealType, value) => {
    const existing = mealPlan[date] || {};
    const updated = { ...existing, [mealType]: value };
    const { data } = await supabase.from('meal_plans').select('*').eq('date', date).maybeSingle();
    if (data) await supabase.from('meal_plans').update({ meals: updated }).eq('id', data.id);
    else await supabase.from('meal_plans').insert([{ date, meals: updated }]);
    setMealPlan({ ...mealPlan, [date]: updated });
  };

  const todayDateStr = formatDateLocal(currentDate);
  const dayMeetings = meetings.filter(m => meetingOccursOn(m, todayDateStr));
  const dayTasks = tasks.filter(t => t.date === todayDateStr);
  const greetingTime = () => {
    const h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  };

  // 7-day pill nav
  const weekDays = [];
  for (let i = -3; i <= 3; i++) {
    const d = new Date();

const TodayView = ({ dayMeetings, dayTasks, privacyMode, setMeetingModal, setTaskModal, toggleTask, currentDate, addQuickTask }) => {
  const isToday = currentDate.toDateString() === new Date().toDateString();
  const pendingTasks = dayTasks.filter(t => !t.completed);
  const completedTasks = dayTasks.filter(t => t.completed);

  return (
    <>

          {isToday ? 'Today' : currentDate.toLocaleDateString('en-US', { weekday: 'long' })}

          {currentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} · {dayMeetings.length} meeting{dayMeetings.length !== 1 ? 's' : ''} · {pendingTasks.length} task{pendingTasks.length !== 1 ? 's' : ''}

        <div className="empty-state">
          <div className="empty-state-icon">✨</div>

          <div className="empty-state-text">No meetings or tasks scheduled. Tap + to add something.</div>
        </div>
      ) : (
        <div className="timeline">
          {[...computeMeetingLayouts(dayMeetings).map(m => ({ ...m, _type: 'meeting', _sortKey: minutesFromTime(m.start_time) })),
            ...pendingTasks.map(t => ({ ...t, _type: 'task', _sortKey: 99999 }))]
            .sort((a, b) => a._sortKey - b._sortKey)
            .map((item, idx) => {
              if (item._type === 'meeting') {

                  <div key={`m-${item.id}`} className="timeline-row">
                    <div className="timeline-time">
                      {item.start_time}
                    </div>
                    <div

                      <div className="event-icon">{item.icon || '📅'}</div>
                      <div className="event-content">
                        <div className="event-title">{item.title}</div>
                        <div className="event-meta">
                          <span>{item.duration}min</span>

                <div key={`t-${item.id}`} className="timeline-row">

                    <div
                      className="event-icon"
                      onClick={(e) => { e.stopPropagation(); toggleTask(item); }}

                    >
                      ⭕
                    </div>
                    <div className="event-content">
                      <div className="event-title">{item.title}</div>
                      <div className="event-meta">
                        <span>{cat.label}</span>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}

          {completedTasks.length > 0 && (
            <>
              <div className="section-heading"><h2 style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>✅ Completed ({completedTasks.length})</h2></div>
              {completedTasks.map(item => {
                const cat = getCategoryById(item.context);
                return (
                  <div key={`d-${item.id}`} className="timeline-row" style={{ opacity: 0.5 }}>
                    <div className="timeline-time">·</div>
                    <div className={`event-card color-${cat.color}`} onClick={() => setTaskModal(item)} style={{ minHeight: '44px' }}>
                      <div className="event-duration-bar"></div>
                      <div className="event-icon" onClick={(e) => { e.stopPropagation(); toggleTask(item); }} style={{ cursor: 'pointer' }}>✓</div>
                      <div className="event-content">
                        <div className="event-title" style={{ textDecoration: 'line-through' }}>{item.title}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}

      <div className="quick-add" style={{ marginTop: '1.25rem' }}>
        <input
          type="text"
          placeholder="Quick add task..."
          onKeyDown={(e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
              addQuickTask(e.target.value);
              e.target.value = '';
            }
          }}
        />
        <button onClick={(e) => {
          const input = e.target.previousElementSibling;
          if (input.value.trim()) {
            addQuickTask(input.value);

const MonthView = ({ meetings, tasks, currentDate, setCurrentDate, setView }) => {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay();
  const days = [];
  for (let i = startOffset; i > 0; i--) {
    const d = new Date(year, month, 1 - i);
    days.push({ date: d, otherMonth: true });
  }
  for (let i = 1; i <= lastDay.getDate(); i++) {
    days.push({ date: new Date(year, month, i), otherMonth: false });
  }
  while (days.length % 7 !== 0) {
    const last = days[days.length - 1].date;
    const next = new Date(last);
    next.setDate(next.getDate() + 1);
    days.push({ date: next, otherMonth: true });
  }

  const navigateMonth = (dir) => {
    const d = new Date(currentDate);
    d.setMonth(d.getMonth() + dir);
    setCurrentDate(d);
  };

  return (
    <>
      <div className="page-title-area" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: '0.5rem' }}>
        <div>
          <div className="page-title">{currentDate.toLocaleDateString('en-US', { month: 'long' })}</div>
          <div className="page-subtitle">{currentDate.getFullYear()}</div>
        </div>
        <div style={{ display: 'flex', gap: '0.4rem' }}>
          <button className="icon-btn" onClick={() => navigateMonth(-1)}>‹</button>
          <button className="icon-btn" onClick={() => setCurrentDate(new Date())}>•</button>
          <button className="icon-btn" onClick={() => navigateMonth(1)}>›</button>
        </div>
      </div>

      <div className="month-grid">
        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => (<div key={i} className="month-day-head">{d}</div>))}
        {days.map(({ date, otherMonth }, idx) => {
          const dateStr = formatDateLocal(date);
          const dayMeetings = meetings.filter(m => meetingOccursOn(m, dateStr));
          const dayTasks = tasks.filter(t => t.date === dateStr && !t.completed);
          const isToday = date.toDateString() === new Date().toDateString();
          const isSelected = !isToday && date.toDateString() === currentDate.toDateString();
          return (
            <div
              key={idx}
              className={`month-cell ${otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`}
              onClick={() => { setCurrentDate(date); setView('today'); }}
            >
              <div className="month-cell-num">{date.getDate()}</div>
              <div className="month-cell-events">
                {dayMeetings.slice(0, 3).map((m, i) => (<div key={`m-${i}`} className={`month-event-pill color-${m.job}`}></div>))}
                {dayTasks.length > 0 && dayMeetings.length < 3 && Array.from({ length: Math.min(dayTasks.length, 3 - dayMeetings.length) }).map((_, i) => {
                  const cat = getCategoryById(dayTasks[i].context);
                  return <div key={`t-${i}`} className={`month-event-pill color-${cat.color}`}></div>;
                })}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
};

const InboxView = ({ inboxItems, brainDumpText, setBrainDumpText, addInboxItem, inboxFilter, setInboxFilter, inboxSort, setInboxSort, expandedInboxId, setExpandedInboxId, updateInboxItem, convertInboxToTask, convertInboxToMeeting, deleteInboxItem }) => {

  const filtered = useMemo(() => {
    let f = [...inboxItems];
    if (inboxFilter === 'starred') f = f.filter(i => i.starred);
    else if (inboxFilter === 'high') f = f.filter(i => i.priority === 'high');
    else if (inboxFilter === 'today') {
      const today = formatDateLocal(new Date());
      f = f.filter(i => i.due_date === today);
    } else if (inboxFilter === 'unsorted') {
      f = f.filter(i => !i.category && !i.priority && !i.due_date);
    }
    if (inboxSort === 'oldest') f.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    else if (inboxSort === 'newest') f.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    else if (inboxSort === 'priority') {
      const ord = { high: 0, medium: 1, low: 2 };
      f.sort((a, b) => (ord[a.priority] ?? 3) - (ord[b.priority] ?? 3));
    } else if (inboxSort === 'due') {
      f.sort((a, b) => {
        if (!a.due_date && !b.due_date) return 0;
        if (!a.due_date) return 1;
        if (!b.due_date) return -1;
        return new Date(a.due_date) - new Date(b.due_date);
      });
    }
    return f;
  }, [inboxItems, inboxFilter, inboxSort]);

  return (
    <>
      <div className="page-title-area">
        <div className="page-title">Inbox</div>
        <div className="page-subtitle">{inboxItems.length} item{inboxItems.length !== 1 ? 's' : ''} · capture first, organize later</div>
      </div>

      <div className="brain-dump">
        <div className="brain-dump-label">⚡ Brain Dump</div>
        <textarea
          value={brainDumpText}
          onChange={(e) => setBrainDumpText(e.target.value)}
          placeholder="Drop everything here. One thought per line. Don't filter — just capture..."
        />
        <div className="brain-dump-actions">
          <button className="btn btn-ghost" onClick={() => setBrainDumpText('')}>Clear</button>
          <button className="btn btn-primary" onClick={addInboxItem}>Capture</button>
        </div>
      </div>

      {inboxItems.length > 0 && (
        <div className="filter-row">
          <button className={`chip ${inboxFilter === 'all' ? 'active' : ''}`} onClick={() => setInboxFilter('all')}>All</button>
          <button className={`chip ${inboxFilter === 'starred' ? 'active' : ''}`} onClick={() => setInboxFilter('starred')}>⭐</button>
          <button className={`chip ${inboxFilter === 'high' ? 'active' : ''}`} onClick={() => setInboxFilter('high')}>🔴 High</button>
          <button className={`chip ${inboxFilter === 'today' ? 'active' : ''}`} onClick={() => setInboxFilter('today')}>📅 Today</button>
          <button className={`chip ${inboxFilter === 'unsorted' ? 'active' : ''}`} onClick={() => setInboxFilter('unsorted')}>🆕 Unsorted</button>
          <select className="sort-select" value={inboxSort} onChange={(e) => setInboxSort(e.target.value)}>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="priority">Priority</option>
            <option value="due">Due date</option>
          </select>
        </div>
      )}

      {filtered.length === 0 ? (
        <div className="empty-state">
          <div className="empty-state-icon">📭</div>
          <div className="empty-state-title">{inboxFilter !== 'all' ? 'No matches' : 'Inbox empty'}</div>
          <div className="empty-state-text">{inboxFilter !== 'all' ? 'Try a different filter.' : 'Drop thoughts above when they come.'}</div>
        </div>
      ) : (
        <div className="inbox-list">
          {filtered.map(item => {
            const isExpanded = expandedInboxId === item.id;
            const today = formatDateLocal(new Date());
            const isOverdue = item.due_date && item.due_date < today;
            const isDueToday = item.due_date === today;
            const cat = item.category ? getCategoryById(item.category) : null;

            return (
              <div key={item.id} className={`inbox-card ${isExpanded ? 'expanded' : ''} ${item.starred ? 'starred' : ''}`}>
                <div className="inbox-card-row">
                  <div
                    className="inbox-circle"
                    onClick={(e) => { e.stopPropagation(); convertInboxToTask(item); }}
                    title="Mark complete - converts to task"
                  ></div>
                  <div className="inbox-main" onClick={() => setExpandedInboxId(isExpanded ? null : item.id)}>
                    <div className="inbox-title">{item.text}</div>
                    <div className="inbox-pills">
                      {cat && <span className="inbox-pill" style={{ background: `var(--c-${cat.color}-bg)`, color: `var(--c-${cat.color})` }}>{cat.icon} {cat.label}</span>}
                      {item.priority && <span className={`inbox-pill ${item.priority}`}>{item.priority === 'high' ? '🔴' : item.priority === 'medium' ? '🟡' : '🟢'} {item.priority}</span>}
                      {item.due_date && (
                        <span className={`inbox-pill ${isOverdue ? 'due-overdue' : isDueToday ? 'due-today' : 'due-future'}`}>
                          📅 {new Date(item.due_date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
                          {isOverdue && ' · OVERDUE'}{isDueToday && ' · TODAY'}

                      {!cat && !item.priority && !item.due_date && <span className="inbox-tag-empty">tap to organize</span>}
                    </div>
                  </div>
                  <button className={`star-btn ${item.starred ? 'starred' : ''}`} onClick={(e) => { e.stopPropagation(); updateInboxItem(item.id, { starred: !item.starred }); }}>
                    {item.starred ? '⭐' : '☆'}
                  </button>
                </div>

                {isExpanded && (
                  <div className="inbox-expand">
                    <div className="detail-row">
                      <label>Category</label>
                      <select value={item.category || ''} onChange={(e) => updateInboxItem(item.id, { category: e.target.value || null })}>
                        <option value="">None</option>
                        {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                      </select>
                    </div>
                    <div className="detail-row">
                      <label>Priority</label>
                      <select value={item.priority || ''} onChange={(e) => updateInboxItem(item.id, { priority: e.target.value || null })}>
                        <option value="">None</option>
                        <option value="high">🔴 High</option>
                        <option value="medium">🟡 Medium</option>
                        <option value="low">🟢 Low</option>
                      </select>
                    </div>
                    <div className="detail-row">
                      <label>Due</label>
                      <input type="date" value={item.due_date || ''} onChange={(e) => updateInboxItem(item.id, { due_date: e.target.value || null })} />
                    </div>
                    <div className="detail-row">
                      <label>Notes</label>
                      <textarea placeholder="Optional details..." defaultValue={item.notes || ''} onBlur={(e) => updateInboxItem(item.id, { notes: e.target.value || null })} />
                    </div>
                    <div className="expand-actions">
                      <button className="btn btn-soft" onClick={() => convertInboxToTask(item)}>→ Task</button>
                      <button className="btn btn-soft" onClick={() => convertInboxToMeeting(item)}>→ Meeting</button>
                      <button className="btn btn-danger" onClick={() => deleteInboxItem(item.id)}>Delete</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </>
  );
};

const ReviewView = ({ currentReview, setCurrentReview, saveReview, currentDate, mealPlan, saveMeal, reviews, setCurrentDate }) => {
  return (
    <>
      <div className="page-title-area" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
        <div>
          <div className="page-title">Weekly Review</div>
          <div className="page-subtitle">Week of {getWeekStart(currentDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
        </div>
        <button className="btn btn-primary" onClick={saveReview}>Save</button>
      </div>

      <div className="review-section">
        <h3>✨ Wins</h3>
        <textarea value={currentReview.wins} onChange={(e) => setCurrentReview({ ...currentReview, wins: e.target.value })} placeholder="What went well this week?" />
      </div>
      <div className="review-section">
        <h3>🔧 Improve</h3>
        <textarea value={currentReview.improvements} onChange={(e) => setCurrentReview({ ...currentReview, improvements: e.target.value })} placeholder="What could be better?" />
      </div>
      <div className="review-section">
        <h3>🎯 Focus next week</h3>
        <textarea value={currentReview.focus} onChange={(e) => setCurrentReview({ ...currentReview, focus: e.target.value })} placeholder="Top 3 priorities" />
      </div>

      <div className="review-section">
        <h3>🍽️ Meal Plan · Next Week</h3>
        <div className="meal-grid">
          {Array.from({ length: 7 }, (_, i) => {
            const d = new Date(getWeekStart(currentDate));
            d.setDate(d.getDate() + i + 7);
            const dateStr = formatDateLocal(d);
            const meals = mealPlan[dateStr] || {};
            return (
              <div key={dateStr} className="meal-day">
                <h4>{d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}</h4>
                <input type="text" className="meal-input" placeholder="Breakfast" value={meals.breakfast || ''} onChange={(e) => saveMeal(dateStr, 'breakfast', e.target.value)} />
                <input type="text" className="meal-input" placeholder="Lunch" value={meals.lunch || ''} onChange={(e) => saveMeal(dateStr, 'lunch', e.target.value)} />
                <input type="text" className="meal-input" placeholder="Dinner" value={meals.dinner || ''} onChange={(e) => saveMeal(dateStr, 'dinner', e.target.value)} />
              </div>
            );
          })}
        </div>
      </div>

      {reviews.length > 0 && (
        <div className="review-section">
          <h3>📚 Past Reviews</h3>
          {reviews.map(r => (
            <div key={r.id} className="review-history-card" onClick={() => {
              setCurrentDate(new Date(r.week_starting + 'T00:00:00'));
              setCurrentReview({ wins: r.wins || '', improvements: r.improvements || '', focus: r.next_week_focus || '' });
            }}>
              <div className="review-history-date">{new Date(r.week_starting + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
              <div className="review-history-preview">{r.next_week_focus?.substring(0, 100) || r.wins?.substring(0, 100) || '—'}</div>
            </div>
          ))}
        </div>
      )}
    </>
  );
};

const MeetingModal = ({ meeting, onSave, onDelete, onClose }) => {
  const [data, setData] = useState({
    id: meeting.id,
    title: meeting.title || '',
    start_time: meeting.start_time || '09:00',
    duration: meeting.duration || 60,
    job: meeting.job || 'mint',
    icon: meeting.icon || '📅',
    date: meeting.date,
    recurrence: meeting.recurrence || 'none',
    recurrence_end: meeting.recurrence_end || '',
    _fromInbox: meeting._fromInbox
  });

  const handleSave = () => {
    if (!data.title.trim()) return;
    onSave(data);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-handle"></div>
        <h2>{data.id ? 'Edit Event' : 'New Event'}</h2>
        <div className="form-group">
          <label>Title</label>
          <input type="text" value={data.title} onChange={(e) => setData({ ...data, title: e.target.value })} placeholder="Event title" autoFocus />
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Time</label>
            <input type="time" value={data.start_time} onChange={(e) => setData({ ...data, start_time: e.target.value })} />
          </div>
          <div className="form-group">
            <label>Duration</label>
            <input type="number" value={data.duration} onChange={(e) => setData({ ...data, duration: parseInt(e.target.value) || 60 })} min="15" step="15" />
          </div>
        </div>
        <div className="form-group">
          <label>Color</label>
          <div className="color-grid">
            {COLORS.map(c => (
              <div
                key={c.id}
                className={`color-swatch ${data.job === c.id ? 'selected' : ''}`}
                style={{ background: `var(--c-${c.id})` }}
                onClick={() => setData({ ...data, job: c.id })}
                title={c.label}
              ></div>
            ))}
          </div>
        </div>
        <div className="form-group">
          <label>Icon</label>
          <div className="icon-grid">
            {ICONS.map(ico => (
              <div key={ico} className={`icon-pick ${data.icon === ico ? 'selected' : ''}`} onClick={() => setData({ ...data, icon: ico })}>{ico}</div>
            ))}
          </div>
        </div>
        <div className="form-group">
          <label>🔁 Repeat</label>
          <select value={data.recurrence} onChange={(e) => setData({ ...data, recurrence: e.target.value })}>
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Every 2 weeks</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        {data.recurrence !== 'none' && (
          <div className="form-group">
            <label>End repeat (optional)</label>
            <input type="date" value={data.recurrence_end} onChange={(e) => setData({ ...data, recurrence_end: e.target.value })} />
          </div>
        )}
        <div className="modal-actions spread">
          {data.id ? <button className="btn btn-danger" onClick={() => onDelete(data.id)}>Delete</button> : <div></div>}
          <div style={{ display: 'flex', gap: '0.5rem' }}>
            <button className="btn btn-soft" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={handleSave}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const TaskModal = ({ task, onSave, onDelete, onClose }) => {
  const [data, setData] = useState({
    id: task.id,
    title: task.title || '',
    context: task.context || 'general',
    completed: task.completed || false,
    date: task.date
  });

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-handle"></div>
        <h2>{data.id ? 'Edit Task' : 'New Task'}</h2>
        <div className="form-group">
          <label>Task</label>
          <input type="text" value={data.title} onChange={(e) => setData({ ...data, title: e.target.value })} autoFocus />
        </div>
        <div className="form-group">
          <label>Category</label>
          <select value={data.context} onChange={(e) => setData({ ...data, context: e.target.value })}>
            {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
          </select>
        </div>
        <div className="form-group">
          <label>Date</label>
          <input type="date" value={data.date} onChange={(e) => setData({ ...data, date: e.target.value })} />
        </div>
        <div className="modal-actions spread">
          {data.id ? <button className="btn btn-danger" onClick={() => onDelete(data.id)}>Delete</button> : <div></div>}
          <div style={{ display: 'flex', gap: '0.5rem' }}>
            <button className="btn btn-soft" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={() => onSave(data)}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
