// =================== TASK ROW (reusable) ===================
const TaskRow = ({ task, getProjectById, getTaskLabels, toggleTask, setTaskModal, hideProject }) => {
  const proj = task.project_id ? getProjectById(task.project_id) : null;
  const tlabels = getTaskLabels ? getTaskLabels(task.id) : [];
  const due = task.date ? dueDateLabel(task.date) : null;
  const priorityClass = `p${task.priority || 4}`;
  return (
    <div className={`task-row ${task.completed ? 'completed' : ''}`} onClick={() => setTaskModal(task)}>
      <div className={`task-checkbox ${priorityClass} ${task.completed ? 'completed' : ''}`} onClick={(e) => { e.stopPropagation(); toggleTask(task); }}></div>
      <div className="task-main">
        <div className="task-title">{task.title}</div>
        {task.description && <div className="task-desc">{task.description}</div>}
        {(due || (proj && !hideProject) || tlabels.length > 0) && (
          <div className="task-meta">
            {due && <span className={`task-pill due ${due.cls}`}>📅 {due.label}{task.due_time ? ` ${task.due_time}` : ''}</span>}
            {proj && !hideProject && (
              <span className="task-pill project">
                <span className="project-dot" style={{ background: proj.color }}></span>
                {proj.name}
              </span>
            )}
            {tlabels.map(l => (
              <span key={l.id} className="task-pill label" style={{ color: l.color }}>@{l.name}</span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// =================== TODAY ===================
const TodayView = ({ todayTasks, todayMeetings, setTaskModal, setMeetingModal, toggleTask, getProjectById, getTaskLabels, currentDate, setCurrentDate, projects, saveTask }) => {
  const isToday = currentDate.toDateString() === new Date().toDateString();
  const pending = todayTasks.filter(t => !t.completed);
  const completed = todayTasks.filter(t => t.completed);
  const [quickAddTitle, setQuickAddTitle] = useState('');

  const navigateDay = (dir) => {
    const d = new Date(currentDate);
    d.setDate(d.getDate() + dir);
    setCurrentDate(d);
  };

  const handleQuickAdd = () => {
    if (!quickAddTitle.trim()) return;
    saveTask({ title: quickAddTitle, date: formatDateLocal(currentDate), priority: 4 });
    setQuickAddTitle('');
  };

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">{isToday ? 'Today' : currentDate.toLocaleDateString('en-US', { weekday: 'long' })}</div>
          <div className="page-subtitle">{currentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} · {pending.length} task{pending.length !== 1 ? 's' : ''} · {todayMeetings.length} meeting{todayMeetings.length !== 1 ? 's' : ''}</div>
        </div>
        <div style={{ display: 'flex', gap: '0.4rem' }}>
          <button className="icon-btn" onClick={() => navigateDay(-1)}>‹</button>
          <button className="icon-btn" onClick={() => setCurrentDate(new Date())} title="Today">•</button>
          <button className="icon-btn" onClick={() => navigateDay(1)}>›</button>
        </div>
      </div>

      {todayMeetings.length > 0 && (
        <div className="section-block">
          <div className="section-head">
            <span className="section-collapse-icon">▼</span>
            <span className="section-name">Meetings</span>
            <span className="section-count">{todayMeetings.length}</span>
          </div>
          <div className="section-tasks" style={{ display: 'flex', flexDirection: 'column', gap: '0.35rem', marginTop: '0.5rem' }}>
            {todayMeetings.sort((a,b) => minutesFromTime(a.start_time) - minutesFromTime(b.start_time)).map(m => (
              <div key={m.id} className="task-row" onClick={() => setMeetingModal(m)} style={{ background: hexToSoftBg(m.job), borderLeft: `3px solid ${m.job}`, borderRadius: '6px', borderBottom: 'none', padding: '0.5rem 0.65rem' }}>
                <div style={{ width: 28, height: 28, borderRadius: '7px', background: m.job, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.85rem', flexShrink: 0 }}>{m.icon || '📅'}</div>
                <div className="task-main">
                  <div className="task-title" style={{ color: hexToTextColor(m.job) }}>{m.title}</div>
                  <div className="task-desc" style={{ color: hexToTextColor(m.job), opacity: 0.7 }}>{m.start_time} · {m.duration}min</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="section-block">
        <div className="section-head">
          <span className="section-collapse-icon">▼</span>
          <span className="section-name">Tasks</span>
          <span className="section-count">{pending.length}</span>
        </div>
        <div className="section-tasks">
          {pending.length === 0 && completed.length === 0 ? (
            <div style={{ padding: '0.85rem 0', color: 'var(--text-muted)', fontSize: '0.85rem', textAlign: 'center' }}>No tasks for this day yet.</div>
          ) : (
            pending.map(t => <TaskRow key={t.id} task={t} getProjectById={getProjectById} getTaskLabels={getTaskLabels} toggleTask={toggleTask} setTaskModal={setTaskModal} />)
          )}
          <div className={`quick-add-row ${quickAddTitle ? 'editing' : ''}`}>
            <span style={{ color: 'var(--text-muted)' }}>➕</span>
            <input type="text" className="quick-add-input" placeholder="Add task" value={quickAddTitle} onChange={e => setQuickAddTitle(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') handleQuickAdd(); }} />
            {quickAddTitle && <button className="btn btn-primary" style={{ padding: '0.3rem 0.6rem', fontSize: '0.75rem' }} onClick={handleQuickAdd}>Add</button>}
          </div>
        </div>
      </div>

      {completed.length > 0 && (
        <div className="section-block">
          <div className="section-head">
            <span className="section-collapse-icon">▼</span>
            <span className="section-name" style={{ color: 'var(--text-muted)' }}>Completed</span>
            <span className="section-count">{completed.length}</span>
          </div>
          <div className="section-tasks">
            {completed.map(t => <TaskRow key={t.id} task={t} getProjectById={getProjectById} getTaskLabels={getTaskLabels} toggleTask={toggleTask} setTaskModal={setTaskModal} />)}
          </div>
        </div>
      )}
    </>
  );
};


// =================== INBOX ===================
const InboxView = ({ inboxItems, brainDumpText, setBrainDumpText, addInboxItems, inboxFilter, setInboxFilter, inboxSort, setInboxSort, expandedInboxId, setExpandedInboxId, updateInboxItem, convertInboxToTask, convertInboxToMeeting, deleteInboxItem, projects }) => {
  const filtered = useMemo(() => {
    let f = [...inboxItems];
    if (inboxFilter === 'starred') f = f.filter(i => i.starred);
    else if (inboxFilter === 'unsorted') f = f.filter(i => !i.priority && !i.due_date);
    if (inboxSort === 'oldest') f.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    else if (inboxSort === 'newest') f.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    return f;
  }, [inboxItems, inboxFilter, inboxSort]);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">📥 Inbox</div>
          <div className="page-subtitle">{inboxItems.length} item{inboxItems.length !== 1 ? 's' : ''} · capture first, organize later</div>
        </div>
      </div>

      <div className="brain-dump">
        <div className="brain-dump-label">⚡ Brain Dump</div>
        <textarea value={brainDumpText} onChange={e => setBrainDumpText(e.target.value)} placeholder="Drop everything here. One thought per line." />
        <div className="brain-dump-actions">
          <button className="btn btn-ghost" onClick={() => setBrainDumpText('')}>Clear</button>
          <button className="btn btn-primary" onClick={addInboxItems}>Capture</button>
        </div>
      </div>

      {inboxItems.length > 0 && (
        <div className="chip-row">
          <button className={`chip ${inboxFilter === 'all' ? 'active' : ''}`} onClick={() => setInboxFilter('all')}>All</button>
          <button className={`chip ${inboxFilter === 'starred' ? 'active' : ''}`} onClick={() => setInboxFilter('starred')}>⭐ Starred</button>
          <button className={`chip ${inboxFilter === 'unsorted' ? 'active' : ''}`} onClick={() => setInboxFilter('unsorted')}>🆕 Unsorted</button>
          <select className="sort-select" value={inboxSort} onChange={e => setInboxSort(e.target.value)}>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </div>
      )}

      {filtered.length === 0 ? (
        <div className="empty-state">
          <div className="empty-state-icon">📭</div>
          <div className="empty-state-title">{inboxFilter !== 'all' ? 'No matches' : 'Inbox empty'}</div>
        </div>
      ) : (
        <div>
          {filtered.map(item => {
            const isExpanded = expandedInboxId === item.id;
            return (
              <div key={item.id} className={`inbox-card ${isExpanded ? 'expanded' : ''}`}>
                <div className="inbox-card-row">
                  <div className="inbox-bullet" onClick={() => convertInboxToTask(item)} title="Click to convert to task"></div>
                  <div style={{ flex: 1, cursor: 'pointer' }} onClick={() => setExpandedInboxId(isExpanded ? null : item.id)}>
                    <div className="inbox-text">{item.text}</div>
                  </div>
                  <button className="task-action" onClick={() => updateInboxItem(item.id, { starred: !item.starred })}>{item.starred ? '⭐' : '☆'}</button>
                </div>
                {isExpanded && (
                  <div className="inbox-expand">
                    <div className="expand-actions" style={{ justifyContent: 'flex-start' }}>
                      <button className="btn btn-primary" onClick={() => convertInboxToTask(item)}>→ Task</button>
                      <button className="btn btn-soft" onClick={() => convertInboxToMeeting(item)}>→ Meeting</button>
                      <button className="btn btn-soft" style={{ marginLeft: 'auto' }} onClick={() => deleteInboxItem(item.id)}>🗑</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </>
  );
};

const CalendarView = ({ calendarView, setCalendarView, currentDate, setCurrentDate, meetings, tasks, setMeetingModal, setTaskModal, getProjectById, setView }) => {
  const navigate = (dir) => {
    const d = new Date(currentDate);
    if (calendarView === 'day') d.setDate(d.getDate() + dir);
    else if (calendarView === 'week') d.setDate(d.getDate() + dir * 7);
    else d.setMonth(d.getMonth() + dir);
    setCurrentDate(d);
  };

  const titleText = () => {
    if (calendarView === 'day') return currentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    return currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  };

  const weekStart = getWeekStart(currentDate);
  const yearStart = new Date(weekStart.getFullYear(), 0, 1);
  const weekNum = Math.ceil((((weekStart - yearStart) / 86400000) + yearStart.getDay() + 1) / 7);

  return (
    <div className="gcal-container">
      <div className="gcal-header">
        <button className="gcal-today-btn" onClick={() => setCurrentDate(new Date())}>Today</button>
        <button className="gcal-arrow" onClick={() => navigate(-1)}>‹</button>
        <button className="gcal-arrow" onClick={() => navigate(1)}>›</button>
        <div className="gcal-title">
          <span>{titleText()}</span>
          {calendarView === 'week' && <span className="gcal-week-pill">Week {weekNum}</span>}
        </div>
        <select className="gcal-view-select" value={calendarView} onChange={e => setCalendarView(e.target.value)}>
          <option value="day">Day</option>
          <option value="week">Week</option>
          <option value="month">Month</option>
        </select>
      </div>
      {calendarView === 'day' && <CalendarDayView currentDate={currentDate} meetings={meetings} tasks={tasks} setMeetingModal={setMeetingModal} setTaskModal={setTaskModal} getProjectById={getProjectById} />}
      {calendarView === 'week' && <CalendarWeekView currentDate={currentDate} setCurrentDate={setCurrentDate} setCalendarView={setCalendarView} meetings={meetings} tasks={tasks} setMeetingModal={setMeetingModal} setTaskModal={setTaskModal} getProjectById={getProjectById} />}
      {calendarView === 'month' && <CalendarMonthView currentDate={currentDate} setCurrentDate={setCurrentDate} setCalendarView={setCalendarView} meetings={meetings} tasks={tasks} setMeetingModal={setMeetingModal} setTaskModal={setTaskModal} getProjectById={getProjectById} />}
    </div>
  );
};

const CalendarWeekView = ({ currentDate, setCurrentDate, setCalendarView, meetings, tasks, setMeetingModal, setTaskModal, getProjectById }) => {
  const weekStart = getWeekStart(currentDate);
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(weekStart); d.setDate(d.getDate() + i); return d; });
  const hours = []; for (let h = 5; h <= 22; h++) hours.push(h);

  useEffect(() => {
    const wrapper = document.querySelector('.gcal-time-grid-wrapper');
    if (wrapper) {
      const now = new Date();
      const targetHour = now.getHours() >= 5 && now.getHours() <= 22 ? now.getHours() - 1 : 7;
      wrapper.scrollTop = Math.max(0, (targetHour - 5) * 44 - 20);
    }
  }, []);

  return (
    <>
      <div className="gcal-day-headers">
        <div className="gcal-tz-cell">{(() => {
          const offset = -new Date().getTimezoneOffset() / 60;
          const sign = offset >= 0 ? '+' : '-';
          return `GMT${sign}${String(Math.abs(offset)).padStart(2, '0')}`;
        })()}</div>
        {days.map((d, i) => {
          const isToday = d.toDateString() === new Date().toDateString();
          return (
            <div key={i} className={`gcal-day-head ${isToday ? 'today' : ''}`} onClick={() => { setCurrentDate(new Date(d)); setCalendarView('day'); }}>
              <div className="gcal-dow">{d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase()}</div>
              <div className={`gcal-day-num ${isToday ? 'today' : ''}`}>{d.getDate()}</div>
            </div>
          );
        })}
      </div>
      <div className="gcal-allday-row">
        <div className="gcal-tz-cell" style={{ fontSize: '0.55rem' }}>all-day</div>
        {days.map((d, i) => {
          const dateStr = formatDateLocal(d);
          const dayTasks = tasks.filter(t => t.date === dateStr && !t.completed && !t.due_time);
          return (
            <div key={i} className="gcal-allday-cell">
              {dayTasks.slice(0, 3).map(t => {
                const proj = t.project_id ? getProjectById(t.project_id) : null;
                const color = proj?.color || '#888';
                return (
                  <div key={t.id} className="gcal-allday-event" style={{ background: hexToSoftBg(color), color: hexToTextColor(color) }} onClick={(e) => { e.stopPropagation(); setTaskModal(t); }} title={t.title}>○ {t.title}</div>
                );
              })}
              {dayTasks.length > 3 && <div style={{ fontSize: '0.6rem', color: 'var(--text-muted)', padding: '0 6px', fontWeight: 600 }}>+{dayTasks.length - 3} more</div>}
            </div>
          );
        })}
      </div>
      <div className="gcal-time-grid-wrapper">
        <div className="gcal-time-grid">
          <div className="gcal-time-col">
            {hours.map(h => <div key={h} className="gcal-time-label">{String(h).padStart(2, '0')}:00</div>)}
          </div>
          {days.map((d, i) => {
            const dateStr = formatDateLocal(d);
            const dayMeetings = meetings.filter(m => meetingOccursOn(m, dateStr));
            const dayTimedTasks = tasks.filter(t => t.date === dateStr && !t.completed && t.due_time);
            const isToday = d.toDateString() === new Date().toDateString();
            const now = new Date();
            const nowMins = now.getHours() * 60 + now.getMinutes();
            const showNowLine = isToday && nowMins >= 5 * 60 && nowMins <= 22 * 60 + 60;
            const nowTop = ((nowMins - 5 * 60) / 60) * 44;

            // Combine meetings and timed tasks into a single layout pass for overlap handling
            const allEvents = [
              ...dayMeetings.map(m => ({
                ...m, _type: 'meeting',
                startMin: minutesFromTime(m.start_time),
                endMin: minutesFromTime(m.start_time) + m.duration
              })),
              ...dayTimedTasks.map(t => ({
                ...t, _type: 'task',
                startMin: minutesFromTime(t.due_time),
                endMin: minutesFromTime(t.due_time) + (t.duration || 30)
              }))
            ];
            const laidOut = layoutEvents(allEvents);

            return (
              <div key={i} className="gcal-day-col">
                {hours.map(h => (
                  <div key={h} className="gcal-hour-cell" onClick={() => setMeetingModal({ date: dateStr, start_time: `${String(h).padStart(2,'0')}:00`, duration: 60 })}></div>
                ))}
                {laidOut.map(e => {
                  if (e.startMin < 5*60 || e.startMin > 22*60+30) return null;
                  const top = ((e.startMin - 5*60) / 60) * 44;
                  const dur = e.endMin - e.startMin;
                  const height = (dur / 60) * 44 - 2;
                  const widthPct = 100 / e._totalCols;
                  const leftPct = widthPct * e._col;
                  const styleBase = {
                    top: `${top}px`,
                    height: `${Math.max(height, 18)}px`,
                    left: `calc(${leftPct}% + 1px)`,
                    width: `calc(${widthPct}% - 3px)`,
                    right: 'auto'
                  };
                  if (e._type === 'meeting') {
                    return (
                      <div key={`m-${e.id}`} className="gcal-event" style={{ ...styleBase, background: hexToSoftBg(e.job), color: hexToTextColor(e.job) }} onClick={(ev) => { ev.stopPropagation(); setMeetingModal(e); }}>
                        <div className="gcal-event-title">{e.title}</div>
                        {height > 30 && <div className="gcal-event-time">{e.start_time}</div>}
                      </div>
                    );
                  } else {
                    const proj = e.project_id ? getProjectById(e.project_id) : null;
                    const color = proj?.color || '#888';
                    return (
                      <div key={`t-${e.id}`} className="gcal-event task-block" style={{ ...styleBase, color, background: hexToSoftBg(color) }} onClick={(ev) => { ev.stopPropagation(); setTaskModal(e); }}>
                        <div className="gcal-event-title">○ {e.title}</div>
                        {height > 30 && <div className="gcal-event-time">{e.due_time}</div>}
                      </div>
                    );
                  }
                })}
                {showNowLine && <div className="gcal-now-line" style={{ top: `${nowTop}px` }}></div>}
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
};

const CalendarMonthView = ({ currentDate, setCurrentDate, setCalendarView, meetings, tasks, setMeetingModal, setTaskModal, getProjectById }) => {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const days = [];
  for (let i = startOffset; i > 0; i--) days.push({ date: new Date(year, month, 1 - i), otherMonth: true });
  for (let i = 1; i <= lastDay.getDate(); i++) days.push({ date: new Date(year, month, i), otherMonth: false });
  while (days.length % 7 !== 0) {
    const next = new Date(days[days.length - 1].date); next.setDate(next.getDate() + 1);
    days.push({ date: next, otherMonth: true });
  }
  const weeks = []; for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

  return (
    <>
      <div className="gcal-month-header">
        {['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d => <div key={d} className="gcal-month-dow">{d}</div>)}
      </div>
      <div className="gcal-month-body">
        {weeks.map((week, wIdx) => (
          <div key={wIdx} className="gcal-month-week">
            {week.map(({ date, otherMonth }, dIdx) => {
              const dateStr = formatDateLocal(date);
              const dayMeetings = meetings.filter(m => meetingOccursOn(m, dateStr));
              const dayTasks = tasks.filter(t => t.date === dateStr && !t.completed);
              const isToday = date.toDateString() === new Date().toDateString();
              return (
                <div key={dIdx} className={`gcal-month-cell ${otherMonth ? 'other-month' : ''}`} onClick={() => { setCurrentDate(new Date(date)); setCalendarView('day'); }}>
                  <div className={`gcal-month-num ${isToday ? 'today' : ''}`}>{date.getDate()}</div>
                  <div className="gcal-month-events">
                    {dayMeetings.slice(0, 3).map((m, i) => (
                      <div key={`m-${i}`} className="gcal-month-event" style={{ background: hexToSoftBg(m.job), color: hexToTextColor(m.job) }} onClick={(e) => { e.stopPropagation(); setMeetingModal(m); }} title={m.title}>
                        <span style={{ fontWeight: 600, marginRight: 4 }}>{m.start_time}</span>{m.title}
                      </div>
                    ))}
                    {dayTasks.slice(0, 2).map((t, i) => {
                      const proj = t.project_id ? getProjectById(t.project_id) : null;
                      const color = proj?.color || '#888';
                      return (
                        <div key={`t-${i}`} className="gcal-month-event" style={{ background: hexToSoftBg(color), color: hexToTextColor(color) }} onClick={(e) => { e.stopPropagation(); setTaskModal(t); }} title={t.title}>○ {t.title}</div>
                      );
                    })}
                    {(dayMeetings.length + dayTasks.length) > 5 && <div className="gcal-month-more">+{(dayMeetings.length + dayTasks.length) - 5}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </>
  );
};

const NotesView = ({ notes, activeNote, setActiveNoteId, projects, noteSearch, setNoteSearch, previewMode, setPreviewMode, createNote, updateNote, deleteNote, pinnedNoteId, togglePinnedNote, getProjectById }) => {
  const [editTitle, setEditTitle] = useState('');
  const [editBody, setEditBody] = useState('');
  const [tagInput, setTagInput] = useState('');
  const [filterProject, setFilterProject] = useState('all');
  const saveTimer = useRef(null);

  useEffect(() => {
    if (activeNote) {
      setEditTitle(activeNote.title || '');
      setEditBody(activeNote.body || '');
    }
  }, [activeNote?.id]);

  const debouncedSave = (updates) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      if (activeNote) updateNote(activeNote.id, updates);
    }, 600);
  };

  const filtered = useMemo(() => {
    let f = [...notes];
    if (filterProject === 'unfiled') f = f.filter(n => !n.project_id);
    else if (filterProject !== 'all') f = f.filter(n => n.project_id === filterProject);
    if (noteSearch.trim()) {
      const q = noteSearch.toLowerCase();
      f = f.filter(n => (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q));
    }
    return f;
  }, [notes, filterProject, noteSearch]);

  const insertMd = (before, after = '') => {
    const ta = document.querySelector('.note-body-input');
    if (!ta) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = editBody.substring(start, end);
    const next = editBody.substring(0, start) + before + sel + after + editBody.substring(end);
    setEditBody(next);
    debouncedSave({ title: editTitle, body: next });
    setTimeout(() => { ta.focus(); ta.setSelectionRange(start + before.length, start + before.length + sel.length); }, 0);
  };

  const addTag = (e) => {
    if (e.key === 'Enter' && tagInput.trim() && activeNote) {
      const newTags = [...(activeNote.tags || []), tagInput.trim()];
      updateNote(activeNote.id, { tags: newTags });
      setTagInput('');
    }
  };

  const removeTag = (tag) => {
    if (!activeNote) return;
    updateNote(activeNote.id, { tags: (activeNote.tags || []).filter(t => t !== tag) });
  };

  const noteProject = activeNote?.project_id ? getProjectById(activeNote.project_id) : null;
  const noteColor = noteProject?.color || '#888';

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">📝 Notes</div>
          <div className="page-subtitle">{notes.length} note{notes.length !== 1 ? 's' : ''}</div>
        </div>
        <button className="btn btn-primary" onClick={() => createNote(filterProject !== 'all' && filterProject !== 'unfiled' ? filterProject : null)}>+ New Note</button>
      </div>
      <div className="notes-layout">
        <div className="notes-sidebar-pane">
          <input type="text" className="notes-search" placeholder="🔍 Search notes…" value={noteSearch} onChange={e => setNoteSearch(e.target.value)} />
          <div style={{ marginTop: '0.4rem', marginBottom: '0.4rem' }}>
            <div style={{ fontSize: '0.7rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.5px', padding: '0.4rem 0.5rem' }}>Filter</div>
            <div className={`sidebar-item ${filterProject === 'all' ? 'active' : ''}`} onClick={() => setFilterProject('all')}>
              <span className="sidebar-icon">📚</span><span className="sidebar-label">All Notes</span><span className="sidebar-count">{notes.length}</span>
            </div>
            <div className={`sidebar-item ${filterProject === 'unfiled' ? 'active' : ''}`} onClick={() => setFilterProject('unfiled')}>
              <span className="sidebar-icon">📥</span><span className="sidebar-label">Unfiled</span><span className="sidebar-count">{notes.filter(n => !n.project_id).length}</span>
            </div>
            {projects.map(p => (
              <div key={p.id} className={`sidebar-item ${filterProject === p.id ? 'active' : ''}`} onClick={() => setFilterProject(p.id)}>
                <div className="project-dot" style={{ background: p.color }}></div>
                <span className="sidebar-label">{p.name}</span>
                <span className="sidebar-count">{notes.filter(n => n.project_id === p.id).length}</span>
              </div>
            ))}
          </div>
          <div style={{ borderTop: '1px solid var(--border-soft)', paddingTop: '0.5rem', marginTop: '0.25rem' }}>
            {filtered.length === 0 ? (
              <div style={{ padding: '0.5rem', fontSize: '0.78rem', color: 'var(--text-muted)', fontStyle: 'italic' }}>No notes yet</div>
            ) : filtered.map(n => {
              const pColor = n.project_id ? (getProjectById(n.project_id)?.color || '#888') : '#888';
              return (
                <div key={n.id} className={`note-list-item ${activeNote?.id === n.id ? 'active' : ''}`} style={{ borderLeftColor: pColor, marginBottom: 4 }} onClick={() => setActiveNoteId(n.id)}>

// =================== RECURRENCE PICKER ===================
const ordinalNames = { 1:'first', 2:'second', 3:'third', 4:'fourth', 5:'fifth' };

const RecurrencePicker = ({ recurrence, recurrenceEnd, startDate, onChange }) => {
  const [showCustom, setShowCustom] = useState(false);
  const start = new Date((startDate || formatDateLocal(new Date())) + 'T00:00:00');
  const startDayCode = DAYS_OF_WEEK[start.getDay()];
  const startDayName = DAY_LABELS[startDayCode];
  const monthDay = start.getDate();
  const monthName = start.toLocaleDateString('en-US', { month: 'long' });
  const ordinalForDay = Math.ceil(monthDay / 7);

  const presets = [
    { id: 'none', label: 'Does not repeat', value: null },
    { id: 'daily', label: 'Daily', value: { freq: 'daily', interval: 1 } },
    { id: 'weekly', label: `Weekly on ${startDayName}`, value: { freq: 'weekly', interval: 1, byDay: [startDayCode] } },
    { id: 'monthly-day', label: `Monthly on the ${ordinalNames[ordinalForDay] || ordinalForDay+'th'} ${startDayName}`, value: { freq: 'monthly', interval: 1, byDayOrdinal: ordinalForDay, byDayOfWeek: startDayCode } },
    { id: 'yearly', label: `Annually on ${monthName} ${monthDay}`, value: { freq: 'yearly', interval: 1 } },
    { id: 'weekdays', label: 'Every weekday (Mon to Fri)', value: { freq: 'weekly', interval: 1, byDay: ['MO','TU','WE','TH','FR'] } }
  ];

  const currentRec = parseRecurrence(recurrence);
  const matchedPreset = presets.find(p => {
    if (!p.value && !currentRec) return true;
    if (!p.value || !currentRec) return false;
    return JSON.stringify(p.value) === JSON.stringify(currentRec);
  });
  const isCustom = currentRec && !matchedPreset;

  const recurrenceLabel = (rec) => {
    const r = parseRecurrence(rec);
    if (!r) return 'Does not repeat';
    const interval = r.interval || 1;
    if (r.freq === 'daily') return interval === 1 ? 'Daily' : `Every ${interval} days`;
    if (r.freq === 'weekly') {
      if (r.byDay && r.byDay.length > 0) {
        const days = r.byDay.map(d => DAY_LABELS[d]).join(', ');
        const prefix = interval === 1 ? 'Weekly' : `Every ${interval} weeks`;
        return `${prefix} on ${days}`;
      }
      return interval === 1 ? `Weekly on ${startDayName}` : `Every ${interval} weeks on ${startDayName}`;
    }
    if (r.freq === 'monthly') {
      if (r.byDayOrdinal && r.byDayOfWeek) {
        return `Monthly on the ${ordinalNames[r.byDayOrdinal] || r.byDayOrdinal+'th'} ${DAY_LABELS[r.byDayOfWeek]}`;
      }
      return interval === 1 ? `Monthly on day ${monthDay}` : `Every ${interval} months on day ${monthDay}`;
    }
    if (r.freq === 'yearly') return `Annually on ${monthName} ${monthDay}`;
    return 'Custom';
  };

  const currentLabel = isCustom ? recurrenceLabel(recurrence) : (matchedPreset?.label || 'Does not repeat');

  const handleChange = (val) => {
    if (val === 'custom') { setShowCustom(true); return; }
    const preset = presets.find(p => p.id === val);
    if (!preset) return;
    if (!preset.value) onChange('none', null);
    else onChange(JSON.stringify(preset.value), recurrenceEnd);
  };

  return (
    <>
      <select value={isCustom ? 'custom' : (matchedPreset?.id || 'none')} onChange={e => handleChange(e.target.value)}>
        {presets.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
        {isCustom && <option value="__current">{currentLabel}</option>}
        <option value="custom">Custom…</option>
      </select>
      {isCustom && (
        <div style={{ marginTop: '0.5rem', padding: '0.5rem 0.75rem', background: 'var(--bg-soft)', borderRadius: 8, fontSize: '0.78rem', color: 'var(--text-soft)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span>{currentLabel}</span>
          <button className="btn-ghost" style={{ padding: '0.2rem 0.5rem', fontSize: '0.72rem' }} onClick={() => setShowCustom(true)}>Edit</button>
        </div>
      )}
      {(currentRec || isCustom) && (
        <div className="form-group" style={{ marginTop: '0.6rem', marginBottom: 0 }}>
          <label>End repeat (optional)</label>
          <input type="date" value={recurrenceEnd || ''} onChange={e => onChange(recurrence, e.target.value || null)} />
        </div>
      )}
      {showCustom && <CustomRecurrenceModal recurrence={recurrence} startDate={startDate} onSave={(rec) => { onChange(JSON.stringify(rec), recurrenceEnd); setShowCustom(false); }} onClose={() => setShowCustom(false)} />}
    </>
  );
};

const CustomRecurrenceModal = ({ recurrence, startDate, onSave, onClose }) => {
  const start = new Date((startDate || formatDateLocal(new Date())) + 'T00:00:00');
  const initial = parseRecurrence(recurrence) || { freq: 'weekly', interval: 1, byDay: [DAYS_OF_WEEK[start.getDay()]] };
  const [rec, setRec] = useState({
    freq: initial.freq || 'weekly',
    interval: initial.interval || 1,
    byDay: initial.byDay || [],
    byMonthDay: initial.byMonthDay,
    byDayOrdinal: initial.byDayOrdinal,
    byDayOfWeek: initial.byDayOfWeek,
    monthlyMode: initial.byDayOrdinal ? 'weekday' : 'monthday'
  });
  const [endMode, setEndMode] = useState(initial.count ? 'after' : 'never');
  const [count, setCount] = useState(initial.count || 13);

  const toggleDay = (day) => {
    const days = rec.byDay || [];
    setRec({ ...rec, byDay: days.includes(day) ? days.filter(d => d !== day) : [...days, day] });
  };

  const handleSave = () => {
    const out = { freq: rec.freq, interval: parseInt(rec.interval) || 1 };
    if (rec.freq === 'weekly') {
      let days = rec.byDay && rec.byDay.length ? rec.byDay : [DAYS_OF_WEEK[start.getDay()]];
      days = [...days].sort((a, b) => DAYS_OF_WEEK.indexOf(a) - DAYS_OF_WEEK.indexOf(b));
      out.byDay = days;
    }
    if (rec.freq === 'monthly') {
      if (rec.monthlyMode === 'weekday') {
        out.byDayOrdinal = rec.byDayOrdinal || Math.ceil(start.getDate() / 7);
        out.byDayOfWeek = rec.byDayOfWeek || DAYS_OF_WEEK[start.getDay()];
      } else {
        out.byMonthDay = rec.byMonthDay || start.getDate();
      }
    }
    if (endMode === 'after') out.count = parseInt(count) || 1;
    onSave(out);
  };

  const ordForStart = Math.ceil(start.getDate() / 7);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 440 }}>
        <div className="modal-handle"></div>
        <h2>Custom Recurrence</h2>
        <div className="form-group">
          <label>Repeat every</label>
          <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
            <input type="number" min="1" max="99" value={rec.interval} onChange={e => setRec({...rec, interval: e.target.value})} style={{ width: 80 }} />
            <select value={rec.freq} onChange={e => setRec({...rec, freq: e.target.value})} style={{ flex: 1 }}>
              <option value="daily">day{rec.interval > 1 ? 's' : ''}</option>
              <option value="weekly">week{rec.interval > 1 ? 's' : ''}</option>
              <option value="monthly">month{rec.interval > 1 ? 's' : ''}</option>
              <option value="yearly">year{rec.interval > 1 ? 's' : ''}</option>
            </select>
          </div>
        </div>
        {rec.freq === 'weekly' && (
          <div className="form-group">
            <label>On these days</label>
            <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap' }}>
              {DAYS_OF_WEEK.map(d => {
                const selected = (rec.byDay || []).includes(d);
                return (
                  <button key={d} onClick={() => toggleDay(d)} style={{ width: 38, height: 38, borderRadius: '50%', border: `1px solid ${selected ? 'var(--text)' : 'var(--border)'}`, background: selected ? 'var(--text)' : 'var(--bg-card)', color: selected ? 'white' : 'var(--text-soft)', fontFamily: 'inherit', fontWeight: 600, fontSize: '0.85rem', cursor: 'pointer' }}>{DAY_SHORT[d]}</button>
                );
              })}
            </div>
            <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)', marginTop: '0.4rem' }}>S M T W T F S</div>
          </div>
        )}
        {rec.freq === 'monthly' && (
          <div className="form-group">
            <label>Monthly pattern</label>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', textTransform: 'none', fontSize: '0.85rem', fontWeight: 500, color: 'var(--text)' }}>
                <input type="radio" checked={rec.monthlyMode === 'monthday'} onChange={() => setRec({...rec, monthlyMode: 'monthday', byMonthDay: start.getDate()})} />
                On day {start.getDate()} of the month
              </label>
              <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', textTransform: 'none', fontSize: '0.85rem', fontWeight: 500, color: 'var(--text)' }}>
                <input type="radio" checked={rec.monthlyMode === 'weekday'} onChange={() => setRec({...rec, monthlyMode: 'weekday', byDayOrdinal: ordForStart, byDayOfWeek: DAYS_OF_WEEK[start.getDay()]})} />
                On the {ordinalNames[ordForStart] || ordForStart+'th'} {DAY_LABELS[DAYS_OF_WEEK[start.getDay()]]}
              </label>
            </div>
          </div>
        )}
        <div className="form-group">
          <label>Ends</label>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', textTransform: 'none', fontSize: '0.85rem', fontWeight: 500, color: 'var(--text)' }}>
              <input type="radio" checked={endMode === 'never'} onChange={() => setEndMode('never')} />
              Never
            </label>
            <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', textTransform: 'none', fontSize: '0.85rem', fontWeight: 500, color: 'var(--text)' }}>
              <input type="radio" checked={endMode === 'after'} onChange={() => setEndMode('after')} />
              After
              <input type="number" min="1" max="999" value={count} disabled={endMode !== 'after'} onChange={e => setCount(e.target.value)} style={{ width: 70, padding: '0.3rem 0.5rem', border: '1px solid var(--border)', borderRadius: 6, fontSize: '0.85rem', background: 'var(--bg-soft)', color: 'var(--text)', fontFamily: 'inherit' }} />
              occurrence{count > 1 ? 's' : ''}
            </label>
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-soft" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>Done</button>
        </div>
      </div>
    </div>
  );
};

// =================== IMPORT MEETINGS MODAL (OCR) ===================
const ImportMeetingsModal = ({ onClose, onImport }) => {
  const [stage, setStage] = useState('input'); // input | reviewing
  const [textInput, setTextInput] = useState('');
  const [parsing, setParsing] = useState(false);
  const [parsed, setParsed] = useState([]);
  const [imageFile, setImageFile] = useState(null);
  const [ocrProgress, setOcrProgress] = useState(0);

  const handleImage = async (file) => {
    if (!file) return;
    setImageFile(file);
    setParsing(true);
    setOcrProgress(0);
    try {
      const result = await Tesseract.recognize(file, 'eng', { logger: m => { if (m.status === 'recognizing text') setOcrProgress(Math.round(m.progress * 100)); } });
      setTextInput(result.data.text);
      setParsing(false);
    } catch (e) {
      console.error(e);
      setParsing(false);
      alert('OCR failed. Try pasting the text instead.');
    }
  };

  const parseMeetings = () => {
    const lines = textInput.split('\n').map(l => l.trim()).filter(Boolean);
    const meetings = [];
    const today = new Date();
    let currentDate = formatDateLocal(today);
    const dateRegex = /(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/;
    const timeRegex = /(\d{1,2}):(\d{2})/;
    for (const line of lines) {
      const dateMatch = line.match(dateRegex);
      if (dateMatch) {
        const month = parseInt(dateMatch[1]);
        const day = parseInt(dateMatch[2]);
        let year = dateMatch[3] ? parseInt(dateMatch[3]) : today.getFullYear();
        if (year < 100) year += 2000;
        currentDate = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      }
      const timeMatch = line.match(timeRegex);
      if (timeMatch) {
        const start_time = `${String(parseInt(timeMatch[1])).padStart(2,'0')}:${timeMatch[2]}`;
        const title = line.replace(dateRegex, '').replace(timeRegex, '').replace(/[-–—:]/g, '').trim();
        if (title.length > 1) meetings.push({ date: currentDate, start_time, duration: 60, title });
      }
    }
    setParsed(meetings);
    setStage('reviewing');
  };

  const updateParsed = (i, key, val) => {
    const next = [...parsed]; next[i] = { ...next[i], [key]: val }; setParsed(next);
  };

  const removeParsed = (i) => { setParsed(parsed.filter((_, idx) => idx !== i)); };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 600 }}>
        <div className="modal-handle"></div>
        <h2>📸 Import Meetings</h2>
        {stage === 'input' && (
          <>
            <div className="form-group">
              <label>Upload screenshot</label>
              <input type="file" accept="image/*" onChange={e => handleImage(e.target.files?.[0])} />
            </div>
            {parsing && <div style={{ padding: '0.5rem', background: 'var(--bg-soft)', borderRadius: 6, fontSize: '0.85rem', textAlign: 'center', marginBottom: '0.85rem' }}>Reading… {ocrProgress}%</div>}
            <div className="form-group">
              <label>Or paste text</label>
              <textarea rows={8} placeholder="Paste calendar text…" value={textInput} onChange={e => setTextInput(e.target.value)} />
            </div>
            <div className="modal-actions">
              <button className="btn btn-soft" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary" disabled={!textInput.trim()} onClick={parseMeetings}>Parse</button>
            </div>
          </>
        )}
        {stage === 'reviewing' && (
          <>
            <div style={{ fontSize: '0.825rem', color: 'var(--text-muted)', marginBottom: '0.85rem' }}>Found {parsed.length} meetings. Review and edit before importing.</div>
            <div style={{ maxHeight: 400, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.5rem', marginBottom: '0.85rem' }}>
              {parsed.map((m, i) => (
                <div key={i} style={{ background: 'var(--bg-soft)', padding: '0.5rem', borderRadius: 8 }}>
                  <input type="text" value={m.title} onChange={e => updateParsed(i, 'title', e.target.value)} style={{ width: '100%', padding: '0.4rem 0.5rem', border: '1px solid var(--border)', borderRadius: 4, marginBottom: '0.25rem', background: 'var(--bg-card)', color: 'var(--text)', fontFamily: 'inherit', fontSize: '0.825rem' }} />
                  <div style={{ display: 'flex', gap: '0.3rem', alignItems: 'center' }}>
                    <input type="date" value={m.date} onChange={e => updateParsed(i, 'date', e.target.value)} style={{ flex: 1, padding: '0.3rem 0.5rem', fontSize: '0.78rem', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text)' }} />
                    <input type="time" value={m.start_time} onChange={e => updateParsed(i, 'start_time', e.target.value)} style={{ padding: '0.3rem 0.5rem', fontSize: '0.78rem', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text)' }} />
                    <input type="number" value={m.duration} onChange={e => updateParsed(i, 'duration', parseInt(e.target.value))} style={{ width: 60, padding: '0.3rem 0.5rem', fontSize: '0.78rem', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 4, color: 'var(--text)' }} />
                    <button className="btn-ghost" onClick={() => removeParsed(i)}>🗑</button>
                  </div>
                </div>
              ))}
            </div>
            <div className="modal-actions">
              <button className="btn btn-soft" onClick={() => setStage('input')}>← Back</button>
              <button className="btn btn-primary" disabled={parsed.length === 0} onClick={() => onImport(parsed)}>Import {parsed.length}</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
};
