<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<title>Command Center</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#F5F1EA"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Command Center"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23F5F1EA' width='32' height='32' rx='8'/><circle cx='16' cy='16' r='6' fill='%23E8859A'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #F5F1EA;
  --bg-card: #FFFFFF;
  --bg-soft: #FAF7F2;
  --border: #E8E2D7;
  --border-soft: #F0EBE0;
  --text: #1F1B16;
  --text-soft: #5C544A;
  --text-muted: #9B9388;
  --accent: #FF7A59;
  --accent-soft: #FFE8E0;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow-sm: 0 1px 2px rgba(31, 27, 22, 0.06);
  --shadow: 0 4px 16px rgba(31, 27, 22, 0.08);
  --shadow-lg: 0 12px 32px rgba(31, 27, 22, 0.12);
  --sidebar-w: 240px;
}

[data-theme="dark"] {
  --bg: #1A1815;
  --bg-card: #25221E;
  --bg-soft: #1F1D1A;
  --border: #3A3530;
  --border-soft: #2D2A26;
  --text: #F2EDE5;
  --text-soft: #C4BEB3;
  --text-muted: #807A70;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(155, 147, 136, 0.3); border-radius: 3px; }

input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============= MOBILE LAYOUT (default) ============= */
.app-shell { padding-bottom: 100px; }

/* Top header */
.top-bar {
  padding: 1.25rem 1.25rem 0.75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.greeting-text {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--text);
  letter-spacing: -0.01em;
}

.greeting-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 1px;
}

.top-actions { display: flex; gap: 0.4rem; align-items: center; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: all 0.2s;
  color: var(--text-soft);
}

.icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }

/* Big page title */
.page-title-area { padding: 0.5rem 1.25rem 1rem; }
.page-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: 2.25rem;
  color: var(--text);
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.page-subtitle {
  color: var(--text-muted);
  font-size: 0.875rem;
  margin-top: 0.4rem;
  font-weight: 500;
}

/* Date pill nav */
.date-nav-pills {
  padding: 0 1.25rem 1rem;
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  scrollbar-width: none;
}

.date-nav-pills::-webkit-scrollbar { display: none; }

.date-pill {
  flex-shrink: 0;
  padding: 0.6rem 0.8rem;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border);
  cursor: pointer;
  text-align: center;
  min-width: 56px;
  transition: all 0.2s;
}

.date-pill .pill-dow {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.date-pill .pill-num {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
}

.date-pill.today { background: var(--text); color: white; border-color: var(--text); }
.date-pill.today .pill-dow,
.date-pill.today .pill-num { color: white; }

.date-pill.selected:not(.today) {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.date-pill.selected:not(.today) .pill-num,
.date-pill.selected:not(.today) .pill-dow { color: var(--accent); }

/* Bottom tabs (mobile) */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.95);
  border-top: 1px solid var(--border);
  padding: 0.5rem 1rem 1rem;
  display: flex;
  justify-content: space-around;
  z-index: 100;
  backdrop-filter: blur(20px);
}

[data-theme="dark"] .tab-bar { background: rgba(37, 34, 30, 0.95); }

.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  padding: 0.6rem 0.4rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.65rem;
  font-weight: 600;
  transition: all 0.2s;
  position: relative;
  border-radius: 12px;
}

.tab-btn .tab-icon { font-size: 1.3rem; line-height: 1; }
.tab-btn:hover { color: var(--text-soft); }
.tab-btn.active { color: var(--accent); }
.tab-btn.active .tab-icon { transform: scale(1.1); }
.tab-btn.has-badge::after {
  content: attr(data-count);
  position: absolute;
  top: 4px;
  right: calc(50% - 18px);
  background: #FF7A6B;
  color: white;
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 10px;
  font-weight: 700;
  min-width: 16px;
  text-align: center;
}

/* Content container */
.content { padding: 0 1.25rem; max-width: 700px; margin: 0 auto; width: 100%; }

/* ============= DESKTOP LAYOUT ============= */
@media (min-width: 900px) {
  .app-shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    padding-bottom: 0;
    min-height: 100vh;
  }

  .tab-bar {
    position: relative;
    border-top: none;
    border-right: 1px solid var(--border);
    background: var(--bg);
    padding: 1.25rem 0.75rem;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    gap: 0.25rem;
    backdrop-filter: none;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
  }

  [data-theme="dark"] .tab-bar { background: var(--bg); }

  .tab-bar-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0 0.6rem 1.25rem;
    margin-bottom: 0.25rem;
    border-bottom: 1px solid var(--border-soft);
  }

  .tab-bar-brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1rem;
    font-weight: 700;
  }

  .tab-bar-brand-text {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .tab-btn {
    flex-direction: row;
    justify-content: flex-start;
    padding: 0.6rem 0.85rem;
    gap: 0.65rem;
    border-radius: 10px;
    font-size: 0.875rem;
    font-weight: 600;
    text-align: left;
  }

  .tab-btn .tab-icon { font-size: 1.05rem; }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
  .tab-btn.active .tab-icon { transform: none; }
  .tab-btn.has-badge::after {
    position: static;
    margin-left: auto;
  }

  .top-bar { padding: 1.5rem 2rem 0.75rem; }
  .page-title-area { padding: 0.5rem 2rem 1.25rem; }
  .content { padding: 0 2rem; max-width: 1100px; }
  .date-nav-pills { padding: 0 2rem 1rem; }

  .app-shell-main {
    overflow-x: hidden;
  }

  .home-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (min-width: 1200px) {
  :root { --sidebar-w: 260px; }
  .home-grid { grid-template-columns: 1fr 1fr 1fr; }
}

.show-mobile { display: block; }
.hide-mobile { display: none; }

@media (min-width: 900px) {
  .show-mobile { display: none; }
  .hide-mobile { display: block; }
}

/* Buttons */
.btn {
  padding: 0.65rem 1rem;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.btn-primary { background: var(--text); color: white; }
.btn-primary:hover { background: #000; transform: translateY(-1px); }

.btn-soft { background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }
.btn-soft:hover { background: var(--border-soft); }

.btn-ghost { background: transparent; color: var(--text-muted); border: none; padding: 0.4rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
.btn-ghost:hover { color: var(--text); }

.btn-danger { background: #FF7A6B; color: white; }
.btn-danger:hover { background: #E5685A; }

/* ============= HOME (Evernote-inspired) ============= */
.home-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
  margin-top: 0.5rem;
}

.home-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  min-height: 240px;
}

.home-card.scratch-pad {
  background: linear-gradient(135deg, #FFF8DC, #FFFAEC);
  border-color: #F5DC8A;
}

[data-theme="dark"] .home-card.scratch-pad {
  background: linear-gradient(135deg, #2A2820, #25221E);
  border-color: #524826;
}

.home-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.home-card-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.home-card-action {
  font-size: 0.75rem;
  color: var(--text-muted);
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
}

.home-card-action:hover { color: var(--accent); }

.home-card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.home-empty {
  color: var(--text-muted);
  font-size: 0.85rem;
  font-style: italic;
  padding: 1rem 0;
  text-align: center;
}

.home-list-item {
  padding: 0.65rem 0.75rem;
  background: var(--bg-soft);
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.85rem;
  cursor: pointer;
  border-left: 3px solid var(--border);
  transition: all 0.15s;
}

.home-list-item:hover { background: var(--border-soft); }

.home-list-item .home-list-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.home-list-item .home-list-meta {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.scratch-textarea {
  flex: 1;
  width: 100%;
  border: none;
  background: transparent;
  resize: none;
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--text);
  min-height: 150px;
}

.scratch-textarea:focus { outline: none; }
.scratch-save-status {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 0.5rem;
  font-style: italic;
}

.home-pinned-card {
  background: var(--bg-soft);
  border-radius: 10px;
  padding: 1rem;
  cursor: pointer;
  flex: 1;
  display: flex;
  flex-direction: column;
  border-left: 3px solid var(--accent);
}

.home-pinned-card:hover { background: var(--border-soft); }

.home-pinned-title {
  font-weight: 700;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.95rem;
  margin-bottom: 0.4rem;
}

.home-pinned-preview {
  flex: 1;
  font-size: 0.8rem;
  color: var(--text-muted);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 6;
  -webkit-box-orient: vertical;
}

/* ============= TIMELINE (Today view) ============= */
.timeline { position: relative; padding: 0.5rem 0; }

.timeline-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
  align-items: stretch;
  position: relative;
}

.timeline-time {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  padding-top: 1rem;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.event-card {
  border-radius: var(--radius);
  padding: 0.85rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  min-height: 56px;
}

.event-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.event-card.privacy-blur { filter: blur(5px); }

.event-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.55);
}

.event-content { flex: 1; min-width: 0; }

.event-title {
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--text);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.event-meta {
  font-size: 0.72rem;
  color: var(--text-soft);
  font-weight: 500;
  display: flex;
  gap: 0.4rem;
  align-items: center;
}

.event-duration-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

/* Empty state */
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
.empty-state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.empty-state-title { font-weight: 700; color: var(--text-soft); margin-bottom: 0.25rem; font-size: 1rem; }
.empty-state-text { font-size: 0.85rem; }

/* FAB */
.fab {
  position: fixed;
  bottom: 90px;
  right: 1.25rem;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--text);
  color: white;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-weight: 300;
}

@media (min-width: 900px) { .fab { bottom: 1.5rem; right: 1.5rem; } }

.fab:hover { transform: scale(1.05); }

/* ============= INBOX ============= */
.brain-dump {
  background: linear-gradient(135deg, #FCEBC8, #FFF5DC);
  border: 2px dashed #F5B544;
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1.25rem;
}

[data-theme="dark"] .brain-dump {
  background: linear-gradient(135deg, #2D2820, #2A2520);
  border-color: #6B5230;
}

.brain-dump-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  font-size: 0.85rem;
  color: #8B6F2A;
  margin-bottom: 0.5rem;
}

.brain-dump textarea {
  width: 100%;
  min-height: 100px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.95rem;
  resize: vertical;
  color: var(--text);
}

.brain-dump textarea:focus { outline: none; }
.brain-dump textarea::placeholder { color: #B58105; }
.brain-dump-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.75rem; }

.inbox-list { display: flex; flex-direction: column; gap: 0.5rem; }

.inbox-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.85rem 1rem;
  transition: all 0.2s;
  cursor: pointer;
}

.inbox-card:hover { border-color: var(--text-muted); }
.inbox-card.expanded { border-color: var(--accent); box-shadow: var(--shadow); }
.inbox-card.starred { background: linear-gradient(135deg, #FFFAF0, var(--bg-card)); border-color: #F5B544; }

.inbox-card-row { display: flex; gap: 0.75rem; align-items: flex-start; }

.inbox-circle {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 50%;
  flex-shrink: 0;
  cursor: pointer;
  margin-top: 1px;
  background: var(--bg-card);
  transition: all 0.2s;
}

.inbox-circle:hover { border-color: #5DCFA0; background: #DCF4E8; }

.inbox-main { flex: 1; min-width: 0; }
.inbox-title { font-weight: 600; color: var(--text); font-size: 0.95rem; word-break: break-word; line-height: 1.35; }
.inbox-pills { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; align-items: center; }

.inbox-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0.25rem 0.6rem;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
}

.inbox-pill.high { background: #FFE5E0; color: #B83A2C; }
.inbox-pill.medium { background: #FCEBC8; color: #8B6F2A; }
.inbox-pill.low { background: #DCF4E8; color: #2D7A56; }
.inbox-pill.due-overdue { background: #FFE5E0; color: #B83A2C; font-weight: 700; }
.inbox-pill.due-today { background: #FCEBC8; color: #8B6F2A; font-weight: 700; }
.inbox-pill.due-future { background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }

.inbox-tag-empty { font-size: 0.7rem; color: var(--text-muted); font-style: italic; }

.star-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 1.15rem;
  padding: 0;
  line-height: 1;
  opacity: 0.35;
  transition: opacity 0.2s;
  color: #F5B544;
  flex-shrink: 0;
}

.star-btn.starred { opacity: 1; }
.star-btn:hover { opacity: 0.85; }

.inbox-expand {
  margin-top: 0.85rem;
  padding-top: 0.85rem;
  border-top: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.detail-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 0.5rem;
  align-items: center;
}

.detail-row label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

.detail-row input,
.detail-row select,
.detail-row textarea {
  padding: 0.5rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  background: var(--bg-soft);
  color: var(--text);
  width: 100%;
}

.detail-row textarea { min-height: 60px; resize: vertical; }
.detail-row input:focus, .detail-row select:focus, .detail-row textarea:focus {
  outline: none; border-color: var(--accent); background: var(--bg-card);
}

.expand-actions {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-top: 0.25rem;
}

/* Filter chips */
.filter-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 1rem;
  overflow-x: auto;

// Convert hex to soft background
const hexToSoftBg = (hex) => {
  if (!hex || !hex.startsWith('#')) hex = '#8A8A8A';
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  // Mix toward white at ~85% white
  const sr = Math.round(r * 0.18 + 255 * 0.82);
  const sg = Math.round(g * 0.18 + 255 * 0.82);
  const sb = Math.round(b * 0.18 + 255 * 0.82);
  return `rgb(${sr}, ${sg}, ${sb})`;
};

const hexToTextColor = (hex) => {
  if (!hex || !hex.startsWith('#')) hex = '#8A8A8A';
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  // Darken
  const tr = Math.round(r * 0.5);
  const tg = Math.round(g * 0.5);
  const tb = Math.round(b * 0.5);
  return `rgb(${tr}, ${tg}, ${tb})`;
};

const formatDateLocal = (date) => {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
};

const getWeekStart = (date) => {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d;
};

const minutesFromTime = (t) => {
  const [h, m] = t.split(':');
  return parseInt(h) * 60 + parseInt(m);
};

const computeMeetingLayouts = (meetings) => {
  if (!meetings.length) return [];
  const enriched = meetings.map(m => ({ ...m, _start: minutesFromTime(m.start_time), _end: minutesFromTime(m.start_time) + m.duration }));
  enriched.sort((a, b) => a._start - b._start);
  return enriched.map(meeting => {
    const overlapping = enriched.filter(m => m._start < meeting._end && m._end > meeting._start);
    overlapping.sort((a, b) => a._start - b._start);
    const colIdx = overlapping.findIndex(m => (m.id && m.id === meeting.id) || (m === meeting));
    return { ...meeting, _col: Math.max(colIdx, 0), _totalCols: overlapping.length || 1 };
  });
};

const meetingOccursOn = (meeting, dateStr) => {
  if (!meeting.recurrence || meeting.recurrence === 'none') return meeting.date === dateStr;
  const meetingDate = new Date(meeting.date + 'T00:00:00');
  const checkDate = new Date(dateStr + 'T00:00:00');
  if (checkDate < meetingDate) return false;
  if (meeting.recurrence_end) {
    const endDate = new Date(meeting.recurrence_end + 'T00:00:00');
    if (checkDate > endDate) return false;
  }
  const dayDiff = Math.floor((checkDate - meetingDate) / (1000 * 60 * 60 * 24));
  switch (meeting.recurrence) {
    case 'daily': return true;
    case 'weekdays': return checkDate.getDay() >= 1 && checkDate.getDay() <= 5;
    case 'weekly': return dayDiff % 7 === 0;
    case 'biweekly': return dayDiff % 14 === 0;
    case 'monthly': return checkDate.getDate() === meetingDate.getDate();
    default: return false;
  }
};

// =============== Markdown renderer (basic) ===============
const renderMarkdown = (text) => {
  if (!text) return '';
  let html = text;
  // Escape HTML
  html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Code blocks (must come before inline code)
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Bold + italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Strikethrough
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // Lists
  const lines = html.split('\n');
  let inUl = false, inOl = false;
  const processed = [];
  for (let line of lines) {
    if (/^\s*[-*+] (.+)/.test(line)) {
      if (!inUl) { processed.push('<ul>'); inUl = true; }
      if (inOl) { processed.push('</ol>'); inOl = false; }
      processed.push('<li>' + line.replace(/^\s*[-*+] /, '') + '</li>');
    } else if (/^\s*\d+\. (.+)/.test(line)) {
      if (!inOl) { processed.push('<ol>'); inOl = true; }
      if (inUl) { processed.push('</ul>'); inUl = false; }
      processed.push('<li>' + line.replace(/^\s*\d+\. /, '') + '</li>');
    } else {
      if (inUl) { processed.push('</ul>'); inUl = false; }
      if (inOl) { processed.push('</ol>'); inOl = false; }
      processed.push(line);
    }
  }
  if (inUl) processed.push('</ul>');
  if (inOl) processed.push('</ol>');
  html = processed.join('\n');
  // Paragraphs (lines that aren't already block elements)
  html = html.split(/\n\n+/).map(block => {
    const trimmed = block.trim();
    if (!trimmed) return '';
    if (/^<(h[1-6]|ul|ol|pre|blockquote)/.test(trimmed)) return trimmed;
    return '<p>' + trimmed.replace(/\n/g, '<br/>') + '</p>';
  }).join('\n');
  return html;
};

// =============== Color Picker Component ===============
const ColorPicker = ({ value, onChange }) => {
  const [hex, setHex] = useState(value || '#8A8A8A');

  useEffect(() => { setHex(value || '#8A8A8A'); }, [value]);

  const handleHexChange = (val) => {
    setHex(val);
    if (/^#[0-9A-Fa-f]{6}$/.test(val)) onChange(val.toUpperCase());
  };

  return (
    <div>
      <div className="color-picker">
        <input
          type="color"
          value={hex}
          onChange={(e) => { setHex(e.target.value.toUpperCase()); onChange(e.target.value.toUpperCase()); }}
          className="color-native-picker"
          style={{ borderRadius: '12px', overflow: 'hidden', background: hex }}
          title="Color wheel"
        />
        <div className="color-input-stack">
          <input
            type="text"
            value={hex}
            onChange={(e) => handleHexChange(e.target.value)}
            className="color-hex-input"
            placeholder="#RRGGBB"
            maxLength={7}
          />
        </div>
      </div>
      <div style={{ marginTop: '0.75rem' }}>
        <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)', fontWeight: 600, marginBottom: '0.4rem', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Presets</div>
        <div className="color-presets">
          {COLOR_PRESETS.map(c => (
            <div
              key={c}
              className={`color-preset ${hex.toUpperCase() === c.toUpperCase() ? 'selected' : ''}`}
              style={{ background: c }}
              onClick={() => { setHex(c); onChange(c); }}
              title={c}
            ></div>
          ))}
        </div>
      </div>
    </div>
  );
};

// =============== MONTH ===============
const MonthView = ({ meetings, tasks, currentDate, setCurrentDate, setView }) => {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay();
  const days = [];
  for (let i = startOffset; i > 0; i--) {
    const d = new Date(year, month, 1 - i);
    days.push({ date: d, otherMonth: true });
  }
  for (let i = 1; i <= lastDay.getDate(); i++) {
    days.push({ date: new Date(year, month, i), otherMonth: false });
  }
  while (days.length % 7 !== 0) {
    const last = days[days.length - 1].date;
    const next = new Date(last);
    next.setDate(next.getDate() + 1);
    days.push({ date: next, otherMonth: true });
  }

  const navigateMonth = (dir) => {
    const d = new Date(currentDate);
    d.setMonth(d.getMonth() + dir);
    setCurrentDate(d);
  };

  return (
    <>
      <div className="page-title-area" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: '0.5rem' }}>
        <div>
          <div className="page-title">{currentDate.toLocaleDateString('en-US', { month: 'long' })}</div>
          <div className="page-subtitle">{currentDate.getFullYear()}</div>
        </div>
        <div style={{ display: 'flex', gap: '0.4rem' }}>
          <button className="icon-btn" onClick={() => navigateMonth(-1)}>‹</button>
          <button className="icon-btn" onClick={() => setCurrentDate(new Date())}>•</button>
          <button className="icon-btn" onClick={() => navigateMonth(1)}>›</button>
        </div>
      </div>

      <div className="month-grid">
        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => (<div key={i} className="month-day-head">{d}</div>))}
        {days.map(({ date, otherMonth }, idx) => {
          const dateStr = formatDateLocal(date);
          const dayMeetings = meetings.filter(m => meetingOccursOn(m, dateStr));
          const dayTasks = tasks.filter(t => t.date === dateStr && !t.completed);
          const isToday = date.toDateString() === new Date().toDateString();
          const isSelected = !isToday && date.toDateString() === currentDate.toDateString();
          return (
            <div key={idx} className={`month-cell ${otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`} onClick={() => { setCurrentDate(date); setView('today'); }}>
              <div className="month-cell-num">{date.getDate()}</div>
              <div className="month-cell-events">
                {dayMeetings.slice(0, 3).map((m, i) => (<div key={`m-${i}`} className="month-event-pill" style={{ background: m.job }}></div>))}
                {dayTasks.length > 0 && dayMeetings.length < 3 && Array.from({ length: Math.min(dayTasks.length, 3 - dayMeetings.length) }).map((_, i) => {
                  const cat = getCategoryById(dayTasks[i].context);
                  return <div key={`t-${i}`} className="month-event-pill" style={{ background: cat.color }}></div>;
                })}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
};

// =============== INBOX ===============
const InboxView = ({ inboxItems, brainDumpText, setBrainDumpText, addInboxItem, inboxFilter, setInboxFilter, inboxSort, setInboxSort, expandedInboxId, setExpandedInboxId, updateInboxItem, convertInboxToTask, convertInboxToMeeting, deleteInboxItem }) => {

  const filtered = useMemo(() => {
    let f = [...inboxItems];
    if (inboxFilter === 'starred') f = f.filter(i => i.starred);
    else if (inboxFilter === 'high') f = f.filter(i => i.priority === 'high');
    else if (inboxFilter === 'today') {
      const today = formatDateLocal(new Date());
      f = f.filter(i => i.due_date === today);
    } else if (inboxFilter === 'unsorted') {
      f = f.filter(i => !i.category && !i.priority && !i.due_date);
    }
    if (inboxSort === 'oldest') f.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    else if (inboxSort === 'newest') f.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    else if (inboxSort === 'priority') {
      const ord = { high: 0, medium: 1, low: 2 };
      f.sort((a, b) => (ord[a.priority] ?? 3) - (ord[b.priority] ?? 3));
    } else if (inboxSort === 'due') {
      f.sort((a, b) => {
        if (!a.due_date && !b.due_date) return 0;
        if (!a.due_date) return 1;
        if (!b.due_date) return -1;
        return new Date(a.due_date) - new Date(b.due_date);
      });
    }
    return f;
  }, [inboxItems, inboxFilter, inboxSort]);

  return (
    <>
      <div className="page-title-area">
        <div className="page-title">Inbox</div>
        <div className="page-subtitle">{inboxItems.length} item{inboxItems.length !== 1 ? 's' : ''} · capture first, organize later</div>
      </div>

      <div className="brain-dump">
        <div className="brain-dump-label">⚡ Brain Dump</div>
        <textarea value={brainDumpText} onChange={(e) => setBrainDumpText(e.target.value)} placeholder="Drop everything here. One thought per line. Don't filter — just capture..." />
        <div className="brain-dump-actions">
          <button className="btn btn-ghost" onClick={() => setBrainDumpText('')}>Clear</button>
          <button className="btn btn-primary" onClick={addInboxItem}>Capture</button>
        </div>
      </div>

      {inboxItems.length > 0 && (
        <div className="filter-row">
          <button className={`chip ${inboxFilter === 'all' ? 'active' : ''}`} onClick={() => setInboxFilter('all')}>All</button>
          <button className={`chip ${inboxFilter === 'starred' ? 'active' : ''}`} onClick={() => setInboxFilter('starred')}>⭐</button>
          <button className={`chip ${inboxFilter === 'high' ? 'active' : ''}`} onClick={() => setInboxFilter('high')}>🔴 High</button>
          <button className={`chip ${inboxFilter === 'today' ? 'active' : ''}`} onClick={() => setInboxFilter('today')}>📅 Today</button>
          <button className={`chip ${inboxFilter === 'unsorted' ? 'active' : ''}`} onClick={() => setInboxFilter('unsorted')}>🆕 Unsorted</button>
          <select className="sort-select" value={inboxSort} onChange={(e) => setInboxSort(e.target.value)}>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="priority">Priority</option>
            <option value="due">Due date</option>
          </select>
        </div>
      )}

      {filtered.length === 0 ? (
        <div className="empty-state">
          <div className="empty-state-icon">📭</div>
          <div className="empty-state-title">{inboxFilter !== 'all' ? 'No matches' : 'Inbox empty'}</div>
        </div>
      ) : (
        <div className="inbox-list">
          {filtered.map(item => {
            const isExpanded = expandedInboxId === item.id;
            const today = formatDateLocal(new Date());
            const isOverdue = item.due_date && item.due_date < today;
            const isDueToday = item.due_date === today;
            const cat = item.category ? getCategoryById(item.category) : null;

            return (
              <div key={item.id} className={`inbox-card ${isExpanded ? 'expanded' : ''} ${item.starred ? 'starred' : ''}`}>
                <div className="inbox-card-row">
                  <div className="inbox-circle" onClick={(e) => { e.stopPropagation(); convertInboxToTask(item); }}></div>
                  <div className="inbox-main" onClick={() => setExpandedInboxId(isExpanded ? null : item.id)}>
                    <div className="inbox-title">{item.text}</div>
                    <div className="inbox-pills">
                      {cat && <span className="inbox-pill" style={{ background: hexToSoftBg(cat.color), color: hexToTextColor(cat.color) }}>{cat.icon} {cat.label}</span>}
                      {item.priority && <span className={`inbox-pill ${item.priority}`}>{item.priority === 'high' ? '🔴' : item.priority === 'medium' ? '🟡' : '🟢'} {item.priority}</span>}
                      {item.due_date && (
                        <span className={`inbox-pill ${isOverdue ? 'due-overdue' : isDueToday ? 'due-today' : 'due-future'}`}>
                          📅 {new Date(item.due_date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
                          {isOverdue && ' · OVERDUE'}{isDueToday && ' · TODAY'}
                        </span>
                      )}
                      {!cat && !item.priority && !item.due_date && <span className="inbox-tag-empty">tap to organize</span>}
                    </div>
                  </div>
                  <button className={`star-btn ${item.starred ? 'starred' : ''}`} onClick={(e) => { e.stopPropagation(); updateInboxItem(item.id, { starred: !item.starred }); }}>{item.starred ? '⭐' : '☆'}</button>
                </div>

                {isExpanded && (
                  <div className="inbox-expand">
                    <div className="detail-row">
                      <label>Category</label>
                      <select value={item.category || ''} onChange={(e) => updateInboxItem(item.id, { category: e.target.value || null })}>
                        <option value="">None</option>
                        {_categoriesCache.map(c => <option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                      </select>
                    </div>
                    <div className="detail-row">
                      <label>Priority</label>
                      <select value={item.priority || ''} onChange={(e) => updateInboxItem(item.id, { priority: e.target.value || null })}>
                        <option value="">None</option>
                        <option value="high">🔴 High</option>
                        <option value="medium">🟡 Medium</option>
                        <option value="low">🟢 Low</option>
                      </select>
                    </div>
                    <div className="detail-row">
                      <label>Due</label>
                      <input type="date" value={item.due_date || ''} onChange={(e) => updateInboxItem(item.id, { due_date: e.target.value || null })} />
                    </div>
                    <div className="detail-row">
                      <label>Notes</label>
                      <textarea placeholder="Optional details..." defaultValue={item.notes || ''} onBlur={(e) => updateInboxItem(item.id, { notes: e.target.value || null })} />
                    </div>
                    <div className="expand-actions">
                      <button className="btn btn-soft" onClick={() => convertInboxToTask(item)}>→ Task</button>
                      <button className="btn btn-soft" onClick={() => convertInboxToMeeting(item)}>→ Meeting</button>
                      <button className="btn btn-danger" onClick={() => deleteInboxItem(item.id)}>Delete</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </>
  );
};

// =============== NOTES ===============
const NotesView = ({ notes, allNotes, activeNote, setActiveNoteId, notebooks, selectedNotebookId, setSelectedNotebookId, noteSearch, setNoteSearch, previewMode, setPreviewMode, createNote, updateNote, deleteNote, pinnedNoteId, togglePinnedNote, setShowNotebookModal }) => {
  const [editTitle, setEditTitle] = useState('');
  const [editBody, setEditBody] = useState('');
  const [tagInput, setTagInput] = useState('');
  const saveTimer = useRef(null);

  useEffect(() => {
    if (activeNote) {
      setEditTitle(activeNote.title || '');
      setEditBody(activeNote.body || '');
    }
  }, [activeNote?.id]);

  const debouncedSave = (updates) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      if (activeNote) updateNote(activeNote.id, updates);
    }, 600);
  };

  const handleTitleChange = (val) => {
    setEditTitle(val);
    debouncedSave({ title: val, body: editBody });
  };

  const handleBodyChange = (val) => {
    setEditBody(val);
    debouncedSave({ title: editTitle, body: val });
  };

  const insertMarkdown = (before, after = '') => {
    const ta = document.querySelector('.note-body-input');
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selected = editBody.substring(start, end);
    const newText = editBody.substring(0, start) + before + selected + after + editBody.substring(end);
    setEditBody(newText);
    debouncedSave({ title: editTitle, body: newText });
    setTimeout(() => {
      ta.focus();
      ta.setSelectionRange(start + before.length, start + before.length + selected.length);
    }, 0);
  };

  const addTag = (e) => {
    if (e.key === 'Enter' && tagInput.trim() && activeNote) {
      const newTags = [...(activeNote.tags || []), tagInput.trim()];
      updateNote(activeNote.id, { tags: newTags });
      setTagInput('');
    }
  };

  const removeTag = (tag) => {
    if (!activeNote) return;
    const newTags = (activeNote.tags || []).filter(t => t !== tag);
    updateNote(activeNote.id, { tags: newTags });
  };

  return (
    <>
      <div className="page-title-area">
        <div className="page-title">Notes</div>
        <div className="page-subtitle">{allNotes.length} note{allNotes.length !== 1 ? 's' : ''}</div>
      </div>

      <div className="notes-layout">
        <div className="notes-sidebar">
          <input type="text" className="notes-search" placeholder="🔍 Search notes..." value={noteSearch} onChange={(e) => setNoteSearch(e.target.value)} />

          <div className="notebook-section">
            <div className="notebook-header">
              <span>Notebooks</span>
              <button className="notebook-add-btn" onClick={() => setShowNotebookModal({})}>+</button>
            </div>
            <div className={`notebook-item ${selectedNotebookId === 'all' ? 'active' : ''}`} onClick={() => setSelectedNotebookId('all')}>
              <span>📚</span>
              <span>All Notes</span>
              <span className="nb-count">{allNotes.length}</span>
            </div>
            <div className={`notebook-item ${selectedNotebookId === 'unfiled' ? 'active' : ''}`} onClick={() => setSelectedNotebookId('unfiled')}>
              <span>📥</span>
              <span>Unfiled</span>
              <span className="nb-count">{allNotes.filter(n => !n.notebook_id).length}</span>
            </div>
            {notebooks.map(nb => (
              <div
                key={nb.id}
                className={`notebook-item ${selectedNotebookId === nb.id ? 'active' : ''}`}
                style={{ borderLeftColor: nb.color }}
                onClick={() => setSelectedNotebookId(nb.id)}
                onDoubleClick={() => setShowNotebookModal(nb)}
              >
                <span>{nb.icon}</span>
                <span>{nb.name}</span>
                <span className="nb-count">{allNotes.filter(n => n.notebook_id === nb.id).length}</span>
              </div>
            ))}
          </div>

          <div className="notebook-section" style={{ marginTop: '0.5rem' }}>
            <div className="notebook-header">
              <span>Notes</span>
              <button className="notebook-add-btn" onClick={() => createNote(selectedNotebookId !== 'all' && selectedNotebookId !== 'unfiled' ? selectedNotebookId : null)}>+</button>
            </div>
            {notes.length === 0 ? (
              <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', padding: '0.5rem', fontStyle: 'italic' }}>No notes yet</div>
            ) : notes.map(n => {
              const preview = (n.body || '').replace(/[#*`>_\-\[\]]/g, '').substring(0, 60);
              return (
                <div key={n.id} className={`note-list-item ${activeNote?.id === n.id ? 'active' : ''}`} style={{ borderLeftColor: n.color || '#8A8A8A' }} onClick={() => setActiveNoteId(n.id)}>
                  <div className="note-list-title">
                    {n.id === pinnedNoteId && <span className="note-pinned">📌 </span>}
                    {n.title || 'Untitled'}
                  </div>
                  <div className="note-list-preview">{preview || 'Empty note'}</div>
                  {n.tags && n.tags.length > 0 && (
                    <div className="note-list-meta">
                      {n.tags.slice(0, 3).map((t, i) => (
                        <span key={i} className="note-tag-pill" style={{ background: 'var(--bg-card)', color: 'var(--text-muted)' }}>#{t}</span>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        <div className="notes-editor">
          {!activeNote ? (
            <div className="notes-empty-editor">
              <div style={{ fontSize: '3rem' }}>📝</div>
              <div style={{ fontWeight: 700, color: 'var(--text-soft)' }}>Select a note to start</div>
              <button className="btn btn-soft" onClick={() => createNote(selectedNotebookId !== 'all' && selectedNotebookId !== 'unfiled' ? selectedNotebookId : null)}>+ New note</button>
            </div>
          ) : (
            <>
              <div className="notes-editor-toolbar">
                <button className="toolbar-btn" onClick={() => insertMarkdown('**', '**')} title="Bold"><strong>B</strong></button>
                <button className="toolbar-btn" onClick={() => insertMarkdown('*', '*')} title="Italic"><em>I</em></button>
                <button className="toolbar-btn" onClick={() => insertMarkdown('~~', '~~')} title="Strikethrough"><del>S</del></button>
                <div className="toolbar-divider"></div>
                <button className="toolbar-btn" onClick={() => insertMarkdown('# ')} title="Heading 1">H1</button>
                <button className="toolbar-btn" onClick={() => insertMarkdown('## ')} title="Heading 2">H2</button>
                <button className="toolbar-btn" onClick={() => insertMarkdown('### ')} title="Heading 3">H3</button>
                <div className="toolbar-divider"></div>
                <button className="toolbar-btn" onClick={() => insertMarkdown('- ')} title="Bullet">•</button>
                <button className="toolbar-btn" onClick={() => insertMarkdown('1. ')} title="Numbered">1.</button>
                <button className="toolbar-btn" onClick={() => insertMarkdown('> ')} title="Quote">❝</button>
                <button className="toolbar-btn" onClick={() => insertMarkdown('`', '`')} title="Code">{'<>'}</button>
                <div className="toolbar-divider"></div>
                <button className={`toolbar-btn ${previewMode ? 'active' : ''}`} onClick={() => setPreviewMode(!previewMode)} title="Preview">👁</button>
                <button className={`toolbar-btn ${pinnedNoteId === activeNote.id ? 'active' : ''}`} onClick={() => togglePinnedNote(activeNote.id)} title="Pin">📌</button>
                <div style={{ marginLeft: 'auto', display: 'flex', gap: '0.4rem' }}>
                  <select value={activeNote.notebook_id || ''} onChange={(e) => updateNote(activeNote.id, { notebook_id: e.target.value || null })} style={{ fontSize: '0.75rem', padding: '0.3rem 0.5rem', border: '1px solid var(--border)', borderRadius: '6px', background: 'var(--bg-soft)', color: 'var(--text)', fontFamily: 'inherit' }}>
                    <option value="">Unfiled</option>
                    {notebooks.map(nb => <option key={nb.id} value={nb.id}>{nb.icon} {nb.name}</option>)}
                  </select>
                  <input type="color" value={activeNote.color || '#8A8A8A'} onChange={(e) => updateNote(activeNote.id, { color: e.target.value })} style={{ width: '32px', height: '32px', padding: 0, border: 'none', cursor: 'pointer', borderRadius: '6px' }} title="Note color" />
                  <button className="toolbar-btn" style={{ color: 'var(--c-coral)' }} onClick={() => { if (window.confirm('Delete this note?')) deleteNote(activeNote.id); }} title="Delete">🗑</button>
                </div>
              </div>

              <input
                type="text"
                className="note-title-input"
                value={editTitle}
                onChange={(e) => handleTitleChange(e.target.value)}
                placeholder="Title..."
              />

              <div className="note-meta-row">
                {(activeNote.tags || []).map((tag, i) => (
                  <span key={i} className="tag-pill removable" onClick={() => removeTag(tag)}>#{tag}</span>
                ))}
                <input
                  type="text"
                  value={tagInput}
                  onChange={(e) => setTagInput(e.target.value)}
                  onKeyDown={addTag}
                  placeholder="+ tag"
                  style={{ border: '1px dashed var(--border)', background: 'transparent', borderRadius: '12px', padding: '0.25rem 0.6rem', fontSize: '0.7rem', fontFamily: 'inherit', color: 'var(--text-muted)' }}
                />
              </div>

              <div className="note-body-area">
                {previewMode ? (
                  <div className="note-preview" dangerouslySetInnerHTML={{ __html: renderMarkdown(editBody) }}></div>
                ) : (
                  <textarea
                    className="note-body-input"
                    value={editBody}
                    onChange={(e) => handleBodyChange(e.target.value)}
                    placeholder="Start writing... markdown supported (e.g., **bold**, *italic*, # heading, - list, > quote, `code`)"
                  />
                )}
              </div>
            </>
          )}
        </div>
      </div>
    </>
  );
};

const ImportMeetingsModal = ({ onClose, onImport }) => {
  const [text, setText] = useState('');
  const [parsed, setParsed] = useState([]);
  const [defaultDate, setDefaultDate] = useState(formatDateLocal(new Date()));
  const [step, setStep] = useState('paste');

  const parseMeetingText = (text, defaultDate) => {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const meetings = [];
    const timeRangePattern = /(\d{1,2}):?(\d{2})?\s*(AM|PM|am|pm)?\s*[-–—to]+\s*(\d{1,2}):?(\d{2})?\s*(AM|PM|am|pm)?/;
    const singleTimePattern = /(\d{1,2}):?(\d{2})?\s*(AM|PM|am|pm)/;
    const durationPattern = /\(([0-9.]+)\s*(hr|hrs|hour|hours|min|mins|minutes)\)/i;
    let currentDate = defaultDate;

    for (const line of lines) {
      if (line.length < 4) continue;
      // Date line attempt
      if (!line.match(singleTimePattern)) {
        try {
          const parsed = new Date(line + (line.match(/\d{4}/) ? '' : ` ${new Date().getFullYear()}`));
          if (!isNaN(parsed.getTime())) {
            currentDate = formatDateLocal(parsed);
            continue;
          }
        } catch (e) {}
      }
      const rangeMatch = line.match(timeRangePattern);
      let startTime = null;
      let duration = 60;
      if (rangeMatch) {
        const [, h1, m1, ap1, h2, m2, ap2] = rangeMatch;
        let s24 = parseInt(h1);
        if ((ap1 || ap2 || '').toLowerCase() === 'pm' && s24 < 12) s24 += 12;
        if ((ap1 || ap2 || '').toLowerCase() === 'am' && s24 === 12) s24 = 0;
        let e24 = parseInt(h2);
        if ((ap2 || ap1 || '').toLowerCase() === 'pm' && e24 < 12) e24 += 12;
        if ((ap2 || ap1 || '').toLowerCase() === 'am' && e24 === 12) e24 = 0;
        startTime = `${String(s24).padStart(2, '0')}:${String(parseInt(m1 || '0')).padStart(2, '0')}`;
        duration = (e24 * 60 + parseInt(m2 || '0')) - (s24 * 60 + parseInt(m1 || '0'));
        if (duration <= 0) duration = 60;
      } else {
        const sm = line.match(singleTimePattern);
        if (sm) {
          let h24 = parseInt(sm[1]);
          if (sm[3].toLowerCase() === 'pm' && h24 < 12) h24 += 12;
          if (sm[3].toLowerCase() === 'am' && h24 === 12) h24 = 0;
          startTime = `${String(h24).padStart(2, '0')}:${String(parseInt(sm[2] || '0')).padStart(2, '0')}`;
          const dm = line.match(durationPattern);
          if (dm) duration = dm[2].toLowerCase().startsWith('h') ? parseFloat(dm[1]) * 60 : parseFloat(dm[1]);
        }
      }
      if (!startTime) continue;
      let title = line.replace(timeRangePattern, '').replace(singleTimePattern, '').replace(durationPattern, '').replace(/^[\s\-–—:|]+|[\s\-–—:|]+$/g, '').trim();
      if (title.length < 2) continue;
      meetings.push({ date: currentDate, title, start_time: startTime, duration: Math.round(duration), job: '#5DCFA0', icon: '📅' });
    }
    return meetings;
  };

  const handleParse = () => {
    const result = parseMeetingText(text, defaultDate);
    if (result.length === 0) { alert("No meetings found. Make sure each has a time."); return; }
    setParsed(result);
    setStep('review');
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '600px' }}>
        <div className="modal-handle"></div>
        <h2>📋 Import Meetings</h2>
        {step === 'paste' && (
          <>
            <p style={{ color: 'var(--text-soft)', fontSize: '0.85rem', marginBottom: '1rem' }}>Paste calendar text. Times like "9:00 AM - 10:00 AM" detected automatically.</p>
            <div className="form-group">
              <label>Default date</label>
              <input type="date" value={defaultDate} onChange={(e) => setDefaultDate(e.target.value)} />
            </div>
            <div className="form-group">
              <label>Calendar text</label>
              <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="9:00 AM - 10:00 AM Standup&#10;2:00 PM (30 min) Quick sync" style={{ minHeight: '180px', fontFamily: 'ui-monospace, monospace', fontSize: '0.8rem' }} />
            </div>
            <div className="modal-actions">
              <button className="btn btn-soft" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary" onClick={handleParse} disabled={!text.trim()}>Parse</button>
            </div>
          </>
        )}
        {step === 'review' && (
          <>
            <p style={{ color: 'var(--text-soft)', fontSize: '0.85rem', marginBottom: '1rem' }}>Found <strong>{parsed.length}</strong>. Review and import:</p>
            <div style={{ maxHeight: '350px', overflowY: 'auto', marginBottom: '1rem', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
              {parsed.map((m, idx) => (
                <div key={idx} style={{ background: 'var(--bg-soft)', border: '1px solid var(--border)', borderRadius: '12px', padding: '0.75rem' }}>
                  <input type="text" value={m.title} onChange={(e) => { const u = [...parsed]; u[idx].title = e.target.value; setParsed(u); }} style={{ width: '100%', padding: '0.4rem', border: '1px solid var(--border)', borderRadius: '6px', fontSize: '0.85rem', background: 'var(--bg-card)', color: 'var(--text)', fontFamily: 'inherit', marginBottom: '0.4rem' }} />
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.3rem' }}>
                    <input type="date" value={m.date} onChange={(e) => { const u = [...parsed]; u[idx].date = e.target.value; setParsed(u); }} style={{ padding: '0.3rem', border: '1px solid var(--border)', borderRadius: '6px', fontSize: '0.7rem', background: 'var(--bg-card)', color: 'var(--text)', fontFamily: 'inherit' }} />
                    <input type="time" value={m.start_time} onChange={(e) => { const u = [...parsed]; u[idx].start_time = e.target.value; setParsed(u); }} style={{ padding: '0.3rem', border: '1px solid var(--border)', borderRadius: '6px', fontSize: '0.7rem', background: 'var(--bg-card)', color: 'var(--text)', fontFamily: 'inherit' }} />
                    <input type="number" value={m.duration} step="15" onChange={(e) => { const u = [...parsed]; u[idx].duration = parseInt(e.target.value) || 60; setParsed(u); }} style={{ padding: '0.3rem', border: '1px solid var(--border)', borderRadius: '6px', fontSize: '0.7rem', background: 'var(--bg-card)', color: 'var(--text)', fontFamily: 'inherit' }} />
                  </div>
                </div>
              ))}
            </div>
            <div className="modal-actions spread">
              <button className="btn btn-soft" onClick={() => setStep('paste')}>← Back</button>
              <button className="btn btn-primary" onClick={() => onImport(parsed)}>Import {parsed.length}</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
};
