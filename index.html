<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<title>Command Center</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#FAFAF8"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Command Center"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23FAFAF8' width='32' height='32' rx='8'/><circle cx='16' cy='16' r='6' fill='%23DC4C3E'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --bg: #FAFAF8;
  --bg-card: #FFFFFF;
  --bg-soft: #F5F4F0;
  --bg-sidebar: #FCFAF5;
  --border: #E5E2DB;
  --border-soft: #EDEAE3;
  --text: #202020;
  --text-soft: #4A4744;
  --text-muted: #888581;
  --accent: #DC4C3E;
  --accent-soft: #FFF0EE;
  --link: #1A73E8;

  /* Priority colors (Todoist-style) */
  --p1: #D1453B;
  --p2: #EB8909;
  --p3: #246FE0;
  --p4: #808080;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --sidebar-w: 280px;
  --header-h: 48px;
}

[data-theme="dark"] {
  --bg: #1F1E1B;
  --bg-card: #282725;
  --bg-soft: #232220;
  --bg-sidebar: #1C1B19;
  --border: #3A3833;
  --border-soft: #2E2D2A;
  --text: #EDEAE3;
  --text-soft: #C0BDB6;
  --text-muted: #807D78;
  --accent-soft: rgba(220, 76, 62, 0.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  font-size: 14px;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(136, 133, 129, 0.25); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(136, 133, 129, 0.45); }

input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }

button { font-family: inherit; }

/* ===================== APP SHELL ===================== */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 64px; /* mobile bottom tab bar */
}

@media (min-width: 900px) {
  .app-shell {
    flex-direction: row;
    padding-bottom: 0;
  }
}

/* ===================== SIDEBAR (Desktop) ===================== */
.sidebar {
  display: none;
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  height: 100vh;
  position: sticky;
  top: 0;
  flex-shrink: 0;
  overflow-y: auto;
  padding: 0.75rem 0;
}

@media (min-width: 900px) {
  .sidebar { display: flex; flex-direction: column; }
}

.sidebar-section { padding: 0.25rem 0.5rem; }
.sidebar-section + .sidebar-section { border-top: 1px solid var(--border-soft); margin-top: 0.5rem; padding-top: 0.75rem; }

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.75rem;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.sidebar-header-actions { margin-left: auto; display: flex; gap: 0.25rem; }

.sidebar-header-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0.15rem 0.3rem;
  border-radius: 4px;
  font-size: 0.95rem;
  line-height: 1;
}

.sidebar-header-btn:hover { background: var(--bg-soft); color: var(--text); }

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.45rem 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-soft);
  font-size: 0.875rem;
  font-weight: 500;
  transition: background 0.1s;
  margin-bottom: 1px;
  user-select: none;
}

.sidebar-item:hover { background: var(--bg-soft); }
.sidebar-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar-item.active .sidebar-icon { color: var(--accent); }

.sidebar-icon { width: 20px; text-align: center; font-size: 0.95rem; flex-shrink: 0; }
.sidebar-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-count { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.project-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.sidebar-add-task {
  margin: 0 0.5rem 0.5rem;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 0.55rem 0.75rem;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: background 0.15s;
}

.sidebar-add-task:hover { background: #C13F33; }

.sidebar-search {
  margin: 0 0.5rem 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.75rem;
  background: var(--bg-soft);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 0.875rem;
}

.sidebar-search:hover { background: var(--border-soft); }

.workspace-toggle {
  margin: 0 0.5rem;
  padding: 0.5rem 0.75rem;
  background: var(--bg-soft);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.78rem;
  cursor: pointer;
  user-select: none;
}

.workspace-toggle:hover { background: var(--border-soft); }
.workspace-toggle .ws-label { color: var(--text-soft); font-weight: 500; }
.workspace-toggle .ws-mode { font-weight: 600; color: var(--text); }
.workspace-toggle.hidden-mode .ws-mode { color: var(--accent); }

/* ===================== MAIN CONTENT ===================== */
.main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

@media (min-width: 900px) {
  .main-area { min-height: 100vh; max-height: 100vh; overflow: hidden; }
}

.main-header {
  height: var(--header-h);
  padding: 0 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  border-bottom: 1px solid var(--border-soft);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 50;
  flex-shrink: 0;
}

@media (min-width: 900px) { .main-header { padding: 0 1.25rem; } }

.main-header-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text);
  letter-spacing: -0.01em;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.main-header-actions { display: flex; gap: 0.25rem; align-items: center; }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  color: var(--text-soft);
  transition: background 0.1s;
}

.icon-btn:hover { background: var(--bg-soft); color: var(--text); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent); }

.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
}

@media (min-width: 900px) {
  .main-content { padding: 1.5rem 2rem; }
}

/* ===================== BOTTOM TABS (Mobile) ===================== */
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding: 0 0.25rem;
}

@media (min-width: 900px) { .bottom-tabs { display: none; } }

.bottom-tab {
  flex: 1;
  background: transparent;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0.4rem 0.25rem;
  position: relative;
  font-size: 0.65rem;
  font-weight: 600;
}

.bottom-tab .tab-icon { font-size: 1.2rem; line-height: 1; }
.bottom-tab.active { color: var(--accent); }
.bottom-tab.has-badge::after {
  content: attr(data-count);
  position: absolute;
  top: 6px;
  right: calc(50% - 16px);
  background: var(--accent);
  color: white;
  font-size: 0.6rem;
  padding: 0 4px;
  height: 14px;
  min-width: 14px;
  border-radius: 7px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===================== BUTTONS ===================== */
.btn {
  padding: 0.5rem 0.85rem;
  border: none;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.825rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #C13F33; }
.btn-soft { background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }
.btn-soft:hover { background: var(--border-soft); }
.btn-ghost { background: transparent; color: var(--text-muted); padding: 0.3rem 0.5rem; }
.btn-ghost:hover { color: var(--text); }
.btn-danger { background: var(--accent); color: white; }
.btn-danger:hover { background: #B83A2C; }

/* ===================== PAGE TITLE ===================== */
.page-header {
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  flex-wrap: wrap;
}

.page-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--text);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

@media (min-width: 900px) { .page-title { font-size: 1.75rem; } }

.page-subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.2rem; }

/* ===================== HOME ===================== */
.home-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
}

@media (min-width: 700px) { .home-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .home-grid { grid-template-columns: 1fr 1fr 1fr; } }

.home-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  min-height: 200px;
}

.home-card.scratch {
  background: linear-gradient(160deg, #FFF8DC, #FFFAEC);
  border-color: #F0E2A2;
}

[data-theme="dark"] .home-card.scratch {
  background: linear-gradient(160deg, #2C2820, #25221E);
  border-color: #4A4226;
}

.home-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.home-card-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.home-card-link {
  font-size: 0.75rem;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.home-card-link:hover { color: var(--accent); }

.home-card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.home-list-item {
  padding: 0.5rem 0.75rem;
  background: var(--bg-soft);
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.825rem;
  cursor: pointer;
  border-left: 3px solid var(--border);
}

.home-list-item:hover { background: var(--border-soft); }
.home-list-item .item-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-list-item .item-meta { font-size: 0.7rem; color: var(--text-muted); }

.home-empty {
  color: var(--text-muted);
  font-size: 0.825rem;
  font-style: italic;
  text-align: center;
  padding: 1.25rem 0;
}

.scratch-textarea {
  flex: 1;
  border: none;
  background: transparent;
  resize: none;
  font-family: inherit;
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--text);
  min-height: 130px;
}
.scratch-textarea:focus { outline: none; }

.scratch-status { font-size: 0.7rem; color: var(--text-muted); }

.pinned-card {
  background: var(--bg-soft);
  padding: 0.85rem;
  border-radius: 10px;
  cursor: pointer;
  flex: 1;
  border-left: 3px solid var(--accent);
}
.pinned-card:hover { background: var(--border-soft); }
.pinned-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 0.3rem;
}
.pinned-preview {
  font-size: 0.78rem;
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ===================== TASK ROW (Todoist-style) ===================== */
.task-row {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  padding: 0.55rem 0.5rem;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  transition: background 0.1s;
}

.task-row:hover { background: var(--bg-soft); }

.task-checkbox {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--text-muted);
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  transition: all 0.15s;
  position: relative;
}

.task-checkbox.p1 { border-color: var(--p1); background: rgba(209, 69, 59, 0.1); }
.task-checkbox.p2 { border-color: var(--p2); background: rgba(235, 137, 9, 0.1); }
.task-checkbox.p3 { border-color: var(--p3); background: rgba(36, 111, 224, 0.1); }
.task-checkbox.p4 { border-color: var(--text-muted); }

.task-checkbox:hover {
  background: var(--accent-soft);
}

.task-checkbox.completed {
  background: var(--text-muted);
  border-color: var(--text-muted);
  color: white;
}

.task-checkbox.completed::after {
  content: '✓';
  font-size: 0.7rem;
  font-weight: 700;
  color: white;
}

.task-main { flex: 1; min-width: 0; }

.task-title {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text);
  word-break: break-word;
  line-height: 1.4;
}

.task-row.completed .task-title { text-decoration: line-through; color: var(--text-muted); }

.task-desc {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.3rem;
  align-items: center;
}

.task-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 0.7rem;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
  color: var(--text-muted);
}

.task-pill.due { color: var(--text-muted); }
.task-pill.due.overdue { color: var(--p1); font-weight: 600; }
.task-pill.due.today { color: #058527; font-weight: 600; }
.task-pill.due.tomorrow { color: var(--p2); font-weight: 600; }

.task-pill.project {
  color: var(--text-muted);
}
.task-pill.project .project-dot { width: 8px; height: 8px; }

.task-pill.label {
  background: var(--bg-soft);
  border: 1px solid var(--border);
}

.task-row-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
}

.task-row:hover .task-row-actions { opacity: 1; }

.task-action {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  font-size: 0.85rem;
}

.task-action:hover { background: var(--border-soft); color: var(--text); }

/* Quick add task inline */
.quick-add-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem;
  border: 1px dashed var(--border);
  border-radius: 6px;
  margin-top: 0.5rem;
  cursor: text;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.quick-add-row:hover { border-color: var(--accent); color: var(--accent); }

.quick-add-row.editing {
  border-style: solid;
  border-color: var(--accent);
  cursor: default;
  color: var(--text);
}

.quick-add-input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.875rem;
  color: var(--text);
  padding: 0.2rem 0;
}

.quick-add-input:focus { outline: none; }

.quick-add-hint {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 0.4rem;
  padding-left: 0.5rem;
}

/* ===================== SECTION (Project list view) ===================== */
.section-block {
  margin-bottom: 1.5rem;
}

.section-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.25rem;
  cursor: pointer;
  user-select: none;
}

.section-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text);
}

.section-count {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 600;
}

.section-actions {
  margin-left: auto;
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
}

.section-head:hover .section-actions { opacity: 1; }

.section-collapse-icon {
  color: var(--text-muted);
  transition: transform 0.15s;
  font-size: 0.75rem;
}

.section-block.collapsed .section-collapse-icon { transform: rotate(-90deg); }
.section-block.collapsed .section-tasks { display: none; }

/* ===================== KANBAN BOARD ===================== */
.board-wrapper {
  overflow-x: auto;
  margin: 0 -1rem;
  padding: 0 1rem 1rem;
}

@media (min-width: 900px) { .board-wrapper { margin: 0 -2rem; padding: 0 2rem 1rem; } }

.board {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  min-width: max-content;
  padding-bottom: 0.5rem;
}

.board-column {
  background: var(--bg-soft);
  border-radius: 10px;
  padding: 0.5rem;
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 200px);
}

.board-col-head {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.5rem;
  margin-bottom: 0.4rem;
}

.board-col-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
}

.board-col-count {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 600;
}

.board-col-actions {
  margin-left: auto;
  display: flex;
  gap: 2px;
}

.board-col-tasks {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding-bottom: 0.5rem;
  min-height: 30px;
}

.board-task {
  background: var(--bg-card);
  border-radius: 8px;
  padding: 0.6rem 0.75rem;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.15s;
}

.board-task:hover { box-shadow: var(--shadow); }
.board-task.completed { opacity: 0.55; }
.board-task.completed .board-task-title { text-decoration: line-through; }

.board-task-head {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  margin-bottom: 0.35rem;
}

.board-task-title {
  flex: 1;
  font-size: 0.825rem;
  font-weight: 500;
  line-height: 1.35;
  word-break: break-word;
}

.board-task-meta {
  display: flex;
  gap: 0.3rem;
  flex-wrap: wrap;
  align-items: center;
}

.board-add-task {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-muted);
  padding: 0.45rem;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
  text-align: left;
}

.board-add-task:hover { border-color: var(--accent); color: var(--accent); }

/* View toggle */
.view-toggle {
  display: inline-flex;
  background: var(--bg-soft);
  border-radius: 7px;
  padding: 2px;
  gap: 0;
}

.view-toggle button {
  background: transparent;
  border: none;
  padding: 0.35rem 0.7rem;
  border-radius: 5px;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
}

.view-toggle button.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow-sm); }

/* Tabs (Project home) */
.project-tabs {
  display: flex;
  gap: 0.25rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1rem;
  overflow-x: auto;
  scrollbar-width: none;
}

.project-tabs::-webkit-scrollbar { display: none; }

.project-tab {
  background: transparent;
  border: none;
  padding: 0.6rem 0.85rem;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: all 0.1s;
}

.project-tab:hover { color: var(--text); }
.project-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ===================== INBOX ===================== */
.brain-dump {
  background: linear-gradient(160deg, #FFF8DC, #FFFAEC);
  border: 2px dashed #E0C56F;
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1rem;
}

[data-theme="dark"] .brain-dump {
  background: linear-gradient(160deg, #2C2820, #25221E);
  border-color: #6B5230;
}

.brain-dump-label {
  font-weight: 700;
  font-size: 0.825rem;
  color: #8B6F2A;
  margin-bottom: 0.4rem;
}

[data-theme="dark"] .brain-dump-label { color: #D4B25A; }

.brain-dump textarea {
  width: 100%;
  min-height: 80px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.9rem;
  resize: vertical;
  color: var(--text);
}

.brain-dump textarea:focus { outline: none; }
.brain-dump textarea::placeholder { color: #B58105; }

.brain-dump-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.inbox-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  margin-bottom: 0.4rem;
  cursor: pointer;
  transition: all 0.1s;
}

.inbox-card:hover { border-color: var(--text-muted); }
.inbox-card.expanded { border-color: var(--accent); box-shadow: var(--shadow); }

.inbox-card-row { display: flex; gap: 0.6rem; align-items: flex-start; }

.inbox-bullet {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--text-muted);
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
  background: transparent;
}

.inbox-bullet:hover { background: var(--accent-soft); border-color: var(--accent); }

.inbox-text { flex: 1; font-size: 0.875rem; line-height: 1.4; color: var(--text); word-break: break-word; }

.inbox-pills { display: flex; gap: 0.3rem; margin-top: 0.4rem; flex-wrap: wrap; align-items: center; }

.inbox-expand {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.detail-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 0.5rem;
  align-items: center;
}

.detail-row label {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.detail-row input,
.detail-row select,
.detail-row textarea {
  padding: 0.4rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.825rem;
  font-family: inherit;
  background: var(--bg-soft);
  color: var(--text);
  width: 100%;
}

.detail-row textarea { min-height: 50px; resize: vertical; }
.detail-row input:focus, .detail-row select:focus, .detail-row textarea:focus { outline: none; border-color: var(--accent); background: var(--bg-card); }

.expand-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }

/* ===================== FILTER CHIPS ===================== */
.chip-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.85rem;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 0.25rem;
}

.chip-row::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 0.4rem 0.75rem;
  border-radius: 16px;
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--bg-card);
  border: 1px solid var(--border);
  cursor: pointer;
  color: var(--text-soft);
  white-space: nowrap;
}

.chip:hover { border-color: var(--text-muted); }
.chip.active { background: var(--text); color: white; border-color: var(--text); }

.sort-select {
  margin-left: auto;
  padding: 0.4rem 0.7rem;
  border-radius: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 0.75rem;
  color: var(--text-soft);
  font-family: inherit;
  cursor: pointer;
}

/* ===================== CALENDAR (Google-style) ===================== */
.gcal-container {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 500px;
}

.gcal-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 0.85rem;
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.gcal-today-btn {
  padding: 0.35rem 0.75rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  color: var(--text);
}

.gcal-today-btn:hover { background: var(--bg-soft); }

.gcal-arrow {
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 50%;
  color: var(--text-soft);
  font-size: 1rem;
}

.gcal-arrow:hover { background: var(--bg-soft); }

.gcal-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 400;
  font-size: 1.1rem;
  margin-left: 0.25rem;
  display: flex;
  align-items: baseline;
  gap: 0.4rem;
}

.gcal-week-pill {
  font-size: 0.68rem;
  background: var(--bg-soft);
  padding: 1px 7px;
  border-radius: 8px;
  color: var(--text-muted);
  font-weight: 500;
}

.gcal-view-select {
  margin-left: auto;
  padding: 0.4rem 0.7rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-family: inherit;
  font-size: 0.78rem;
  color: var(--text);
  cursor: pointer;
}

.gcal-day-headers {
  display: grid;
  grid-template-columns: 48px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.gcal-day-headers.day-view-only { grid-template-columns: 48px 1fr; }

.gcal-tz-cell {
  padding: 0.5rem 0.25rem;
  font-size: 0.6rem;
  color: var(--text-muted);
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border-soft);
}

.gcal-day-head {
  text-align: center;
  cursor: pointer;
  border-right: 1px solid var(--border-soft);
  padding: 0.5rem 0.4rem 0.6rem;
  user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.gcal-day-head:last-child { border-right: none; }
.gcal-day-head:hover { background: var(--bg-soft); }
.gcal-day-head:active { background: var(--accent-soft); }

.gcal-dow {
  font-size: 0.65rem;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.gcal-day-head.today .gcal-dow { color: var(--link); font-weight: 600; }

.gcal-day-num {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--text);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.gcal-day-num.today {
  background: var(--link);
  color: white;
}

.gcal-allday-row {
  display: grid;
  grid-template-columns: 48px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  min-height: 28px;
  flex-shrink: 0;
}

.gcal-allday-row.day-view-only { grid-template-columns: 48px 1fr; }

.gcal-allday-cell {
  border-right: 1px solid var(--border-soft);
  padding: 2px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
  min-width: 0;
}

.gcal-allday-cell:last-child { border-right: none; }

.gcal-allday-event {
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  cursor: pointer;
  max-width: 100%;
}

.gcal-time-grid-wrapper {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

.gcal-time-grid {
  display: grid;
  grid-template-columns: 48px repeat(7, 1fr);
  position: relative;
}

.gcal-time-grid.day-view-only { grid-template-columns: 48px 1fr; }

.gcal-time-col {
  border-right: 1px solid var(--border-soft);
  background: var(--bg-card);
  position: sticky;
  left: 0;
  z-index: 1;
}

.gcal-time-label {
  height: 44px;
  padding: 2px 6px 0 0;
  font-size: 0.65rem;
  color: var(--text-muted);
  text-align: right;
  border-bottom: 1px solid var(--border-soft);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.gcal-day-col {
  position: relative;
  border-right: 1px solid var(--border-soft);
  min-width: 0;
}

.gcal-day-col:last-child { border-right: none; }

.gcal-hour-cell {
  height: 44px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
}

.gcal-hour-cell:hover { background: var(--bg-soft); }
.gcal-hour-cell.drop-target { background: var(--accent-soft); }

.gcal-event {
  position: absolute;
  left: 2px;
  right: 2px;
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 0.7rem;
  cursor: pointer;
  overflow: hidden;
  z-index: 2;
  box-sizing: border-box;
}

.gcal-event:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.15); z-index: 3; }
.gcal-event.privacy-blur { filter: blur(4px); }
.gcal-event.task-block {
  border: 1.5px dashed currentColor;
}

.gcal-event-title {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.gcal-event-time { font-size: 0.62rem; opacity: 0.85; margin-top: 1px; }

.gcal-now-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background: #EA4335;
  z-index: 4;
  pointer-events: none;
}

.gcal-now-line::before {
  content: '';
  position: absolute;
  left: -4px;
  top: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #EA4335;
}

/* Month */
.gcal-month-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.gcal-month-dow {
  text-align: center;
  font-size: 0.65rem;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 0.5rem 0;
  border-right: 1px solid var(--border-soft);
}

.gcal-month-dow:last-child { border-right: none; }

.gcal-month-body { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

.gcal-month-week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border-soft);
  flex: 1;
  min-height: 80px;
}

.gcal-month-week:last-child { border-bottom: none; }

.gcal-month-cell {
  border-right: 1px solid var(--border-soft);
  padding: 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
  min-width: 0;
}

.gcal-month-cell:last-child { border-right: none; }
.gcal-month-cell:hover { background: var(--bg-soft); }
.gcal-month-cell.other-month .gcal-month-num { color: var(--text-muted); }

.gcal-month-num {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text);
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  margin-bottom: 1px;
}

.gcal-month-num.today { background: var(--link); color: white; }

.gcal-month-events { display: flex; flex-direction: column; gap: 1px; overflow: hidden; min-width: 0; }

.gcal-month-event {
  font-size: 0.65rem;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  cursor: pointer;
  line-height: 1.4;
  max-width: 100%;
}

.gcal-month-more { font-size: 0.6rem; color: var(--text-muted); padding: 1px 5px; font-weight: 600; }

/* ===================== NOTES ===================== */
.notes-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.85rem;
  height: 100%;
}

@media (min-width: 900px) {
  .notes-layout { grid-template-columns: 280px 1fr; }
}

.notes-sidebar-pane {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
}

.notes-search {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-soft);
  color: var(--text);
  font-family: inherit;
  font-size: 0.85rem;
}

.notes-search:focus { outline: none; border-color: var(--accent); background: var(--bg-card); }

.note-list-item {
  background: var(--bg-soft);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 0.55rem 0.7rem;
  cursor: pointer;
  border-left: 3px solid;
}

.note-list-item:hover { background: var(--border-soft); }
.note-list-item.active { background: var(--bg-card); border-color: var(--accent); }

.note-list-title {
  font-weight: 600;
  font-size: 0.825rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 1px;
}

.note-list-preview {
  font-size: 0.7rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.notes-editor {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  min-height: 400px;
}

.notes-toolbar {
  display: flex;
  gap: 0.25rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.85rem;
  flex-wrap: wrap;
  align-items: center;
}

.toolbar-btn {
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.78rem;
  color: var(--text-soft);
  font-family: inherit;
  font-weight: 700;
}

.toolbar-btn:hover { background: var(--bg-soft); color: var(--text); }
.toolbar-btn.active { background: var(--accent-soft); color: var(--accent); }

.toolbar-divider { width: 1px; height: 18px; background: var(--border); margin: 0 0.25rem; }

.note-title-input {
  width: 100%;
  border: none;
  background: transparent;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--text);
  margin-bottom: 0.4rem;
  letter-spacing: -0.02em;
}

.note-title-input:focus { outline: none; }

.note-meta-row {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 0.85rem;
  flex-wrap: wrap;
  align-items: center;
}

.note-body-input {
  flex: 1;
  width: 100%;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.875rem;
  line-height: 1.6;
  color: var(--text);
  resize: none;
  min-height: 280px;
}

.note-body-input:focus { outline: none; }

.note-preview { flex: 1; font-size: 0.875rem; line-height: 1.65; }
.note-preview h1 { font-family: 'Plus Jakarta Sans'; font-size: 1.5rem; font-weight: 800; margin: 0.85rem 0 0.45rem; }
.note-preview h2 { font-family: 'Plus Jakarta Sans'; font-size: 1.2rem; font-weight: 700; margin: 0.7rem 0 0.4rem; }
.note-preview h3 { font-family: 'Plus Jakarta Sans'; font-size: 1.05rem; font-weight: 700; margin: 0.6rem 0 0.3rem; }
.note-preview p { margin-bottom: 0.6rem; }
.note-preview ul, .note-preview ol { margin: 0.4rem 0 0.6rem 1.4rem; }
.note-preview code { background: var(--bg-soft); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85rem; font-family: 'ui-monospace', monospace; }
.note-preview pre { background: var(--bg-soft); padding: 0.7rem 0.9rem; border-radius: 6px; overflow-x: auto; margin: 0.4rem 0; }
.note-preview pre code { background: transparent; padding: 0; }
.note-preview a { color: var(--link); }
.note-preview blockquote { border-left: 3px solid var(--border); padding-left: 0.85rem; color: var(--text-muted); margin: 0.4rem 0; }

.tag-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 600;
  background: var(--bg-soft);
  color: var(--text-soft);
  border: 1px solid var(--border);
  cursor: pointer;
}

.tag-pill.removable::after { content: '×'; opacity: 0.6; margin-left: 2px; }

/* ===================== MODALS ===================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
}

@media (min-width: 600px) { .modal-overlay { align-items: center; padding: 1rem; } }

.modal {
  background: var(--bg-card);
  border-radius: 16px 16px 0 0;
  padding: 1.25rem 1rem 1.5rem;
  max-width: 480px;
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

@media (min-width: 600px) { .modal { border-radius: 16px; } }

.modal-handle {
  width: 32px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 1rem;
}

.modal h2 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 1.1rem;
  letter-spacing: -0.01em;
}

.form-group { margin-bottom: 0.95rem; }

.form-group label {
  display: block;
  font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 0.4rem;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.9rem;
  background: var(--bg-soft);
  color: var(--text);
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--accent);

// Recurrence
const DAYS_OF_WEEK = ['SU','MO','TU','WE','TH','FR','SA'];
const DAY_LABELS = { SU:'Sun', MO:'Mon', TU:'Tue', WE:'Wed', TH:'Thu', FR:'Fri', SA:'Sat' };
const DAY_SHORT = { SU:'S', MO:'M', TU:'T', WE:'W', TH:'T', FR:'F', SA:'S' };

const parseRecurrence = (rec) => {
  if (!rec || rec === 'none') return null;
  if (typeof rec === 'string' && rec.startsWith('{')) {
    try { return JSON.parse(rec); } catch (e) { return null; }
  }
  if (typeof rec === 'string') {
    switch (rec) {
      case 'daily': return { freq: 'daily', interval: 1 };
      case 'weekdays': return { freq: 'weekly', interval: 1, byDay: ['MO','TU','WE','TH','FR'] };
      case 'weekly': return { freq: 'weekly', interval: 1 };
      case 'biweekly': return { freq: 'weekly', interval: 2 };
      case 'monthly': return { freq: 'monthly', interval: 1 };
      default: return null;
    }
  }
  return rec;
};

const meetingOccursOn = (meeting, dateStr) => {
  const rec = parseRecurrence(meeting.recurrence);
  if (!rec) return meeting.date === dateStr;
  const startD = new Date(meeting.date + 'T00:00:00');
  const checkD = new Date(dateStr + 'T00:00:00');
  if (checkD < startD) return false;
  const untilStr = rec.until || meeting.recurrence_end;
  if (untilStr) {
    const endD = new Date(untilStr + 'T00:00:00');
    if (checkD > endD) return false;
  }
  const interval = rec.interval || 1;
  const dayDiff = Math.floor((checkD - startD) / 86400000);
  if (rec.freq === 'daily') return dayDiff % interval === 0;
  if (rec.freq === 'weekly') {
    const weeksSince = Math.floor(dayDiff / 7);
    if (weeksSince % interval !== 0) return false;
    if (rec.byDay && rec.byDay.length > 0) return rec.byDay.includes(DAYS_OF_WEEK[checkD.getDay()]);
    return checkD.getDay() === startD.getDay();
  }
  if (rec.freq === 'monthly') {
    const monthsSince = (checkD.getFullYear() - startD.getFullYear()) * 12 + (checkD.getMonth() - startD.getMonth());
    if (monthsSince < 0 || monthsSince % interval !== 0) return false;
    if (rec.byDayOrdinal && rec.byDayOfWeek) {
      if (DAYS_OF_WEEK[checkD.getDay()] !== rec.byDayOfWeek) return false;
      const weekOfMonth = Math.ceil(checkD.getDate() / 7);
      if (rec.byDayOrdinal === -1) {
        const next = new Date(checkD); next.setDate(next.getDate() + 7);
        return next.getMonth() !== checkD.getMonth();
      }
      return weekOfMonth === rec.byDayOrdinal;
    }
    if (rec.byMonthDay) return checkD.getDate() === rec.byMonthDay;
    return checkD.getDate() === startD.getDate();
  }
  if (rec.freq === 'yearly') {
    if (checkD.getMonth() !== startD.getMonth()) return false;
    if (checkD.getDate() !== startD.getDate()) return false;
    return (checkD.getFullYear() - startD.getFullYear()) % interval === 0;
  }
  return false;
};

// Lay out events that may overlap into columns
const layoutEvents = (events) => {
  if (!events.length) return [];
  const sorted = [...events].sort((a,b) => a.startMin - b.startMin || b.endMin - a.endMin);
  const cols = []; // each col is an array of events
  for (const ev of sorted) {
    let placed = false;
    for (let i = 0; i < cols.length; i++) {
      const col = cols[i];
      const lastInCol = col[col.length - 1];
      if (lastInCol.endMin <= ev.startMin) {
        col.push(ev);
        ev._col = i;
        placed = true;
        break;
      }
    }
    if (!placed) {
      ev._col = cols.length;
      cols.push([ev]);
    }
  }
  // For each event, count how many columns have an overlapping event
  for (const ev of sorted) {
    let total = 0;
    for (const col of cols) {
      if (col.some(other => other.startMin < ev.endMin && other.endMin > ev.startMin)) {
        total++;
      }
    }
    ev._totalCols = total;
  }
  return sorted;
};

// Markdown
const renderMarkdown = (text) => {
  if (!text) return '';
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
  const lines = html.split('\n');
  let inUl = false, inOl = false;
  const out = [];
  for (const line of lines) {
    if (/^\s*[-*+] (.+)/.test(line)) {
      if (!inUl) { out.push('<ul>'); inUl = true; }
      if (inOl) { out.push('</ol>'); inOl = false; }
      out.push('<li>' + line.replace(/^\s*[-*+] /, '') + '</li>');
    } else if (/^\s*\d+\. (.+)/.test(line)) {
      if (!inOl) { out.push('<ol>'); inOl = true; }
      if (inUl) { out.push('</ul>'); inUl = false; }
      out.push('<li>' + line.replace(/^\s*\d+\. /, '') + '</li>');
    } else {
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (inOl) { out.push('</ol>'); inOl = false; }
      out.push(line);
    }
  }
  if (inUl) out.push('</ul>');
  if (inOl) out.push('</ol>');
  html = out.join('\n');
  html = html.split(/\n\n+/).map(b => {
    const t = b.trim();
    if (!t) return '';
    if (/^<(h[1-6]|ul|ol|pre|blockquote)/.test(t)) return t;
    return '<p>' + t.replace(/\n/g, '<br/>') + '</p>';
  }).join('\n');
  return html;
};

// Format date for display
const dueDateLabel = (dateStr) => {
  if (!dateStr) return null;
  const today = formatDateLocal(new Date());
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = formatDateLocal(tomorrow);
  if (dateStr === today) return { label: 'Today', cls: 'today' };
  if (dateStr === tomorrowStr) return { label: 'Tomorrow', cls: 'tomorrow' };
  if (dateStr < today) {
    const d = new Date(dateStr + 'T00:00:00');
    return { label: d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }), cls: 'overdue' };
  }
  const d = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.floor((d - new Date(today + 'T00:00:00')) / 86400000);
  if (diffDays < 7) return { label: d.toLocaleDateString('en-US', { weekday: 'long' }), cls: 'future' };
  return { label: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), cls: 'future' };
};

  const visibleTasks = tasks.filter(t => !t.project_id || isProjectVisible(t.project_id));
  const visibleMeetings = meetings.filter(m => !m.project_id || isProjectVisible(m.project_id));
  const visibleNotes = notes.filter(n => !n.project_id || isProjectVisible(n.project_id));

  // ============ Projects ============
  const saveProject = async (p) => {
    if (p.id) {
      const { error } = await supabase.from('projects').update({
        name: p.name, color: p.color, icon: p.icon, workspace: p.workspace, is_favorite: p.is_favorite, is_archived: p.is_archived
      }).eq('id', p.id);
      if (error) { showToast('Save failed'); console.error(error); return; }
      showToast('Updated');
    } else {
      const { data, error } = await supabase.from('projects').insert([{
        name: p.name, color: p.color, icon: p.icon || '📋', workspace: p.workspace || 'personal',
        sort_order: projects.length
      }]).select();
      if (error) { showToast('Save failed'); console.error(error); return; }
      showToast('Project created');
      // Seed default sections for the new project
      if (data && data[0]) {
        const newPid = data[0].id;
        const seedSections = DEFAULT_SECTIONS.map((name, i) => ({ project_id: newPid, name, sort_order: i }));
        await supabase.from('sections').insert(seedSections);
      }
    }
    setProjectModal(null);
    await loadProjects();
    await loadSections();
  };

  const deleteProject = async (id) => {
    // Tasks/notes/meetings keep their project_id reference but they'll show as unfiled
    // Better: clear references first
    await supabase.from('command_tasks').update({ project_id: null, section_id: null }).eq('project_id', id);
    await supabase.from('cc_notes').update({ project_id: null }).eq('project_id', id);
    await supabase.from('command_meetings').update({ project_id: null }).eq('project_id', id);
    await supabase.from('sections').delete().eq('project_id', id);
    await supabase.from('projects').delete().eq('id', id);
    setProjectModal(null);
    if (activeProjectId === id) { setActiveProjectId(null); setView('home'); }
    showToast('Project deleted');
    loadAll();
  };

  // ============ Sections ============
  const saveSection = async (s) => {
    if (s.id) {
      await supabase.from('sections').update({ name: s.name, sort_order: s.sort_order }).eq('id', s.id);
    } else {
      await supabase.from('sections').insert([{ project_id: s.project_id, name: s.name, sort_order: s.sort_order ?? sections.filter(x => x.project_id === s.project_id).length }]);
    }
    loadSections();
  };

  const deleteSection = async (id) => {
    await supabase.from('command_tasks').update({ section_id: null }).eq('section_id', id);
    await supabase.from('sections').delete().eq('id', id);
    loadSections();
    loadTasks();
  };

  // ============ Tasks ============
  const saveTask = async (t) => {
    const baseData = {
      title: t.title,
      description: t.description || null,
      project_id: t.project_id || null,
      section_id: t.section_id || null,
      priority: t.priority || 4,
      date: t.date || null,
      due_time: t.due_time || null,
      duration: t.duration || null,
      completed: t.completed || false,
      sort_order: t.sort_order ?? 0
    };
    let savedId = t.id;
    if (t.id) {
      const { error } = await supabase.from('command_tasks').update(baseData).eq('id', t.id);
      if (error) { showToast('Save failed: ' + error.message); console.error(error); return; }
    } else {
      const { data, error } = await supabase.from('command_tasks').insert([baseData]).select();
      if (error) { showToast('Save failed: ' + error.message); console.error(error); return; }
      if (data && data[0]) savedId = data[0].id;
    }
    // Save labels
    if (savedId && t.label_ids !== undefined) {
      await supabase.from('task_labels').delete().eq('task_id', savedId);
      if (t.label_ids.length > 0) {
        await supabase.from('task_labels').insert(t.label_ids.map(lid => ({ task_id: savedId, label_id: lid })));
      }
    }
    showToast(t.id ? 'Updated' : 'Added');
    setTaskModal(null);
    loadTasks();
    loadTaskLabels();
    if (t._fromInbox) {
      await supabase.from('inbox_items').delete().eq('id', t._fromInbox);
      loadInbox();
    }
  };

  const toggleTask = async (t) => {
    await supabase.from('command_tasks').update({ completed: !t.completed }).eq('id', t.id);
    loadTasks();
  };

  const deleteTask = async (id) => {
    await supabase.from('task_labels').delete().eq('task_id', id);
    await supabase.from('command_tasks').delete().eq('id', id);
    setTaskModal(null);
    showToast('Deleted');
    loadTasks();
    loadTaskLabels();
  };

  // ============ Labels ============
  const saveLabel = async (l) => {
    if (l.id) {
      await supabase.from('labels').update({ name: l.name, color: l.color }).eq('id', l.id);
    } else {
      await supabase.from('labels').insert([{ name: l.name, color: l.color || '#888888' }]);
    }
    showToast(l.id ? 'Updated' : 'Added');
    setLabelModal(null);
    loadLabels();
  };

  const deleteLabel = async (id) => {
    await supabase.from('task_labels').delete().eq('label_id', id);
    await supabase.from('labels').delete().eq('id', id);
    setLabelModal(null);
    loadLabels();
    loadTaskLabels();
  };

  // ============ Meetings ============
  const saveMeeting = async (m) => {
    const data = {
      date: m.date || formatDateLocal(currentDate),
      title: m.title,
      start_time: m.start_time,
      duration: parseInt(m.duration),
      project_id: m.project_id || null,
      job: m.job || (m.project_id ? (projects.find(p => p.id === m.project_id)?.color || '#5DCFA0') : '#5DCFA0'),
      icon: m.icon || '📅',
      start_minutes: minutesFromTime(m.start_time),
      end_minutes: minutesFromTime(m.start_time) + parseInt(m.duration),
      recurrence: m.recurrence || 'none',
      recurrence_end: m.recurrence_end || null
    };
    if (m.id) await supabase.from('command_meetings').update(data).eq('id', m.id);
    else await supabase.from('command_meetings').insert([data]);
    showToast(m.id ? 'Updated' : 'Added');
    setMeetingModal(null);
    loadMeetings();
    if (m._fromInbox) {
      await supabase.from('inbox_items').delete().eq('id', m._fromInbox);
      loadInbox();
    }
  };

  const deleteMeeting = async (id) => {
    await supabase.from('command_meetings').delete().eq('id', id);
    setMeetingModal(null);
    showToast('Deleted');
    loadMeetings();
  };

  // ============ Inbox ============
  const addInboxItems = async () => {
    if (!brainDumpText.trim()) return;
    const items = brainDumpText.split('\n').filter(l => l.trim()).map(text => ({ text: text.trim() }));
    await supabase.from('inbox_items').insert(items);
    setBrainDumpText('');
    showToast(`Added ${items.length}`);
    loadInbox();
  };

  const updateInboxItem = async (id, updates) => {
    await supabase.from('inbox_items').update(updates).eq('id', id);
    loadInbox();
  };

  const convertInboxToTask = async (item) => {
    setTaskModal({
      title: item.text,
      project_id: null,
      priority: item.priority === 'high' ? 1 : item.priority === 'medium' ? 2 : item.priority === 'low' ? 3 : 4,
      date: item.due_date || null,
      _fromInbox: item.id
    });
  };

  const convertInboxToMeeting = (item) => {
    setMeetingModal({ title: item.text, start_time: '09:00', duration: 60, _fromInbox: item.id });
  };

  const deleteInboxItem = async (id) => {
    await supabase.from('inbox_items').delete().eq('id', id);
    showToast('Removed');
    loadInbox();
  };

  // ============ Notes ============
  const createNote = async (projectId = null) => {
    const { data } = await supabase.from('cc_notes').insert([{ title: 'Untitled', body: '', project_id: projectId, tags: [] }]).select();
    if (data && data[0]) {
      setActiveNoteId(data[0].id);
      setView('notes');
      loadNotes();
    }
  };

  const updateNote = async (id, updates) => {
    await supabase.from('cc_notes').update({ ...updates, updated_at: new Date().toISOString() }).eq('id', id);
    loadNotes();
  };

  const deleteNote = async (id) => {
    await supabase.from('cc_notes').delete().eq('id', id);
    if (activeNoteId === id) setActiveNoteId(null);
    if (pinnedNoteId === id) {
      await supabase.from('cc_app_state').upsert([{ id: 1, scratch_pad: scratchPad, pinned_note_id: null }]);
      setPinnedNoteId(null);
    }
    showToast('Deleted');
    loadNotes();
  };

  const togglePinnedNote = async (noteId) => {
    const newPinned = pinnedNoteId === noteId ? null : noteId;
    await supabase.from('cc_app_state').upsert([{ id: 1, scratch_pad: scratchPad, pinned_note_id: newPinned }]);
    setPinnedNoteId(newPinned);
    showToast(newPinned ? 'Pinned' : 'Unpinned');
  };

  // ============ Computed views ============
  const todayDateStr = formatDateLocal(currentDate);
  const todayTasks = visibleTasks.filter(t => t.date === todayDateStr);
  const todayMeetings = visibleMeetings.filter(m => meetingOccursOn(m, todayDateStr));

  const greetingTime = () => {
    const h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  };

  const getProjectById = (id) => projects.find(p => p.id === id);
  const getSectionById = (id) => sections.find(s => s.id === id);
  const getLabelById = (id) => labels.find(l => l.id === id);
  const getTaskLabels = (taskId) => taskLabels.filter(tl => tl.task_id === taskId).map(tl => getLabelById(tl.label_id)).filter(Boolean);

  const pinnedNote = visibleNotes.find(n => n.id === pinnedNoteId);
  const activeNote = visibleNotes.find(n => n.id === activeNoteId);
  const activeProject = projects.find(p => p.id === activeProjectId);

  if (loading) {
    return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>Loading…</div>;
  }

  // Workspace toggle cycler
  const cycleWorkspace = () => {
    const order = ['all', 'work_a', 'work_b', 'personal'];
    const idx = order.indexOf(workspaceMode);
    setWorkspaceMode(order[(idx + 1) % order.length]);
  };
  const workspaceLabel = {
    all: 'All',
    work_a: 'Hide Work AX',
    work_b: 'Hide Work BT',
    personal: 'Personal only'
  }[workspaceMode];

  return (
    <div className="app-shell">
      {/* === SIDEBAR (desktop) === */}
      <aside className="sidebar">
        <button className="sidebar-add-task" onClick={() => setTaskModal({})}>
          <span style={{ fontSize: '1.1rem', fontWeight: 700 }}>+</span>
          <span>Add task</span>
        </button>

        <div className="workspace-toggle" onClick={cycleWorkspace} title="Click to cycle workspace mode">
          <span className="ws-label">Workspace:</span>
          <span className={`ws-mode ${workspaceMode !== 'all' ? '' : ''}`} style={{ color: workspaceMode !== 'all' ? 'var(--accent)' : 'var(--text)' }}>{workspaceLabel}</span>
        </div>

        <div className="sidebar-section">
          <div className={`sidebar-item ${view === 'home' ? 'active' : ''}`} onClick={() => { setView('home'); setActiveProjectId(null); }}>
            <span className="sidebar-icon">🏠</span>
            <span className="sidebar-label">Home</span>
          </div>
          <div className={`sidebar-item ${view === 'inbox' ? 'active' : ''}`} onClick={() => { setView('inbox'); setActiveProjectId(null); }}>
            <span className="sidebar-icon">📥</span>
            <span className="sidebar-label">Inbox</span>
            {inboxItems.length > 0 && <span className="sidebar-count">{inboxItems.length}</span>}
          </div>
          <div className={`sidebar-item ${view === 'today' ? 'active' : ''}`} onClick={() => { setView('today'); setActiveProjectId(null); }}>
            <span className="sidebar-icon">📅</span>
            <span className="sidebar-label">Today</span>
            {todayTasks.filter(t => !t.completed).length > 0 && <span className="sidebar-count">{todayTasks.filter(t => !t.completed).length}</span>}
          </div>
          <div className={`sidebar-item ${view === 'calendar' ? 'active' : ''}`} onClick={() => { setView('calendar'); setActiveProjectId(null); }}>
            <span className="sidebar-icon">🗓️</span>
            <span className="sidebar-label">Calendar</span>
          </div>
          <div className={`sidebar-item ${view === 'notes' ? 'active' : ''}`} onClick={() => { setView('notes'); setActiveProjectId(null); }}>
            <span className="sidebar-icon">📝</span>
            <span className="sidebar-label">Notes</span>
          </div>
          <div className={`sidebar-item ${view === 'filters' ? 'active' : ''}`} onClick={() => { setView('filters'); setActiveProjectId(null); }}>
            <span className="sidebar-icon">🔍</span>
            <span className="sidebar-label">Filters & Labels</span>
          </div>
        </div>

        {visibleProjects.filter(p => p.is_favorite).length > 0 && (
          <div className="sidebar-section">
            <div className="sidebar-header">⭐ Favorites</div>
            {visibleProjects.filter(p => p.is_favorite).map(p => {
              const count = visibleTasks.filter(t => t.project_id === p.id && !t.completed).length;
              return (
                <div key={p.id} className={`sidebar-item ${activeProjectId === p.id ? 'active' : ''}`} onClick={() => { setView('project'); setActiveProjectId(p.id); }}>
                  <div className="project-dot" style={{ background: p.color }}></div>
                  <span className="sidebar-label">{p.name}</span>
                  {count > 0 && <span className="sidebar-count">{count}</span>}
                </div>
              );
            })}
          </div>
        )}

        <div className="sidebar-section">
          <div className="sidebar-header">
            <span>My Projects</span>
            <div className="sidebar-header-actions">
              <button className="sidebar-header-btn" onClick={() => setProjectModal({})} title="New project">+</button>
            </div>
          </div>
          {visibleProjects.filter(p => !p.is_favorite).map(p => {
            const count = visibleTasks.filter(t => t.project_id === p.id && !t.completed).length;
            return (
              <div key={p.id} className={`sidebar-item ${activeProjectId === p.id ? 'active' : ''}`} onClick={() => { setView('project'); setActiveProjectId(p.id); }}>
                <div className="project-dot" style={{ background: p.color }}></div>
                <span className="sidebar-label">{p.name}</span>
                {count > 0 && <span className="sidebar-count">{count}</span>}
              </div>
            );
          })}
          {visibleProjects.length === 0 && (
            <div style={{ padding: '0.5rem 0.75rem', fontSize: '0.78rem', color: 'var(--text-muted)', fontStyle: 'italic' }}>
              No projects yet. Click + to create one.
            </div>
          )}
        </div>

        <div className="sidebar-section" style={{ marginTop: 'auto' }}>
          <div className={`sidebar-item ${showSettings ? 'active' : ''}`} onClick={() => setShowSettings(true)}>
            <span className="sidebar-icon">⚙️</span>
            <span className="sidebar-label">Settings</span>
          </div>
        </div>
      </aside>

      {/* === MAIN AREA === */}
      <main className="main-area">
        <header className="main-header">
          <div className="main-header-title">
            {view === 'home' && `${greetingTime()}, Jessa`}
            {view === 'inbox' && '📥 Inbox'}
            {view === 'today' && '📅 Today'}
            {view === 'calendar' && '🗓️ Calendar'}
            {view === 'notes' && '📝 Notes'}
            {view === 'filters' && '🔍 Filters & Labels'}
            {view === 'project' && activeProject && (
              <span style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <div className="project-color-large" style={{ background: activeProject.color }}></div>
                {activeProject.name}
              </span>
            )}
          </div>
          <div className="main-header-actions">
            <button className="icon-btn" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} title="Theme">{theme === 'light' ? '🌙' : '☀️'}</button>
            <button className={`icon-btn ${workspaceMode !== 'all' ? 'active' : ''}`} onClick={cycleWorkspace} title={`Workspace: ${workspaceLabel}`}>{workspaceMode === 'all' ? '👁️' : '🔒'}</button>
            <button className="icon-btn" onClick={() => setShowSettings(true)} title="Settings">⚙️</button>
          </div>
        </header>

        <div className="main-content">
          {view === 'home' && <HomeView projects={visibleProjects} todayTasks={todayTasks} todayMeetings={todayMeetings} inboxItems={inboxItems} pinnedNote={pinnedNote} scratchPad={scratchPad} scratchSaved={scratchSaved} updateScratch={(t) => { setScratchPad(t); setScratchSaved(false); }} setView={setView} setActiveProjectId={setActiveProjectId} setTaskModal={setTaskModal} setMeetingModal={setMeetingModal} toggleTask={toggleTask} setActiveNoteId={setActiveNoteId} createNote={createNote} notes={visibleNotes} getProjectById={getProjectById} />}
          {view === 'today' && <TodayView todayTasks={todayTasks} todayMeetings={todayMeetings} setTaskModal={setTaskModal} setMeetingModal={setMeetingModal} toggleTask={toggleTask} getProjectById={getProjectById} getTaskLabels={getTaskLabels} currentDate={currentDate} setCurrentDate={setCurrentDate} projects={visibleProjects} saveTask={saveTask} />}
          {view === 'inbox' && <InboxView inboxItems={inboxItems} brainDumpText={brainDumpText} setBrainDumpText={setBrainDumpText} addInboxItems={addInboxItems} inboxFilter={inboxFilter} setInboxFilter={setInboxFilter} inboxSort={inboxSort} setInboxSort={setInboxSort} expandedInboxId={expandedInboxId} setExpandedInboxId={setExpandedInboxId} updateInboxItem={updateInboxItem} convertInboxToTask={convertInboxToTask} convertInboxToMeeting={convertInboxToMeeting} deleteInboxItem={deleteInboxItem} projects={visibleProjects} />}
          {view === 'calendar' && <CalendarView calendarView={calendarView} setCalendarView={setCalendarView} currentDate={currentDate} setCurrentDate={setCurrentDate} meetings={visibleMeetings} tasks={visibleTasks} setMeetingModal={setMeetingModal} setTaskModal={setTaskModal} getProjectById={getProjectById} setView={setView} />}
          {view === 'notes' && <NotesView notes={visibleNotes} activeNote={activeNote} setActiveNoteId={setActiveNoteId} projects={visibleProjects} noteSearch={noteSearch} setNoteSearch={setNoteSearch} previewMode={previewMode} setPreviewMode={setPreviewMode} createNote={createNote} updateNote={updateNote} deleteNote={deleteNote} pinnedNoteId={pinnedNoteId} togglePinnedNote={togglePinnedNote} getProjectById={getProjectById} />}
          {view === 'filters' && <FiltersView labels={labels} tasks={visibleTasks} taskLabels={taskLabels} setLabelModal={setLabelModal} setView={setView} />}
          {view === 'project' && activeProject && <ProjectView project={activeProject} sections={sections.filter(s => s.project_id === activeProject.id)} tasks={visibleTasks.filter(t => t.project_id === activeProject.id)} notes={visibleNotes.filter(n => n.project_id === activeProject.id)} meetings={visibleMeetings.filter(m => m.project_id === activeProject.id)} setTaskModal={setTaskModal} setMeetingModal={setMeetingModal} setActiveNoteId={setActiveNoteId} setView={setView} toggleTask={toggleTask} getTaskLabels={getTaskLabels} saveSection={saveSection} deleteSection={deleteSection} setProjectModal={setProjectModal} createNote={createNote} saveTask={saveTask} />}
        </div>
      </main>

      {/* === BOTTOM TABS (mobile) === */}
      <nav className="bottom-tabs">
        <button className={`bottom-tab ${view === 'home' ? 'active' : ''}`} onClick={() => { setView('home'); setActiveProjectId(null); }}>
          <span className="tab-icon">🏠</span><span>Home</span>
        </button>
        <button className={`bottom-tab ${view === 'inbox' ? 'active' : ''} ${inboxItems.length ? 'has-badge' : ''}`} data-count={inboxItems.length} onClick={() => { setView('inbox'); setActiveProjectId(null); }}>
          <span className="tab-icon">📥</span><span>Inbox</span>
        </button>
        <button className={`bottom-tab ${view === 'today' ? 'active' : ''}`} onClick={() => { setView('today'); setActiveProjectId(null); }}>
          <span className="tab-icon">📅</span><span>Today</span>
        </button>
        <button className={`bottom-tab ${view === 'calendar' ? 'active' : ''}`} onClick={() => { setView('calendar'); setActiveProjectId(null); }}>
          <span className="tab-icon">🗓️</span><span>Calendar</span>
        </button>
        <button className={`bottom-tab ${view === 'project' || view === 'notes' || view === 'filters' ? 'active' : ''}`} onClick={() => { setView('home'); setActiveProjectId(null); setShowSettings(true); }}>
          <span className="tab-icon">☰</span><span>More</span>
        </button>
      </nav>

      {(view === 'today' || view === 'calendar' || view === 'home' || view === 'project') && (
        <button className="fab" onClick={() => setTaskModal({ project_id: activeProjectId, date: view === 'today' ? todayDateStr : null })}>+</button>
      )}

      {/* Modals */}
      {taskModal && <TaskModal task={taskModal} projects={projects} sections={sections} labels={labels} taskLabels={taskLabels} onSave={saveTask} onDelete={deleteTask} onClose={() => setTaskModal(null)} />}
      {meetingModal && <MeetingModal meeting={meetingModal} projects={projects} onSave={saveMeeting} onDelete={deleteMeeting} onClose={() => setMeetingModal(null)} />}
      {projectModal && <ProjectModal project={projectModal} onSave={saveProject} onDelete={deleteProject} onClose={() => setProjectModal(null)} />}
      {labelModal && <LabelModal label={labelModal} onSave={saveLabel} onDelete={deleteLabel} onClose={() => setLabelModal(null)} />}
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} theme={theme} setTheme={setTheme} onShowImport={() => { setShowSettings(false); setShowImport(true); }} workspaceMode={workspaceMode} setWorkspaceMode={setWorkspaceMode} projects={projects} setProjectModal={setProjectModal} labels={labels} setLabelModal={setLabelModal} />}
      {showImport && <ImportMeetingsModal onClose={() => setShowImport(false)} onImport={async (mts) => {
        for (const m of mts) {
          await supabase.from('command_meetings').insert([{ date: m.date, title: m.title, start_time: m.start_time, duration: m.duration, job: m.job || '#5DCFA0', icon: m.icon || '📅', start_minutes: minutesFromTime(m.start_time), end_minutes: minutesFromTime(m.start_time) + m.duration, recurrence: 'none' }]);
        }
        showToast(`Imported ${mts.length}`);
        setShowImport(false);
        loadMeetings();
      }} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
};


// =================== HOME ===================
const HomeView = ({ projects, todayTasks, todayMeetings, inboxItems, pinnedNote, scratchPad, scratchSaved, updateScratch, setView, setActiveProjectId, setTaskModal, setMeetingModal, toggleTask, setActiveNoteId, createNote, notes, getProjectById }) => {
  const pendingTasks = todayTasks.filter(t => !t.completed);
  const recentNotes = notes.slice(0, 5);

  return (
    <>
      <div className="home-grid">
        <div className="home-card">
          <div className="home-card-head">
            <div className="home-card-title">📋 Today's Tasks</div>
            <button className="home-card-link" onClick={() => setView('today')}>View all →</button>
          </div>
          <div className="home-card-body">
            {pendingTasks.length === 0 ? (
              <div className="home-empty">No tasks today ✨</div>
            ) : (
              pendingTasks.slice(0, 6).map(t => {
                const proj = t.project_id ? getProjectById(t.project_id) : null;
                const color = proj?.color || '#888';
                return (
                  <div key={t.id} className="home-list-item" style={{ borderLeftColor: color }} onClick={() => setTaskModal(t)}>
                    <div style={{ width: 14, height: 14, border: `1.5px solid ${color}`, borderRadius: '50%', flexShrink: 0, cursor: 'pointer' }} onClick={(e) => { e.stopPropagation(); toggleTask(t); }}></div>
                    <span className="item-text">{t.title}</span>
                    {proj && <span className="item-meta">{proj.name}</span>}
                  </div>
                );
              })
            )}
          </div>
        </div>
